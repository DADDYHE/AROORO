    <style id="theme-vars">
/* ============================================================
   Pet Luxury Mini-Program — Design Token System
   Migrated from olive-green fresh-food app to healing light-luxury pet brand
   Brand prefix: petlux
   ============================================================ */

:root {
  /* ---------- Brand Primary (single hue: warm olive green) ---------- */
  --petlux-brand: #4F5E35;           /* primary olive — CTAs, active states */
  --petlux-brand-deep: #3A4626;      /* hover / pressed step */
  --petlux-brand-soft: #EAEDDF;      /* 8% brand tint for tags, soft fills */
  --petlux-brand-ink: #FAFAF6;       /* text on brand fills */

  /* ---------- Surfaces (olive-tinted — brand primary light variant) ---------- */
  --petlux-bg: #EDF0E2;              /* olive-tinted page base — brand light variant */
  --petlux-surface: #FFFFFF;         /* white card */
  --petlux-surface-2: #E2E6D3;       /* olive hover / selected */
  --petlux-surface-3: #D6DBC5;       /* deeper olive fill */

  /* ---------- Ink (text) ---------- */
  --petlux-ink: #2A2823;             /* primary text — warm near-black */
  --petlux-ink-2: #635E54;           /* secondary text */
  --petlux-ink-3: #9A9489;           /* tertiary / placeholder */

  /* ---------- Lines & Dividers ---------- */
  --petlux-line: #D8DCCE;            /* hairline divider — olive tint */
  --petlux-line-strong: #C9CFBA;     /* emphasized border */

  /* ---------- State Colors (semantic only, never brand) ---------- */
  --petlux-state-success: #5B7C4A;
  --petlux-state-warning: #B8893A;
  --petlux-state-error: #A85B4A;
  --petlux-state-info: #6B7D8C;

  /* ---------- Radius Scale (2 / 8 / 12 / 16) ---------- */
  --petlux-radius-xs: 4px;
  --petlux-radius-sm: 8px;
  --petlux-radius-md: 12px;
  --petlux-radius-lg: 16px;
  --petlux-radius-pill: 999px;

  /* ---------- Shadow (subtle, alpha <= 0.05 for static) ---------- */
  --petlux-shadow-1: 0 1px 3px rgba(42,40,35,0.04), 0 1px 2px rgba(42,40,35,0.03);
  --petlux-shadow-2: 0 8px 24px -8px rgba(42,40,35,0.12);
  --petlux-shadow-3: 0 16px 48px -16px rgba(42,40,35,0.20);

  /* ---------- Spacing (8pt grid) ---------- */
  --petlux-s-1: 4px;
  --petlux-s-2: 8px;
  --petlux-s-3: 12px;
  --petlux-s-4: 16px;
  --petlux-s-5: 24px;
  --petlux-s-6: 32px;
  --petlux-s-7: 48px;

  /* ---------- Typography ---------- */
  --petlux-font-sans: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --petlux-font-latin: "Inter", system-ui, sans-serif;
  --petlux-font-mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;

  --petlux-text-display: 32px;
  --petlux-text-h1: 24px;
  --petlux-text-h2: 20px;
  --petlux-text-h3: 17px;
  --petlux-text-body: 15px;
  --petlux-text-body-sm: 13px;
  --petlux-text-caption: 12px;

  --petlux-leading-tight: 1.2;
  --petlux-leading-normal: 1.55;
  --petlux-leading-relaxed: 1.7;

  --petlux-weight-regular: 400;
  --petlux-weight-medium: 500;
  --petlux-weight-semibold: 600;

  --petlux-tracking-tight: -0.02em;
  --petlux-tracking-normal: 0;
  --petlux-tracking-wide: 0.01em;

  /* ============================================================
     Semantic Aliases — required by apply-html-head-contract.mjs
     ============================================================ */

  --petlux-background: var(--petlux-bg);
  --petlux-foreground: var(--petlux-ink);

  --petlux-card: var(--petlux-surface);
  --petlux-card-foreground: var(--petlux-ink);

  --petlux-popover: var(--petlux-surface);
  --petlux-popover-foreground: var(--petlux-ink);

  --petlux-primary: var(--petlux-brand);
  --petlux-primary-foreground: var(--petlux-brand-ink);

  --petlux-secondary: var(--petlux-surface-2);
  --petlux-secondary-foreground: var(--petlux-ink-2);

  --petlux-muted: var(--petlux-surface-2);
  --petlux-muted-foreground: var(--petlux-ink-2);

  --petlux-accent: var(--petlux-brand-soft);
  --petlux-accent-foreground: var(--petlux-brand);

  --petlux-destructive: var(--petlux-state-error);
  --petlux-destructive-foreground: #FAFAF6;

  --petlux-border: var(--petlux-line);
  --petlux-input: var(--petlux-line-strong);
  --petlux-ring: var(--petlux-brand);

  --petlux-radius-small: var(--petlux-radius-sm);
  --petlux-radius-medium: var(--petlux-radius-md);
  --petlux-radius-large: var(--petlux-radius-lg);
}

/* ---------- Dark mode stub (project is light-only; reserved) ---------- */
.dark {
  --petlux-background: #161612;
  --petlux-foreground: #EDE9E0;
  --petlux-card: #1F1E1A;
  --petlux-card-foreground: #EDE9E0;
  --petlux-popover: #1F1E1A;
  --petlux-popover-foreground: #EDE9E0;
  --petlux-primary: #7A8C5A;
  --petlux-primary-foreground: #161612;
  --petlux-muted: #2A2924;
  --petlux-muted-foreground: #9A9489;
  --petlux-border: #34322C;
  --petlux-input: #34322C;
  --petlux-ring: #7A8C5A;
}
    </style>

<body class="min-h-screen font-sans antialiased">
<style id="critical-layout">
  html, body { max-width: 100%; overflow-x: hidden; }
  body { margin: 0; background-color: var(--petlux-background); -webkit-font-smoothing: antialiased; }
  img { display: block; max-width: 100%; }
  main > .petlux-shell { width: 100%; max-width: 28rem; margin-left: auto; margin-right: auto; }
  header[data-topbar] { min-height: 56px; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
</style>
<style id="petlux-utilities">
  .petlux-tap { transition: background-color .2s ease, opacity .2s ease, transform .15s ease; }
  .petlux-tap:hover { background-color: var(--petlux-muted); }
  .petlux-tap:active { opacity: .65; transform: scale(.97); }
  .petlux-fab { box-shadow: var(--petlux-shadow-2); }
  @media (prefers-reduced-motion: reduce) {
    .petlux-tap { transition: none; }
  }
</style>
<main>
  <div class="fixed top-0 right-3 z-50 flex items-center w-[88px] h-8 rounded-full border border-black/10 shrink-0" style="top: calc(env(safe-area-inset-top, 0px) + 12px);">
      <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="更多">
        <i data-lucide="more-horizontal" class="w-4 h-4 text-foreground"></i>
      </button>
      <span class="w-px h-3 bg-black/10 block"></span>
      <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
        <i data-lucide="x" class="w-4 h-4 text-foreground"></i>
      </button>
    </div>

<button type="button" aria-label="返回" class="flex items-center justify-center w-8 h-8 -ml-1 text-foreground petlux-tap rounded-full">

    <button type="button" data-tab="album" class="tab-button bg-card text-muted-foreground rounded-full px-4 py-1.5 text-sm font-medium petlux-tap border border-border">相册</button>

      <!-- 视频 1 -->
      <div class="video-slide snap-start h-[calc(100dvh-7rem)] flex flex-col justify-center px-5">

        <span class="bg-primary-foreground/90 rounded-[2px]"></span>

  <!-- ========== 相册 Tab 内容（默认隐藏） ========== -->

      <div class="absolute inset-0 bg-gradient-to-br from-primary/20 to-accent"></div>

        <span class="absolute inset-0 bg-gradient-to-br from-primary/20 to-accent"></span>
      </button>
      <button type="button" class="thumbnail-item aspect-square rounded-lg overflow-hidden relative petlux-tap" data-index="1">
        <span class="absolute inset-0 bg-gradient-to-br from-primary/25 to-accent"></span>
      </button>
      <button type="button" class="thumbnail-item aspect-square rounded-lg overflow-hidden relative petlux-tap" data-index="2">
        <span class="absolute inset-0 bg-gradient-to-br from-primary/20 to-[#D6DBC5]"></span>
      </button>
      <button type="button" class="thumbnail-item aspect-square rounded-lg overflow-hidden relative petlux-tap" data-index="3">
        <span class="absolute inset-0 bg-gradient-to-br from-[#A8C0A0] to-accent"></span>
      </button>
      <button type="button" class="thumbnail-item aspect-square rounded-lg overflow-hidden relative petlux-tap" data-index="4">
        <span class="absolute inset-0 bg-gradient-to-br from-primary/15 to-[#E2E6D3]"></span>
      </button>
      <button type="button" class="thumbnail-item aspect-square rounded-lg overflow-hidden relative petlux-tap" data-index="5">
        <span class="absolute inset-0 bg-gradient-to-br from-primary/20 to-accent"></span>
      </button>
    </div>

    <!-- 空状态（结构保留，有数据时隐藏） -->
    <div class="empty-state hidden flex-col items-center justify-center pt-16 pb-10 text-center">
      <i data-lucide="images" class="w-12 h-12 text-muted-foreground/50"></i>
      <p class="text-sm text-muted-foreground mt-3">暂无照片</p>
    </div>
  </section>

</div>
</main>
<script>
  lucide.createIcons();

  // Tab 切换
  const tabs = document.querySelectorAll('.tab-button');
  const panelVideo = document.getElementById('panel-video');
  const panelAlbum = document.getElementById('panel-album');
  const gridToggle = document.getElementById('grid-toggle');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const target = tab.dataset.tab;
      tabs.forEach(t => {
        const active = t === tab;
        t.classList.toggle('bg-primary', active);
        t.classList.toggle('text-primary-foreground', active);
        t.classList.toggle('bg-card', !active);
        t.classList.toggle('text-muted-foreground', !active);
        t.classList.toggle('border', !active);
        t.classList.toggle('border-border', !active);
      });
      if (target === 'video') {
        panelVideo.classList.remove('hidden');
        panelAlbum.classList.add('hidden');
        gridToggle && gridToggle.classList.remove('hidden');
      } else {
        panelVideo.classList.add('hidden');
        panelAlbum.classList.remove('hidden');
        gridToggle && gridToggle.classList.add('hidden');
      }
    });
  });

  // 缩略图切换主图计数
  const thumbnails = document.querySelectorAll('.thumbnail-item');
  const albumCount = document.getElementById('album-count');
  thumbnails.forEach(th => {
    th.addEventListener('click', () => {
      thumbnails.forEach(t => { t.classList.remove('active', 'ring-2', 'ring-primary'); });
      th.classList.add('active', 'ring-2', 'ring-primary');
      const idx = parseInt(th.dataset.index, 10) + 1;
      if (albumCount) albumCount.textContent = idx + ' / 6';
    });
  });
</script>
</body>
</html>
