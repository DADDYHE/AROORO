    <style id="theme-vars">
/* ============================================================
   Pet Luxury Mini-Program — Design Token System
   Brand prefix: petlux
   ============================================================ */

:root {
  --petlux-brand: #4F5E35;
  --petlux-brand-deep: #3A4626;
  --petlux-brand-soft: #EAEDDF;
  --petlux-brand-ink: #FAFAF6;

  --petlux-bg: #EDF0E2;
  --petlux-surface: #FFFFFF;
  --petlux-surface-2: #E2E6D3;
  --petlux-surface-3: #D6DBC5;

  --petlux-ink: #2A2823;
  --petlux-ink-2: #635E54;
  --petlux-ink-3: #9A9489;

  --petlux-line: #D8DCCE;
  --petlux-line-strong: #C9CFBA;

  --petlux-state-success: #5B7C4A;
  --petlux-state-warning: #B8893A;
  --petlux-state-error: #A85B4A;
  --petlux-state-info: #6B7D8C;

  --petlux-radius-xs: 4px;
  --petlux-radius-sm: 8px;
  --petlux-radius-md: 12px;
  --petlux-radius-lg: 16px;
  --petlux-radius-pill: 999px;

  --petlux-shadow-1: 0 1px 3px rgba(42,40,35,0.04), 0 1px 2px rgba(42,40,35,0.03);
  --petlux-shadow-2: 0 8px 24px -8px rgba(42,40,35,0.12);
  --petlux-shadow-3: 0 16px 48px -16px rgba(42,40,35,0.20);

  --petlux-s-1: 4px; --petlux-s-2: 8px; --petlux-s-3: 12px;
  --petlux-s-4: 16px; --petlux-s-5: 24px; --petlux-s-6: 32px; --petlux-s-7: 48px;

  --petlux-font-sans: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --petlux-font-mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;

  --petlux-text-display: 32px;
  --petlux-text-h1: 24px;
  --petlux-text-h2: 20px;
  --petlux-text-h3: 17px;
  --petlux-text-body: 15px;
  --petlux-text-body-sm: 13px;
  --petlux-text-caption: 12px;

  --petlux-weight-regular: 400;
  --petlux-weight-medium: 500;
  --petlux-weight-semibold: 600;

  /* Semantic Aliases */
  --petlux-background: var(--petlux-bg);
  --petlux-foreground: var(--petlux-ink);
  --petlux-card: var(--petlux-surface);
  --petlux-card-foreground: var(--petlux-ink);
  --petlux-popover: var(--petlux-surface);
  --petlux-popover-foreground: var(--petlux-ink);
  --petlux-primary: var(--petlux-brand);
  --petlux-primary-foreground: var(--petlux-brand-ink);
  --petlux-secondary: var(--petlux-surface-2);
  --petlux-secondary-foreground: var(--petlux-ink-2);
  --petlux-muted: var(--petlux-surface-2);
  --petlux-muted-foreground: var(--petlux-ink-2);
  --petlux-accent: var(--petlux-brand-soft);
  --petlux-accent-foreground: var(--petlux-brand);
  --petlux-destructive: var(--petlux-state-error);
  --petlux-destructive-foreground: #FAFAF6;
  --petlux-border: var(--petlux-line);
  --petlux-input: var(--petlux-line-strong);
  --petlux-ring: var(--petlux-brand);
  --petlux-radius-small: var(--petlux-radius-sm);
  --petlux-radius-medium: var(--petlux-radius-md);
  --petlux-radius-large: var(--petlux-radius-lg);
}

.dark {
  --petlux-background: #161612;
  --petlux-foreground: #EDE9E0;
  --petlux-card: #1F1E1A;
  --petlux-card-foreground: #EDE9E0;
  --petlux-popover: #1F1E1A;
  --petlux-popover-foreground: #EDE9E0;
  --petlux-primary: #7A8C5A;
  --petlux-primary-foreground: #161612;
  --petlux-muted: #2A2924;
  --petlux-muted-foreground: #9A9489;
  --petlux-border: #34322C;
  --petlux-input: #34322C;
  --petlux-ring: #7A8C5A;
}
    </style>

      .text-secondary-foreground { color: var(--petlux-secondary-foreground); }
      .bg-muted { background-color: var(--petlux-muted); }
      .text-muted { color: var(--petlux-muted); }
      .border-muted { border-color: var(--petlux-muted); }
      .bg-muted-foreground { background-color: var(--petlux-muted-foreground); }
      .text-muted-foreground { color: var(--petlux-muted-foreground); }
      .border-muted-foreground { border-color: var(--petlux-muted-foreground); }
      .bg-accent { background-color: var(--petlux-accent); }
      .text-accent { color: var(--petlux-accent); }
      .border-accent { border-color: var(--petlux-accent); }
      .bg-accent-foreground { background-color: var(--petlux-accent-foreground); }
      .text-accent-foreground { color: var(--petlux-accent-foreground); }

      .bg-destructive { background-color: var(--petlux-destructive); }

      .border-destructive { border-color: var(--petlux-destructive); }
      .bg-destructive-foreground { background-color: var(--petlux-destructive-foreground); }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .text-ink { color: var(--petlux-ink); }
      .text-ink-2 { color: var(--petlux-ink-2); }
      .text-ink-3 { color: var(--petlux-ink-3); }
      .brand-ring { animation: spin 1.2s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

</head>
<body class="min-h-screen font-sans antialiased">
<style id="critical-layout">
html, body { max-width: 100%; overflow-x: hidden; }
body { margin: 0; background-color: var(--petlux-background); -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
main > .petlux-shell { width: 100%; max-width: 28rem; margin-left: auto; margin-right: auto; }
header[data-topbar] { min-height: 56px; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }
</style>
<style id="petlux-utilities">
  .petlux-card { box-shadow: var(--petlux-shadow-1); transition: transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s ease; }
  .petlux-card:hover { transform: translateY(-2px); box-shadow: var(--petlux-shadow-2); }
  .petlux-tap { transition: background-color .2s ease, opacity .2s ease; }
  .petlux-tap:hover { background-color: var(--petlux-muted); }
  .petlux-tap:active { opacity: .65; }
  .petlux-btn-press { transition: transform .15s ease, box-shadow .25s ease, background-color .2s ease; }
  .petlux-btn-press:hover { box-shadow: var(--petlux-shadow-2); }
  .petlux-btn-press:active { transform: scale(.98); }
  .card-accent-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 0 3px 3px 0; }
</style>
<main>
  <div class="fixed top-0 right-3 z-50 flex items-center w-[88px] h-8 rounded-full border border-black/10 shrink-0" style="top: calc(env(safe-area-inset-top, 0px) + 12px);">
      <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="更多">
        <i data-lucide="more-horizontal" class="w-4 h-4 text-foreground"></i>
      </button>
      <span class="w-px h-3 bg-black/10 block"></span>
      <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
        <i data-lucide="x" class="w-4 h-4 text-foreground"></i>
      </button>
    </div>

<div class="petlux-shell max-w-md mx-auto bg-background min-h-screen pb-28 relative">

  <!-- Sticky Topbar -->
  <header data-topbar class="sticky top-0 z-30 h-14 px-4 flex items-center justify-between bg-background/95 backdrop-blur-sm border-b border-border">
<button class="flex items-center justify-center w-8 h-8 -ml-1 petlux-tap rounded-full" aria-label="返回">
      <i data-lucide="arrow-left" class="w-5 h-5 text-foreground"></i>
    </button>
    <span class="text-base font-medium text-foreground">活动管理</span>
    <div class="w-8 h-8 gap-2">
      </div>
  </header>

  <!-- Gallery Container -->
  <div class="gallery-container">

    <!-- Gallery Header -->
    <div class="gallery-header pt-6 pb-2">
      <div class="brand-block relative px-4">
        <div class="brand-accent-bar absolute top-0 left-4 w-3 h-1.5 bg-primary rounded-b-[3px]"></div>
        <div class="brand-main relative mb-3">
          <span class="brand-text block text-3xl font-light tracking-[0.2em] text-ink leading-none">活动管理</span>
        </div>
        <div class="brand-meta flex items-center gap-2">
          <div class="brand-meta-line relative w-6 h-px bg-border">
          </div>
          <span class="brand-subtitle text-xs text-ink-2 tracking-[0.15em]">共 4 个活动</span>
        </div>
      </div>
    </div>

    <!-- Filter Section -->
    <div class="filter-section bg-background sticky top-14 z-20 pb-2">
      <!-- Tab Row -->
      <div class="tab-row flex justify-between gap-2 px-4 pt-1 pb-2">
        <div class="tab-item flex flex-col items-center justify-center py-1.5 rounded-md text-[13px] text-ink-2 bg-card flex-1 petlux-card relative">

          <div class="tab-indicator-dot w-1.5 h-1.5 rounded-full bg-primary-foreground mt-1"></div>
        </div>
        <div class="tab-item flex flex-col items-center justify-center py-1.5 rounded-md text-[13px] text-ink-2 bg-card flex-1 petlux-card">

        </div>
        <div class="tab-item flex flex-col items-center justify-center py-1.5 rounded-md text-[13px] text-ink-2 bg-card flex-1 petlux-card">
          <span class="tab-text tracking-wide">已结束</span>
        </div>
        <div class="tab-item flex flex-col items-center justify-center py-1.5 rounded-md text-[13px] text-ink-2 bg-card flex-1 petlux-card">
          <span class="tab-text tracking-wide">草稿</span>
        </div>
      </div>

      <!-- The active tab is the first one (全部), style it with primary bg -->
      <style>
        .tab-row .tab-item:first-child {
          background-color: var(--petlux-primary);
          color: var(--petlux-primary-foreground);
        }
        .tab-row .tab-item:first-child .tab-text { color: var(--petlux-primary-foreground); }
      </style>

      <!-- Search Bar -->
      <div class="search-bar px-4 pb-2">
