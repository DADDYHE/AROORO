    <style id="theme-vars">
/* ============================================================
   Pet Luxury Mini-Program — Design Token System
   Migrated from olive-green fresh-food app to healing light-luxury pet brand
   Brand prefix: petlux
   ============================================================ */

:root {
  /* ---------- Brand Primary (single hue: warm olive green) ---------- */
  --petlux-brand: #4F5E35;           /* primary olive — CTAs, active states */
  --petlux-brand-deep: #3A4626;      /* hover / pressed step */
  --petlux-brand-soft: #EAEDDF;      /* 8% brand tint for tags, soft fills */
  --petlux-brand-ink: #FAFAF6;       /* text on brand fills */

  /* ---------- Surfaces (olive-tinted — brand primary light variant) ---------- */
  --petlux-bg: #EDF0E2;              /* olive-tinted page base — brand light variant */
  --petlux-surface: #FFFFFF;         /* white card */
  --petlux-surface-2: #E2E6D3;       /* olive hover / selected */
  --petlux-surface-3: #D6DBC5;       /* deeper olive fill */

  /* ---------- Ink (text) ---------- */
  --petlux-ink: #2A2823;             /* primary text — warm near-black */
  --petlux-ink-2: #635E54;           /* secondary text */
  --petlux-ink-3: #9A9489;           /* tertiary / placeholder */

  /* ---------- Lines & Dividers ---------- */
  --petlux-line: #D8DCCE;            /* hairline divider — olive tint */
  --petlux-line-strong: #C9CFBA;     /* emphasized border */

  /* ---------- State Colors (semantic only, never brand) ---------- */
  --petlux-state-success: #5B7C4A;
  --petlux-state-warning: #B8893A;
  --petlux-state-error: #A85B4A;
  --petlux-state-info: #6B7D8C;

  /* ---------- Radius Scale (2 / 8 / 12 / 16) ---------- */
  --petlux-radius-xs: 4px;
  --petlux-radius-sm: 8px;
  --petlux-radius-md: 12px;
  --petlux-radius-lg: 16px;
  --petlux-radius-pill: 999px;

  /* ---------- Shadow (subtle, alpha <= 0.05 for static) ---------- */
  --petlux-shadow-1: 0 1px 3px rgba(42,40,35,0.04), 0 1px 2px rgba(42,40,35,0.03);
  --petlux-shadow-2: 0 8px 24px -8px rgba(42,40,35,0.12);
  --petlux-shadow-3: 0 16px 48px -16px rgba(42,40,35,0.20);

  /* ---------- Spacing (8pt grid) ---------- */
  --petlux-s-1: 4px;
  --petlux-s-2: 8px;
  --petlux-s-3: 12px;
  --petlux-s-4: 16px;
  --petlux-s-5: 24px;
  --petlux-s-6: 32px;
  --petlux-s-7: 48px;

  /* ---------- Typography ---------- */
  --petlux-font-sans: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --petlux-font-latin: "Inter", system-ui, sans-serif;
  --petlux-font-mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;

  --petlux-text-display: 32px;
  --petlux-text-h1: 24px;
  --petlux-text-h2: 20px;
  --petlux-text-h3: 17px;
  --petlux-text-body: 15px;
  --petlux-text-body-sm: 13px;
  --petlux-text-caption: 12px;

  --petlux-leading-tight: 1.2;
  --petlux-leading-normal: 1.55;
  --petlux-leading-relaxed: 1.7;

  --petlux-weight-regular: 400;
  --petlux-weight-medium: 500;
  --petlux-weight-semibold: 600;

  --petlux-tracking-tight: -0.02em;
  --petlux-tracking-normal: 0;
  --petlux-tracking-wide: 0.01em;

  /* ============================================================
     Semantic Aliases — required by apply-html-head-contract.mjs
     ============================================================ */

  --petlux-background: var(--petlux-bg);
  --petlux-foreground: var(--petlux-ink);

  --petlux-card: var(--petlux-surface);
  --petlux-card-foreground: var(--petlux-ink);

  --petlux-popover: var(--petlux-surface);
  --petlux-popover-foreground: var(--petlux-ink);

  --petlux-primary: var(--petlux-brand);
  --petlux-primary-foreground: var(--petlux-brand-ink);

  --petlux-secondary: var(--petlux-surface-2);
  --petlux-secondary-foreground: var(--petlux-ink-2);

  --petlux-muted: var(--petlux-surface-2);
  --petlux-muted-foreground: var(--petlux-ink-2);

  --petlux-accent: var(--petlux-brand-soft);
  --petlux-accent-foreground: var(--petlux-brand);

  --petlux-destructive: var(--petlux-state-error);
  --petlux-destructive-foreground: #FAFAF6;

  --petlux-border: var(--petlux-line);
  --petlux-input: var(--petlux-line-strong);
  --petlux-ring: var(--petlux-brand);

  --petlux-radius-small: var(--petlux-radius-sm);
  --petlux-radius-medium: var(--petlux-radius-md);
  --petlux-radius-large: var(--petlux-radius-lg);
}

/* ---------- Dark mode stub (project is light-only; reserved) ---------- */
.dark {
  --petlux-background: #161612;
  --petlux-foreground: #EDE9E0;
  --petlux-card: #1F1E1A;
  --petlux-card-foreground: #EDE9E0;
  --petlux-popover: #1F1E1A;
  --petlux-popover-foreground: #EDE9E0;
  --petlux-primary: #7A8C5A;
  --petlux-primary-foreground: #161612;
  --petlux-secondary: #2A2924;
  --petlux-secondary-foreground: #9A9489;
  --petlux-muted: #2A2924;
  --petlux-muted-foreground: #9A9489;
  --petlux-accent: #2A2924;
  --petlux-accent-foreground: #7A8C5A;
  --petlux-destructive: #A85B4A;
  --petlux-destructive-foreground: #FAFAF6;
  --petlux-border: #34322C;
  --petlux-input: #34322C;
  --petlux-ring: #7A8C5A;
}

    </style>

<body class="min-h-screen font-sans antialiased">
<style id="critical-layout">
html, body { max-width: 100%; overflow-x: hidden; }
body { margin: 0; background-color: var(--petlux-background); }
img { display: block; max-width: 100%; }
main > .petlux-shell { width: 100%; max-width: 28rem; margin-left: auto; margin-right: auto; }
header[data-topbar] { min-height: 56px; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }
</style>
<style id="petlux-utilities">
  .petlux-card { box-shadow: var(--petlux-shadow-1); transition: transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s ease; }
  .petlux-tap { transition: background-color .2s ease, opacity .2s ease; -webkit-tap-highlight-color: transparent; }
  .petlux-tap:active { opacity: .65; }
  .petlux-section-index { font-feature-settings: "tnum"; }
  .petlux-coupon-ticket {
    position: relative;
  }
  .petlux-coupon-ticket::before,
  .petlux-coupon-ticket::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 10px;
    height: 10px;
    border-radius: 999px;
    background: var(--petlux-background);
    transform: translateY(-50%);
    z-index: 5;
  }
  .petlux-coupon-ticket::before { left: 64px; }
  .petlux-coupon-ticket::after { left: 64px; top: auto; bottom: -5px; transform: none; }
  .petlux-submit-btn {
    background: linear-gradient(135deg, var(--petlux-brand) 0%, var(--petlux-brand-deep) 100%);
    box-shadow: var(--petlux-shadow-2);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .petlux-submit-btn:active { transform: translateY(1px); box-shadow: var(--petlux-shadow-1); }
  .petlux-coupon-item { transition: background-color .2s ease, opacity .2s ease; }
  .petlux-coupon-item:active { opacity: .7; }
  @media (prefers-reduced-motion: reduce) {
    .petlux-card, .petlux-tap, .petlux-submit-btn, .petlux-coupon-item { transition: none; }
    .petlux-card:hover { transform: none; }
  }
</style>
<main>

<div class="petlux-shell max-w-md mx-auto bg-background min-h-screen pb-28">

  <!-- 顶部画廊header：sticky 顶部导航栏（返回 + 标题） -->
  <header data-topbar class="sticky top-0 z-30 h-14 flex items-center px-4 bg-background/95 backdrop-blur-sm border-b border-border">
<button type="button" aria-label="返回" class="flex items-center justify-center w-8 h-8 -ml-1 text-foreground petlux-tap rounded-full">

    <h1 class="absolute left-1/2 -translate-x-1/2 text-base font-semibold text-foreground">提交订单</h1>

      <i data-lucide="headphones" class="w-5 h-5"></i>
    </button>
  </header>

  <!-- 顶部画廊header：竖条 + AROORO + 大标题 + 副标题 -->
  <header class="px-5 pt-7 pb-5">
    <div class="flex flex-col gap-2">
      <div class="flex items-center gap-2">
        <span class="w-1 h-5 bg-primary block rounded-full"></span>
        <span class="text-[11px] tracking-[0.2em] text-muted-foreground font-mono uppercase">AROORO</span>
      </div>
      <h2 class="text-2xl font-light tracking-widest text-foreground">提交订单</h2>
      <div class="flex items-center gap-2">
        <span class="w-4 h-px bg-muted-foreground/50 block"></span>
        <span class="text-[12px] text-muted-foreground">专业喂养 · 安心托付</span>
      </div>
    </div>
  </header>

  <!-- 喂养师信息区：名称 + 价格/次 -->
  <section class="px-5 mb-3">
    <div class="feeder-info petlux-card bg-card rounded-md p-4 flex items-center gap-3.5">
      <div class="w-12 h-12 rounded-full bg-accent flex items-center justify-center shrink-0 overflow-hidden ring-1 ring-border">
        <img src="../assets/avatar-user.jpg" alt="王晓雯" class="w-full h-full object-cover" />
      </div>
      <div class="flex-1 min-w-0 flex flex-col gap-1.5">
        <div class="flex items-center gap-2">
          <span class="feeder-name text-[15px] font-semibold text-foreground">王晓雯</span>
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-accent text-[10px] text-accent-foreground">
            <i data-lucide="badge-check" class="w-2.5 h-2.5"></i>认证喂养师
          </span>
        </div>
        <div class="flex items-center gap-3 text-[11px] text-muted-foreground">
          <span class="flex items-center gap-1">
            <i data-lucide="paw-print" class="w-3 h-3"></i>已服务 328 单
          </span>
          <span class="flex items-center gap-1">
            <i data-lucide="star" class="w-3 h-3"></i>好评 99%
          </span>
        </div>
      </div>
      <div class="feeder-price shrink-0 text-right">
        <div class="flex items-baseline font-mono text-primary justify-end">
          <span class="text-[13px] font-semibold">¥</span>
          <span class="text-[22px] font-semibold leading-none">80</span>
          <span class="text-[12px] text-muted-foreground ml-0.5 font-sans">/次</span>
        </div>
        <span class="text-[11px] text-muted-foreground mt-1 block">单次上门喂养</span>
      </div>
    </div>
  </section>

  <!-- 表单区：服务日期 / 服务地址 / 备注 -->
  <section class="px-5 mb-3">
    <div class="form-section bg-card rounded-md shadow-[var(--petlux-shadow-1)] overflow-hidden">
      <!-- 服务日期 -->
      <div class="form-row flex items-center justify-between px-4 py-3.5 border-b border-border">
        <span class="label text-[14px] text-muted-foreground flex items-center gap-2">
          <i data-lucide="calendar" class="w-4 h-4"></i>服务日期
        </span>
        <div class="flex items-center gap-1.5">
          <span class="picker-val text-[14px] text-foreground font-medium">2025年10月20日</span>
          <i data-lucide="chevron-right" class="w-4 h-4 text-muted-foreground"></i>
        </div>
      </div>
      <!-- 服务地址 -->
      <button type="button" class="form-row petlux-tap w-full flex items-center justify-between px-4 py-3.5 border-b border-border text-left">
        <span class="label text-[14px] text-muted-foreground flex items-center gap-2 shrink-0">
          <i data-lucide="map-pin" class="w-4 h-4"></i>服务地址
        </span>
        <div class="flex items-center gap-1.5 min-w-0">
          <span class="picker-val text-[14px] text-foreground font-medium truncate max-w-[180px]">上海市徐汇区某某路123号</span>
          <i data-lucide="chevron-right" class="w-4 h-4 text-muted-foreground shrink-0"></i>

          <i data-lucide="message-square-text" class="w-4 h-4"></i>备注

      </div>
    </div>
  </section>

  <!-- 优惠券区：可展开选择，显示已选优惠券 + 可用券列表 -->
  <section class="px-5 mb-3">
    <div class="form-section coupon-section bg-card rounded-md shadow-[var(--petlux-shadow-1)] overflow-hidden">
      <!-- section-title（展开状态，已选优惠券故不显示"X张可用"角标） -->
      <button type="button" class="section-title petlux-tap w-full flex items-center justify-between px-4 py-3.5 text-left">
        <span class="flex items-center gap-2">
          <i data-lucide="ticket" class="w-4 h-4 text-primary"></i>
          <span class="text-[14px] font-medium text-foreground">优惠券</span>
        </span>
        <div class="flex items-center gap-1.5">
          <i data-lucide="chevron-up" class="w-4 h-4 text-muted-foreground"></i>
        </div>
      </button>

      <!-- selected-coupon：已选优惠券条目 -->
      <div class="selected-coupon px-4 pb-2.5 flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-accent text-[12px] text-accent-foreground font-medium">
          <i data-lucide="badge-percent" class="w-3 h-3"></i>
          新客喂养券 -¥10
        </span>
        <button type="button" class="remove-coupon petlux-tap inline-flex items-center justify-center w-5 h-5 rounded-full bg-muted text-muted-foreground" aria-label="移除优惠券">
          <i data-lucide="x" class="w-3 h-3"></i>
        </button>
      </div>

      <!-- coupon-list：可用券列表（展开） -->
      <div class="coupon-list px-4 pb-4 flex flex-col gap-2.5 border-t border-border pt-3.5">
        <!-- 新客喂养券（已选） -->
        <div class="coupon-item petlux-coupon-ticket petlux-coupon-item relative flex items-stretch rounded-md overflow-hidden ring-1 ring-[color:var(--petlux-brand)]/40" data-selected="true">
          <div class="coupon-amount-left flex flex-col items-center justify-center w-[72px] py-3 bg-primary text-primary-foreground shrink-0">
            <span class="flex items-baseline font-mono">
              <span class="text-[12px]">¥</span>
              <span class="coupon-amount text-xl font-semibold leading-none">10</span>
            </span>
            <span class="text-[10px] opacity-80 mt-0.5">满50可用</span>
          </div>
          <div class="coupon-right flex-1 flex items-center justify-between px-3 py-3 bg-card">
            <div class="flex flex-col gap-0.5 min-w-0">
              <span class="coupon-name text-sm font-medium text-foreground truncate">新客喂养券</span>
              <span class="text-[11px] text-muted-foreground">2025.12.31 到期</span>
            </div>
            <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-primary shrink-0">
              <i data-lucide="check" class="w-3 h-3 text-primary-foreground"></i>
            </span>
          </div>
        </div>

        <!-- 会员普惠券（可选） -->
        <div class="coupon-item petlux-coupon-ticket petlux-coupon-item relative flex items-stretch rounded-md overflow-hidden ring-1 ring-border opacity-80">
          <div class="coupon-amount-left flex flex-col items-center justify-center w-[72px] py-3 bg-muted text-muted-foreground shrink-0">
            <span class="flex items-baseline font-mono">
              <span class="text-[12px]">¥</span>
              <span class="coupon-amount text-xl font-semibold leading-none">5</span>
            </span>
            <span class="text-[10px] opacity-80 mt-0.5">满30可用</span>
          </div>
          <div class="coupon-right flex-1 flex items-center justify-between px-3 py-3 bg-card">
            <div class="flex flex-col gap-0.5 min-w-0">
              <span class="coupon-name text-sm font-medium text-foreground truncate">会员普惠券</span>
              <span class="text-[11px] text-muted-foreground">2025.11.30 到期</span>
            </div>
            <span class="inline-flex items-center justify-center w-5 h-5 rounded-full border border-border shrink-0"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 服务说明提示 -->
  <section class="px-5 pt-1">
    <div class="flex items-start gap-2 px-1">
      <i data-lucide="info" class="w-3.5 h-3.5 text-muted-foreground shrink-0 mt-0.5"></i>
      <p class="text-[11px] text-muted-foreground leading-relaxed">喂养师上门服务约 30 分钟，包含喂食、换水、铲屎及陪伴互动。下单后 2 小时内可免费改期。</p>
    </div>
  </section>

  <!-- 安心支付提示 -->
  <section class="px-5 pt-4">
    <div class="flex items-center justify-center gap-1.5 opacity-70">
      <i data-lucide="shield-check" class="w-3.5 h-3.5 text-muted-foreground"></i>
      <span class="text-[11px] text-muted-foreground">AROORO 安心支付 · 平台担保交易</span>
    </div>
  </section>

  <!-- 底部固定栏：预估费用 + 提交订单按钮 -->
  <div class="total-row fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-40">
    <div class="bg-card/95 backdrop-blur-md border-t border-border px-5 py-3 flex items-center justify-between gap-3">
      <div class="flex flex-col gap-0.5 min-w-0">
        <span class="text-[11px] text-muted-foreground">预估费用</span>
        <span class="flex items-baseline font-mono text-primary">
          <span class="text-[13px] font-semibold">¥</span>
          <span class="price text-[22px] font-semibold leading-none">80</span>
        </span>
      </div>
      <button type="button" class="submit-btn petlux-submit-btn h-12 px-8 rounded-md flex items-center justify-center gap-2 text-primary-foreground text-[15px] font-semibold">
        <i data-lucide="shopping-bag" class="w-4 h-4"></i>
        <span>提交订单</span>
      </button>
    </div>
  </div>

  <!-- 支付确认弹窗（展开状态：原价¥80，优惠¥10，应付¥70） -->
  <div class="payment-modal fixed inset-0 z-50 flex items-center justify-center px-6">
    <!-- modal-mask：半透明遮罩 -->
    <div class="modal-mask absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
    <!-- modal-content：居中卡片，圆角16px -->
    <div class="modal-content relative bg-card rounded-lg shadow-[var(--petlux-shadow-3)] w-full max-w-[300px] p-5 flex flex-col items-center gap-4">
      <!-- modal-title -->
      <div class="modal-title flex flex-col items-center gap-2">
        <div class="w-11 h-11 rounded-full bg-accent flex items-center justify-center">
          <i data-lucide="shield-check" class="w-5 h-5 text-accent-foreground"></i>
        </div>
        <span class="text-[16px] font-semibold text-foreground">确认支付</span>
      </div>
      <!-- modal-total：价格明细 -->
      <div class="modal-total w-full flex flex-col items-center gap-1 py-3 border-y border-border">
        <span class="text-[12px] text-muted-foreground">原价 ¥80，优惠 ¥10</span>
        <div class="flex items-baseline gap-0.5 font-mono text-primary mt-1">
          <span class="text-[15px] font-semibold">¥</span>
          <span class="final-price text-[36px] font-semibold leading-none">70</span>
        </div>
        <span class="text-[11px] text-muted-foreground mt-0.5">应付金额</span>
      </div>
      <!-- pay-btn -->
      <button type="button" class="pay-btn petlux-submit-btn w-full h-11 rounded-md text-primary-foreground text-[15px] font-semibold flex items-center justify-center gap-2">
        <i data-lucide="wallet" class="w-4 h-4"></i>
        <span>确认支付</span>
      </button>
      <!-- cancel-btn -->
      <button type="button" class="cancel-btn petlux-tap w-full h-9 text-[14px] text-muted-foreground">取消</button>
    </div>
  </div>

</div>
</main>
<script>lucide.createIcons();</script>
</body>
</html>
