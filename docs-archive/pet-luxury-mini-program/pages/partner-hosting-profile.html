<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寄养档案</title>
    <style id="theme-vars">
:root {
  --petlux-brand: #4F5E35;
  --petlux-brand-deep: #3A4626;
  --petlux-brand-soft: #EAEDDF;
  --petlux-brand-ink: #FAFAF6;
  --petlux-bg: #EDF0E2;
  --petlux-surface: #FFFFFF;
  --petlux-surface-2: #E2E6D3;
  --petlux-surface-3: #D6DBC5;
  --petlux-ink: #2A2823;
  --petlux-ink-2: #635E54;
  --petlux-ink-3: #9A9489;
  --petlux-line: #D8DCCE;
  --petlux-line-strong: #C9CFBA;
  --petlux-state-success: #5B7C4A;
  --petlux-state-warning: #B8893A;
  --petlux-state-error: #A85B4A;
  --petlux-state-info: #6B7D8C;
  --petlux-radius-xs: 4px;
  --petlux-radius-sm: 8px;
  --petlux-radius-md: 12px;
  --petlux-radius-lg: 16px;
  --petlux-radius-pill: 999px;
  --petlux-shadow-1: 0 1px 3px rgba(42,40,35,0.04), 0 1px 2px rgba(42,40,35,0.03);
  --petlux-shadow-2: 0 8px 24px -8px rgba(42,40,35,0.12);
  --petlux-shadow-3: 0 16px 48px -16px rgba(42,40,35,0.20);
  --petlux-s-1: 4px; --petlux-s-2: 8px; --petlux-s-3: 12px; --petlux-s-4: 16px;
  --petlux-s-5: 24px; --petlux-s-6: 32px; --petlux-s-7: 48px;
  --petlux-font-sans: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --petlux-text-display: 32px; --petlux-text-h1: 24px; --petlux-text-h2: 20px;
  --petlux-text-h3: 17px; --petlux-text-body: 15px; --petlux-text-body-sm: 13px; --petlux-text-caption: 12px;
  --petlux-weight-regular: 400; --petlux-weight-medium: 500; --petlux-weight-semibold: 600;
  --petlux-background: var(--petlux-bg); --petlux-foreground: var(--petlux-ink);
  --petlux-card: var(--petlux-surface); --petlux-card-foreground: var(--petlux-ink);
  --petlux-popover: var(--petlux-surface); --petlux-popover-foreground: var(--petlux-ink);
  --petlux-primary: var(--petlux-brand); --petlux-primary-foreground: var(--petlux-brand-ink);
  --petlux-secondary: var(--petlux-surface-2); --petlux-secondary-foreground: var(--petlux-ink-2);
  --petlux-muted: var(--petlux-surface-2); --petlux-muted-foreground: var(--petlux-ink-2);
  --petlux-accent: var(--petlux-brand-soft); --petlux-accent-foreground: var(--petlux-brand);
  --petlux-destructive: var(--petlux-state-error); --petlux-destructive-foreground: #FAFAF6;
  --petlux-border: var(--petlux-line); --petlux-input: var(--petlux-line-strong); --petlux-ring: var(--petlux-brand);
  --petlux-radius-small: var(--petlux-radius-sm); --petlux-radius-medium: var(--petlux-radius-md); --petlux-radius-large: var(--petlux-radius-lg);
}
.dark {
  --petlux-background: #161612; --petlux-foreground: #EDE9E0;
  --petlux-card: #1F1E1A; --petlux-card-foreground: #EDE9E0;
  --petlux-popover: #1F1E1A; --petlux-popover-foreground: #EDE9E0;
  --petlux-primary: #7A8C5A; --petlux-primary-foreground: #161612;
  --petlux-muted: #2A2924; --petlux-muted-foreground: #9A9489;
  --petlux-border: #34322C; --petlux-input: #34322C; --petlux-ring: #7A8C5A;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">

        --color-background: var(--petlux-background);
        --color-foreground: var(--petlux-foreground);

        --color-card-foreground: var(--petlux-card-foreground);

        --color-muted-foreground: var(--petlux-muted-foreground);
        --color-accent: var(--petlux-accent);
        --color-accent-foreground: var(--petlux-accent-foreground);
        --color-destructive: var(--petlux-destructive);

        --radius-lg: var(--petlux-radius-lg);
      }
      @layer base {
        body { background: var(--petlux-background); color: var(--petlux-foreground); }
      }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] { display: inline-flex; align-items: center; justify-content: center; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; background-color: currentColor; }

<body class="min-h-screen font-sans antialiased">
<style id="critical-layout">
html, body { max-width: 100%; overflow-x: hidden; }
body { margin: 0; background-color: var(--petlux-background); -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
main > .petlux-shell { width: 100%; max-width: 28rem; margin-left: auto; margin-right: auto; }
</style>
<style id="petlux-utilities">
  .petlux-card { box-shadow: var(--petlux-shadow-1); transition: transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s ease; }
  .petlux-card:hover { transform: translateY(-2px); box-shadow: var(--petlux-shadow-2); }
  .petlux-tap { transition: background-color .2s ease, opacity .2s ease; }
  .petlux-tap:hover { background-color: var(--petlux-muted); }
  .petlux-tap:active { opacity: .65; }
  .petlux-btn-press { transition: transform .15s ease, box-shadow .25s ease, background-color .2s ease; }
  .petlux-btn-press:hover { box-shadow: var(--petlux-shadow-2); }
  .petlux-btn-press:active { transform: scale(.98); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .gallery-header { animation: fadeUp .6s ease-out; }
  .gallery-hall { animation: fadeUp .6s ease-out .2s both; }
</style>
<main>
  <div class="fixed top-0 right-3 z-50 flex items-center w-[88px] h-8 rounded-full border border-black/10 shrink-0" style="top: calc(env(safe-area-inset-top, 0px) + 12px);">
      <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="更多">
        <i data-lucide="more-horizontal" class="w-4 h-4 text-foreground"></i>
      </button>
      <span class="w-px h-3 bg-black/10 block"></span>
      <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
        <i data-lucide="x" class="w-4 h-4 text-foreground"></i>
      </button>
    </div>

<div class="petlux-shell max-w-md mx-auto bg-background min-h-screen pb-28">

  <!-- 顶部栏 -->
  <header data-topbar class="sticky top-0 z-20 h-14 flex items-center px-4 gap-3 bg-background/95 backdrop-blur-sm border-b border-border">
<button type="button" aria-label="返回" class="flex items-center justify-center w-8 h-8 -ml-1 text-foreground petlux-tap rounded-full">
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </button>
    <h1 class="text-base font-medium text-foreground flex-1">寄养档案</h1>
    <button type="button" aria-label="编辑" class="flex items-center justify-center w-8 h-8 text-foreground petlux-tap rounded-full">
      <i data-lucide="pencil" class="w-4 h-4"></i>
    </button>
  </header>

  <!-- 画廊式品牌头部 -->
  <header class="gallery-header px-5 pt-8 pb-6">
    <div class="brand-block flex flex-col gap-3">
      <div class="flex items-center gap-2">
        <span class="brand-accent-bar w-1 h-6 bg-primary block rounded-sm"></span>
        <span class="text-[11px] tracking-[0.2em] text-muted-foreground font-mono uppercase">AROORO</span>
      </div>
      <h1 class="brand-text text-3xl font-light tracking-widest text-foreground">寄养档案</h1>
      <div class="brand-meta flex items-center gap-2">
        <span class="w-4 h-px bg-muted-foreground/50 block"></span>
        <span class="text-[13px] text-muted-foreground tracking-wide">李明的宠物寄养家庭</span>
      </div>
    </div>
  </header>

  <!-- 画廊展厅 -->
  <div class="gallery-hall px-4">

    <!-- 档案卡片 -->
    <div class="gallery-card profile-card bg-card rounded-lg overflow-hidden flex shadow-[var(--petlux-shadow-1)] mb-4 petlux-card">
      <div class="card-accent w-1 self-stretch shrink-0 bg-primary"></div>
      <div class="card-body p-5 flex-1">
        <!-- 状态 -->
        <div class="info-row flex justify-between items-center py-1.5">
          <span class="info-key text-[13px] text-muted-foreground tracking-wide">状态</span>
          <span class="status-tag tag-active text-[12px] px-2.5 py-0.5 rounded-md font-medium" style="background: rgba(91,124,74,0.12); color: var(--petlux-state-success);">营业中</span>
        </div>
        <div class="info-divider h-px bg-border my-0.5"></div>
        <!-- 接单状态 -->
        <div class="info-row flex justify-between items-center py-1.5">
          <span class="info-key text-[13px] text-muted-foreground tracking-wide">接单状态</span>
          <span class="info-val text-sm text-foreground text-right">接受订单</span>
        </div>
        <div class="info-divider h-px bg-border my-0.5"></div>
        <!-- 日单价 -->
        <div class="info-row flex justify-between items-center py-1.5">
          <span class="info-key text-[13px] text-muted-foreground tracking-wide">日单价</span>
          <span class="info-val text-sm text-foreground text-right font-mono">¥120/天</span>
        </div>
        <div class="info-divider h-px bg-border my-0.5"></div>
        <!-- 最大容量 -->
        <div class="info-row flex justify-between items-center py-1.5">
          <span class="info-key text-[13px] text-muted-foreground tracking-wide">最大容量</span>
          <span class="info-val text-sm text-foreground text-right">3 只</span>
        </div>
        <div class="info-divider h-px bg-border my-0.5"></div>
        <!-- 地址 -->
        <div class="info-row flex justify-between items-center py-1.5 gap-3">
          <span class="info-key text-[13px] text-muted-foreground tracking-wide shrink-0">地址</span>
          <span class="info-val text-sm text-foreground text-right truncate">上海市徐汇区田林路128号</span>
        </div>
        <div class="info-divider h-px bg-border my-0.5"></div>
        <!-- 联系电话 -->
        <div class="info-row flex justify-between items-center py-1.5">
          <span class="info-key text-[13px] text-muted-foreground tracking-wide">联系电话</span>
          <span class="info-val text-sm text-foreground text-right font-mono">138****8888</span>
        </div>
      </div>
    </div>

    <!-- 画廊入口 -->
    <div class="gallery-entrance flex items-center gap-3 my-6">
      <span class="entrance-line w-10 h-px bg-ink-3 block"></span>
      <span class="entrance-label text-[13px] text-muted-foreground tracking-[0.15em]">寄养订单 (3)</span>
    </div>

    <!-- 订单列表 -->
    <div class="flex flex-col gap-3">
      <!-- 订单 1 -->
      <div class="gallery-card order-card bg-card rounded-lg overflow-hidden flex shadow-[var(--petlux-shadow-1)] petlux-card">
        <div class="card-accent w-1 self-stretch shrink-0" style="background: linear-gradient(180deg, var(--petlux-brand) 0%, var(--petlux-state-info) 100%);"></div>
        <div class="card-body p-4 flex-1">
          <div class="card-header flex items-center justify-between mb-2">
            <span class="card-title text-sm font-medium text-foreground flex-1 truncate mr-2">金毛寄养 · 3天</span>
            <span class="card-status text-[11px] px-2 py-0.5 rounded-md font-medium shrink-0" style="background: rgba(107,125,140,0.12); color: var(--petlux-state-info);">已确认</span>
          </div>
          <div class="card-info flex flex-col gap-1">
            <span class="card-info-item text-[12px] text-muted-foreground flex items-center gap-1.5">
              <i data-lucide="user" class="w-3 h-3 shrink-0"></i>宠物主人：王芳
            </span>
            <span class="card-info-item text-[12px] text-muted-foreground flex items-center gap-1.5">
              <i data-lucide="wallet" class="w-3 h-3 shrink-0"></i>金额：¥360
            </span>
          </div>
        </div>
      </div>

      <!-- 订单 2 -->
      <div class="gallery-card order-card bg-card rounded-lg overflow-hidden flex shadow-[var(--petlux-shadow-1)] petlux-card">
        <div class="card-accent w-1 self-stretch shrink-0" style="background: linear-gradient(180deg, var(--petlux-brand) 0%, var(--petlux-brand-deep) 100%);"></div>
        <div class="card-body p-4 flex-1">
          <div class="card-header flex items-center justify-between mb-2">
            <span class="card-title text-sm font-medium text-foreground flex-1 truncate mr-2">布偶猫寄养 · 2天</span>
            <span class="card-status text-[11px] px-2 py-0.5 rounded-md font-medium shrink-0" style="background: rgba(79,94,53,0.12); color: var(--petlux-brand);">已入住</span>
          </div>
          <div class="card-info flex flex-col gap-1">
            <span class="card-info-item text-[12px] text-muted-foreground flex items-center gap-1.5">
              <i data-lucide="user" class="w-3 h-3 shrink-0"></i>宠物主人：张伟
            </span>
            <span class="card-info-item text-[12px] text-muted-foreground flex items-center gap-1.5">
              <i data-lucide="wallet" class="w-3 h-3 shrink-0"></i>金额：¥240
            </span>
          </div>
        </div>
      </div>

      <!-- 订单 3 -->
      <div class="gallery-card order-card bg-card rounded-lg overflow-hidden flex shadow-[var(--petlux-shadow-1)] petlux-card">
        <div class="card-accent w-1 self-stretch shrink-0" style="background: linear-gradient(180deg, var(--petlux-state-success) 0%, var(--petlux-brand) 100%);"></div>
        <div class="card-body p-4 flex-1">
          <div class="card-header flex items-center justify-between mb-2">
            <span class="card-title text-sm font-medium text-foreground flex-1 truncate mr-2">柯基寄养 · 4天</span>
            <span class="card-status text-[11px] px-2 py-0.5 rounded-md font-medium shrink-0" style="background: rgba(91,124,74,0.12); color: var(--petlux-state-success);">已完成</span>
          </div>
          <div class="card-info flex flex-col gap-1">
            <span class="card-info-item text-[12px] text-muted-foreground flex items-center gap-1.5">
              <i data-lucide="user" class="w-3 h-3 shrink-0"></i>宠物主人：陈静
            </span>
            <span class="card-info-item text-[12px] text-muted-foreground flex items-center gap-1.5">
              <i data-lucide="wallet" class="w-3 h-3 shrink-0"></i>金额：¥480
            </span>
          </div>
        </div>
      </div>
    </div>

  </div>

</div>
</main>
<script>lucide.createIcons();</script>
</body>
</html>
