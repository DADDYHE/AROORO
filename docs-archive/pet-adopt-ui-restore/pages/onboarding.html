<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding — Proud to Be a Pet Adopter</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #1c1c1e;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .screen {
      position: relative;
      width: 390px;
      max-width: 100vw;
      min-height: 100vh;
      background: var(--pa-background);
      overflow: hidden;
      font-family: var(--pa-font-sans);
      -webkit-font-smoothing: antialiased;
    }

    /* ---- iOS status bar (54px) ---- */
    #status-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 30;
      color: var(--pa-on-primary);
    }
    #status-bar .sb-time {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }
    #status-bar .sb-icons {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* ---- Dynamic Island pill ---- */
    #dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 34px;
      background: #000000;
      border-radius: 20px;
      z-index: 40;
    }

    /* ---- Hero image (top 58vh) ---- */
    #hero-img {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 58vh;
      object-fit: cover;
      object-position: center;
      display: block;
      z-index: 1;
    }

    /* ---- Top-left white paw logo ---- */
    #top-logo {
      position: absolute;
      top: 60px;
      left: 20px;
      width: 28px;
      height: 28px;
      color: var(--pa-on-primary);
      z-index: 20;
    }
    #top-logo svg { width: 28px; height: 28px; display: block; }

    /* ---- Top-right Skip ---- */
    #top-skip {
      position: absolute;
      top: 64px;
      right: 20px;
      color: var(--pa-on-primary);
      font-size: var(--pa-fs-link);
      font-weight: 500;
      z-index: 20;
      line-height: 1;
    }

    /* ---- Bottom card (42vh) ---- */
    #bottom-card {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      height: 42vh;
      background: var(--pa-card);
      border-top-left-radius: var(--pa-radius-card-top);
      border-top-right-radius: var(--pa-radius-card-top);
      box-shadow: var(--pa-shadow-sheet);
      padding: 24px;
      z-index: 25;
      display: flex;
      flex-direction: column;
    }

    /* ---- Red paw icon + "1" badge ---- */
    #paw-icon {
      position: relative;
      width: 40px;
      height: 40px;
      color: var(--pa-paw-red);
      flex-shrink: 0;
    }
    #paw-icon svg { width: 40px; height: 40px; display: block; }
    #paw-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      width: 16px;
      height: 16px;
      background: var(--pa-primary);
      color: var(--pa-on-primary);
      font-size: var(--pa-fs-badge);
      font-weight: 700;
      line-height: 1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---- Headline ---- */
    #headline {
      margin: 16px 0 0 0;
      font-size: var(--pa-fs-headline);
      line-height: 32px;
      font-weight: 700;
      color: var(--pa-foreground);
      text-wrap: balance;
    }

    /* ---- Subtext ---- */
    #subtext {
      margin: 12px 0 0 0;
      font-size: var(--pa-fs-body);
      line-height: 20px;
      font-weight: 400;
      color: var(--pa-muted);
    }

    /* ---- CTA "Next" pill ---- */
    #cta-next {
      margin-top: auto;
      width: 100%;
      height: 56px;
      border: none;
      border-radius: var(--pa-radius-pill);
      background: var(--pa-primary);
      color: var(--pa-on-primary);
      font-family: var(--pa-font-sans);
      font-size: 16px;
      font-weight: 600;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: var(--pa-shadow-cta);
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }
    #cta-next svg { width: 20px; height: 20px; display: block; }

    @media (prefers-reduced-motion: reduce) {
      #cta-next { transition: none; }
    }
  </style>
</head>
<body>
  <main class="screen">
    <img id="hero-img" src="../assets/hero-woman-dog.jpg" alt="A young woman hugging a fluffy brown dog">

    <div id="status-bar">
      <span class="sb-time">9:41</span>
      <div class="sb-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true"><path d="M8 2C5.2 2 2.7 3 0.8 4.8L2 6c1.7-1.6 3.7-2.5 6-2.5s4.3 0.9 6 2.5l1.2-1.2C13.3 3 10.8 2 8 2z"/><path d="M8 5.5c-1.8 0-3.4 0.7-4.6 1.8L4.6 8.5c0.9-0.9 2.1-1.4 3.4-1.4s2.5 0.5 3.4 1.4l1.2-1.2C11.4 6.2 9.8 5.5 8 5.5z"/><circle cx="8" cy="10.5" r="1.5"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" stroke-opacity="0.5"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="currentColor"/><path d="M23 4v4c1.2-0.4 1.2-3.6 0-4z" fill="currentColor" fill-opacity="0.5"/></svg>
      </div>
    </div>

    <div id="dynamic-island"></div>

    <div id="top-logo">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="9" r="2.2"/><circle cx="10" cy="6" r="2.2"/><circle cx="14" cy="6" r="2.2"/><circle cx="18" cy="9" r="2.2"/><path d="M12 11c-3 0-5 2.5-5 5 0 2 1.5 3 3 3 .8 0 1.3-.3 2-.3s1.2.3 2 .3c1.5 0 3-1 3-3 0-2.5-2-5-5-5z"/></svg>
    </div>

    <div id="top-skip">Skip</div>

    <div id="bottom-card">
      <div id="paw-icon">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="9" r="2.2"/><circle cx="10" cy="6" r="2.2"/><circle cx="14" cy="6" r="2.2"/><circle cx="18" cy="9" r="2.2"/><path d="M12 11c-3 0-5 2.5-5 5 0 2 1.5 3 3 3 .8 0 1.3-.3 2-.3s1.2.3 2 .3c1.5 0 3-1 3-3 0-2.5-2-5-5-5z"/></svg>
        <span id="paw-badge">1</span>
      </div>
      <h1 id="headline">Proud to Be a Pet Adopter</h1>
      <p id="subtext">Looking for unconditional love? visit the shelter today</p>
      <button id="cta-next" type="button">
        Next
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="9" r="2.2"/><circle cx="10" cy="6" r="2.2"/><circle cx="14" cy="6" r="2.2"/><circle cx="18" cy="9" r="2.2"/><path d="M12 11c-3 0-5 2.5-5 5 0 2 1.5 3 3 3 .8 0 1.3-.3 2-.3s1.2.3 2 .3c1.5 0 3-1 3-3 0-2.5-2-5-5-5z"/></svg>
      </button>
    </div>
  </main>
</body>
</html>
