<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AROORO Admin · 数据看板</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../components.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
.uikit-shell{width:100%;max-width:1184px;margin:0 auto;overflow:hidden;display:grid;grid-template-columns:240px minmax(0,1fr);gap:var(--space-5);padding:var(--space-7) var(--space-6);align-items:start}
.uikit-sidebar,.uikit-main,.uikit-toolbar{min-width:0}
.uikit-sidebar{overflow:hidden;max-width:100%}
.uikit-main{display:flex;flex-direction:column;gap:var(--space-5);min-width:0}
[data-component]{min-width:0;max-width:100%;overflow:hidden}
.uikit-toolbar{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.uikit-responsive-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-4)}
.uikit-qa-row{display:flex;gap:var(--space-3);overflow-x:auto;padding-bottom:var(--space-2)}
.uikit-table-wrap{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain}
.uikit-truncate{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uikit-nowrap{white-space:nowrap;flex-shrink:0}
.uikit-action-cell{display:flex;align-items:center;gap:8px;min-width:0;max-width:160px;overflow:hidden}
.uikit-action{min-width:0;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uikit-view{display:flex;flex-direction:column;gap:var(--space-5);min-width:0}
.uikit-page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap}
.uikit-eyebrow{font-family:var(--font-eyebrow);font-size:var(--font-size-caption);letter-spacing:.24em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:var(--space-2)}
.uikit-title{font-family:var(--font-serif);font-size:var(--font-size-h2);font-weight:var(--font-weight-h2);line-height:var(--line-height-h2);color:var(--foreground);margin:0;word-break:keep-all;overflow-wrap:break-word}
.uikit-lead{font-family:var(--font-sans);font-size:var(--font-size-lead);font-weight:var(--font-weight-lead);line-height:var(--line-height-lead);color:var(--muted-foreground);margin:var(--space-2) 0 0;max-width:60ch}
.uikit-view-tabs{display:inline-flex;gap:var(--space-1);background:var(--muted);border-radius:var(--radius-sm);padding:var(--space-1);align-self:flex-start}
.uikit-chart-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap}
.uikit-chart-foot{display:flex;align-items:center;justify-content:center;gap:var(--space-2);margin-top:var(--space-4)}
.uikit-cell-main{display:flex;align-items:center;gap:12px}
.uikit-cell-text{min-width:0;flex:1;overflow:hidden}
.icon-sm{width:16px;height:16px;flex-shrink:0}
.icon-md{width:20px;height:20px;flex-shrink:0}
.icon-lg{width:24px;height:24px;flex-shrink:0}
.barH30{height:30%}.barH40{height:40%}.barH50{height:50%}.barH55{height:55%}.barH60{height:60%}.barH65{height:65%}.barH70{height:70%}.barH75{height:75%}.barH80{height:80%}.barH85{height:85%}.barH90{height:90%}.barH95{height:95%}
@media (max-width:900px){.uikit-shell{grid-template-columns:minmax(0,1fr)}.uikit-responsive-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.uikit-toolbar{flex-direction:column;align-items:stretch}.uikit-responsive-grid{grid-template-columns:minmax(0,1fr)}.uikit-page-head{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;

const VIEWS=[
  {id:'dashboard',label:'数据看板',crumb:'数据看板'},
  {id:'orders',label:'团购管理',crumb:'团购管理'},
  {id:'distribution',label:'订单分布',crumb:'订单类型分布'}
];

const BARS=[
  {m:'1月',v:'8.2',h:'barH40'},{m:'2月',v:'9.6',h:'barH50'},{m:'3月',v:'11.4',h:'barH60'},
  {m:'4月',v:'10.8',h:'barH55'},{m:'5月',v:'12.6',h:'barH65'},{m:'6月',v:'13.9',h:'barH70'},
  {m:'7月',v:'15.2',h:'barH75'},{m:'8月',v:'14.7',h:'barH70'},{m:'9月',v:'16.8',h:'barH80'},
  {m:'10月',v:'18.3',h:'barH90'},{m:'11月',v:'17.5',h:'barH80'},{m:'12月',v:'19.6',h:'barH95 is-accent'}
];

const STATS=[
  {icon:'shopping-cart',value:'128',label:'今日订单',trend:'+12.4%'},
  {icon:'wallet',value:'¥18,640',label:'今日收入',trend:'+8.6%'},
  {icon:'users',value:'3,847',label:'总用户数',trend:'+3.2%'},
  {icon:'calendar-check',value:'36',label:'本周团购',trend:'+15.7%'}
];

const QA=[
  {icon:'plus',label:'创建团购',count:'36 进行中',tone:'green'},
  {icon:'package-plus',label:'添加商品',count:'128 在售',tone:'gold'},
  {icon:'user-plus',label:'客户管理',count:'3,847 位',tone:'blue'},
  {icon:'download',label:'数据导出',count:'本月 12 次',tone:'green'}
];

const ROWS=[
  {t:'萌宠新年礼盒',s:'限时7天',a:'¥3,280',st:'success',stx:'进行中',time:'2024-01-15 14:32',ic:'paw-print',acts:[{c:'edit',x:'编辑'},{c:'publish',x:'上架'}]},
  {t:'春季美容套餐',s:'满200减50',a:'¥1,560',st:'warning',stx:'待审核',time:'2024-01-14 09:18',ic:'scissors',acts:[{c:'edit',x:'编辑'},{c:'delete',x:'下架'}]},
  {t:'高端猫粮团购',s:'顺丰包邮',a:'¥4,920',st:'neutral',stx:'已完成',time:'2024-01-12 16:45',ic:'cookie',acts:[{c:'edit',x:'编辑'}]},
  {t:'宠物寄养特惠',s:'周末专享',a:'¥880',st:'neutral',stx:'已下架',time:'2024-01-10 11:20',ic:'home',disabled:true,acts:[{c:'edit',x:'编辑'}]},
  {t:'夏季驱虫计划',s:'买二送一',a:'¥2,140',st:'success',stx:'进行中',time:'2024-01-08 13:50',ic:'shield',acts:[{c:'edit',x:'编辑'},{c:'delete',x:'下架'}]},
  {t:'亲子摄影套餐',s:'含精修九张',a:'¥3,650',st:'warning',stx:'待审核',time:'2024-01-06 10:05',ic:'camera',acts:[{c:'edit',x:'编辑'}]},
  {t:'冬日保暖专场',s:'限时5天',a:'¥5,430',st:'neutral',stx:'已完成',time:'2024-01-04 15:30',ic:'snowflake',acts:[{c:'edit',x:'编辑'}]}
];

const LEGEND=[
  {c:'c-primary',n:'宠物用品',v:'1,616 · 42%'},
  {c:'c-accent',n:'美容服务',v:'1,077 · 28%'},
  {c:'c-success',n:'寄养服务',v:'769 · 20%'},
  {c:'c-warning',n:'摄影套餐',v:'385 · 10%'}
];

const CATS=[
  {icon:'shopping-bag',value:'1,616',label:'宠物用品',trend:'+18.2%'},
  {icon:'scissors',value:'1,077',label:'美容服务',trend:'+9.4%'},
  {icon:'home',value:'769',label:'寄养服务',trend:'+5.6%'},
  {icon:'camera',value:'385',label:'摄影套餐',trend:'+22.1%'}
];

function Sidebar({view}){
  return (
    <div className="uikit-sidebar">
      <div className="sidebar" role="navigation" aria-label="主导航" data-component="sidebar">
        <div className="sb-logo"><span className="sb-logo-mark">AROORO</span></div>
        <nav className="sb-nav">
          <div className="sb-section-label">概览</div>
          <div className={'sb-item'+(view==='dashboard'?' active':'')}>
            <span className="sb-item-icon"><i data-lucide="layout-dashboard"></i></span>
            <span className="sb-item-label">数据看板</span>
          </div>
          <div className="sb-section-label">运营</div>
          <div className={'sb-item'+(view==='orders'?' active':'')}>
            <span className="sb-item-icon"><i data-lucide="shopping-bag"></i></span>
            <span className="sb-item-label">团购管理</span>
            <i data-lucide="chevron-right" className="sb-chevron"></i>
          </div>
          <div className="sb-item">
            <span className="sb-item-icon"><i data-lucide="package"></i></span>
            <span className="sb-item-label">订单管理</span>
          </div>
          <div className="sb-item">
            <span className="sb-item-icon"><i data-lucide="users"></i></span>
            <span className="sb-item-label">客户管理</span>
          </div>
          <div className="sb-section-label">数据</div>
          <div className={'sb-item'+(view==='distribution'?' active':'')}>
            <span className="sb-item-icon"><i data-lucide="pie-chart"></i></span>
            <span className="sb-item-label">订单分析</span>
          </div>
          <div className="sb-item">
            <span className="sb-item-icon"><i data-lucide="bar-chart-3"></i></span>
            <span className="sb-item-label">营收报表</span>
          </div>
        </nav>
        <div className="sb-foot">
          <span className="sb-status-dot"></span>
          <span className="sb-foot-text">v2.4.1 · 运行正常</span>
        </div>
      </div>
    </div>
  );
}

function NavHeader({crumb}){
  return (
    <div>
      <header className="nav-header" data-component="navigation">
        <button className="nav-collapse" aria-label="折叠侧边栏"><i data-lucide="menu"></i></button>
        <nav className="nav-breadcrumb" aria-label="面包屑">
          <span>首页</span>
          <i data-lucide="chevron-right"></i>
          <span className="current">{crumb}</span>
        </nav>
        <div className="nav-search">
          <i data-lucide="search"></i>
          <input placeholder="搜索订单 / 客户 / 团购" />
        </div>
        <div className="nav-right">
          <button className="nav-icon-btn" aria-label="通知"><i data-lucide="bell"></i><span className="dot"></span></button>
          <button className="nav-user-chip">
            <span className="nav-avatar">林</span>
            <span className="nav-user-meta">
              <span className="nav-user-name">林婉清</span>
              <span className="nav-user-role">运营总监</span>
            </span>
            <i data-lucide="chevron-down"></i>
          </button>
        </div>
      </header>
    </div>
  );
}

function DashboardView(){
  return (
    <div className="uikit-view">
      <div className="uikit-page-head">
        <div style={{minWidth:0}}>
          <div className="uikit-eyebrow">数据看板 · 今日</div>
          <h1 className="uikit-title">数据看板</h1>
          <p className="uikit-lead">2024 年 1 月 15 日 · 实时更新于 14:32</p>
        </div>
        <button className="btn btn-primary" data-component="button"><i data-lucide="plus"></i>创建团购</button>
      </div>
      <div className="uikit-responsive-grid">
        {STATS.map((s,i)=>(
          <div className="card stat-card" data-component="card" key={i}>
            <div className="stat-head">
              <div className="stat-icon"><i data-lucide={s.icon}></i></div>
              <span className="stat-trend">{s.trend}</span>
            </div>
            <div className="stat-value">{s.value}</div>
            <div className="stat-label">{s.label}</div>
          </div>
        ))}
      </div>
      <div className="chart-card" data-component="chart">
        <div className="uikit-chart-head">
          <span className="chart-title">订单趋势</span>
          <div className="chart-toolbar">
            <button className="chart-toggle is-active">营收</button>
            <button className="chart-toggle">访问</button>
            <button className="chart-toggle">订单</button>
          </div>
        </div>
        <div className="chart-bars">
          {BARS.map((b,i)=>(
            <div className="bar-col" key={i}>
              <span className="bar-value">{b.v}</span>
              <div className={'bar '+b.h}></div>
            </div>
          ))}
        </div>
        <div className="chart-xlabels">
          {BARS.map((b,i)=><span key={i}>{b.m}</span>)}
        </div>
        <div className="uikit-chart-foot">
          <button className="pg-btn" disabled><i data-lucide="chevron-left" className="icon-sm"></i></button>
          <span className="chart-tag">近 12 个月</span>
          <button className="pg-btn"><i data-lucide="chevron-right" className="icon-sm"></i></button>
        </div>
      </div>
      <div>
        <div className="uikit-eyebrow">快捷入口</div>
        <div className="uikit-qa-row">
          {QA.map((q,i)=>(
            <div className="qa-tile" data-component="card" key={i}>
              <div className={'qa-icon '+q.tone}><i data-lucide={q.icon}></i></div>
              <div className="qa-info">
                <span className="qa-label">{q.label}</span>
                <span className="qa-count">{q.count}</span>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function OrdersView(){
  return (
    <div className="uikit-view">
      <div className="uikit-page-head">
        <div style={{minWidth:0}}>
          <div className="uikit-eyebrow">运营 · 团购</div>
          <h1 className="uikit-title">团购管理</h1>
          <p className="uikit-lead">管理全部团购活动 · 共 128 条记录</p>
        </div>
        <div className="uikit-toolbar">
          <button className="btn-toggle">导出</button>
          <button className="btn-toggle">筛选</button>
          <button className="btn btn-primary" data-component="button"><i data-lucide="plus"></i>创建团购</button>
        </div>
      </div>
      <div className="table-shell" data-component="table">
        <div className="uikit-table-wrap">
          <table className="data-table">
            <thead>
              <tr>
                <th>团购名称</th><th>金额</th><th>状态</th><th>时间</th><th>操作</th>
              </tr>
            </thead>
            <tbody>
              {ROWS.map((r,i)=>(
                <tr key={i} className={r.disabled?'row-disabled':''}>
                  <td>
                    <div className="uikit-cell-main">
                      <div className="thumb"><i data-lucide={r.ic} className="thumb-icon"></i></div>
                      <div className="uikit-cell-text">
                        <div className="cell-title">{r.t}</div>
                        <div className="cell-sub">{r.s}</div>
                      </div>
                    </div>
                  </td>
                  <td><span className="amount">{r.a}</span></td>
                  <td><span className={'status status-'+r.st}>{r.stx}</span></td>
                  <td><span className="time-cell">{r.time}</span></td>
                  <td>
                    <div className="uikit-action-cell">
                      {r.acts.map((a,j)=>(<button key={j} className={'btn-row '+a.c}>{a.x}</button>))}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="pagination">
          <span className="pg-total">共 <span className="num">128</span> 条</span>
          <div className="pg-right">
            <span className="pg-size"><span className="num">10</span> 条/页</span>
            <div className="pg-pages">
              <button className="pg-btn" disabled><i data-lucide="chevron-left" className="icon-sm"></i></button>
              <button className="pg-btn current">1</button>
              <button className="pg-btn">2</button>
              <button className="pg-btn">3</button>
              <button className="pg-btn"><i data-lucide="chevron-right" className="icon-sm"></i></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function DistributionView(){
  return (
    <div className="uikit-view">
      <div className="uikit-page-head">
        <div style={{minWidth:0}}>
          <div className="uikit-eyebrow">数据 · 订单分析</div>
          <h1 className="uikit-title">订单类型分布</h1>
          <p className="uikit-lead">本月订单按业务类型分布 · 总计 3,847 笔</p>
        </div>
        <button className="btn btn-primary" data-component="button"><i data-lucide="download"></i>导出报表</button>
      </div>
      <div className="chart-card" data-component="chart">
        <div className="uikit-chart-head">
          <span className="chart-title">订单类型分布</span>
          <div className="chart-toolbar">
            <button className="chart-toggle is-active">本月</button>
            <button className="chart-toggle">本季</button>
            <button className="chart-toggle">全年</button>
          </div>
        </div>
        <div className="donut-wrap">
          <div className="donut">
            <div className="donut-hole">
              <span className="donut-total-label">总订单</span>
              <span className="donut-total-value">3,847</span>
            </div>
          </div>
          <div className="donut-legend">
            {LEGEND.map((l,i)=>(
              <div className="legend-item" key={i}>
                <span className={'legend-dot '+l.c}></span>
                <span className="legend-name">{l.n}</span>
                <span className="legend-val">{l.v}</span>
              </div>
            ))}
          </div>
        </div>
        <div className="uikit-chart-foot">
          <button className="pg-btn" disabled><i data-lucide="chevron-left" className="icon-sm"></i></button>
          <span className="chart-tag">第 1 页 · 共 1 页</span>
          <button className="pg-btn" disabled><i data-lucide="chevron-right" className="icon-sm"></i></button>
        </div>
      </div>
      <div className="uikit-responsive-grid">
        {CATS.map((c,i)=>(
          <div className="card stat-card" data-component="card" key={i}>
            <div className="stat-head">
              <div className="stat-icon"><i data-lucide={c.icon}></i></div>
              <span className="stat-trend">{c.trend}</span>
            </div>
            <div className="stat-value">{c.value}</div>
            <div className="stat-label">{c.label}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App(){
  const [view,setView]=useState('dashboard');
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); },[view]);
  const current=VIEWS.find(v=>v.id===view);
  return (
    <div className="uikit-shell" data-layout-guard="uikit-v1">
      <Sidebar view={view} />
      <main className="uikit-main">
        <NavHeader crumb={current.crumb} />
        <div className="uikit-view-tabs" role="tablist" aria-label="视图切换">
          {VIEWS.map(v=>(
            <button key={v.id} className={'btn-toggle'+(view===v.id?' active':'')} role="tab" aria-selected={view===v.id} onClick={()=>setView(v.id)}>{v.label}</button>
          ))}
        </div>
        {view==='dashboard' && <DashboardView />}
        {view==='orders' && <OrdersView />}
        {view==='distribution' && <DistributionView />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
