<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Table — AROORO Admin</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--background); font-family: var(--font-sans); color: var(--foreground); font-size: 13px; }
.row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.row > .label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.08em; }

/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.table-shell { width: 100%; border: 1px solid var(--border); background: var(--surface); overflow: hidden; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table thead th { font-family: var(--font-eyebrow); font-size: 11px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted-foreground); text-align: left; padding: 14px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.data-table tbody td { padding: 14px 12px; border-bottom: 1px solid var(--border); color: var(--foreground); vertical-align: middle; }
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr { transition: background .15s, border-color .15s; }
.data-table tbody tr:hover { background: var(--primary-50); }
.data-table tbody tr.row-disabled:hover { background: transparent; }
.thumb { width: 48px; height: 48px; background: linear-gradient(135deg, var(--primary-100), var(--accent-100)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.thumb-icon { width: 20px; height: 20px; color: var(--primary-700); }
.cell-title { font-weight: 500; color: var(--foreground); white-space: nowrap; }
.cell-sub { font-size: 12px; color: var(--muted-foreground); margin-top: 2px; white-space: nowrap; }
.amount { font-family: var(--font-number); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--foreground); white-space: nowrap; }
.status { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 500; white-space: nowrap; }
.status-info { background: var(--info-100); color: var(--info-700); }
.status-success { background: var(--success-100); color: var(--success-700); }
.status-warning { background: var(--warning-100); color: var(--warning-700); }
.status-neutral { background: var(--neutral-200); color: var(--neutral-700); }
.time-cell { font-family: var(--font-eyebrow); font-size: 12px; color: var(--muted-foreground); white-space: nowrap; }
.actions { display: inline-flex; gap: 4px; }
.act { padding: 2px 6px; font-size: 12px; color: var(--primary-700); cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap; }
.act:hover { background: var(--muted); }
.act-danger { color: var(--error-700); }
.row-disabled td { color: var(--neutral-400); }
.row-disabled .thumb { background: linear-gradient(135deg, var(--neutral-200), var(--neutral-300)); }
.row-disabled .thumb-icon { color: var(--neutral-400); }
.row-disabled .act { pointer-events: none; }
.pagination { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-top: 1px solid var(--border); gap: var(--space-3); }
.pg-total { font-size: 12px; color: var(--muted-foreground); white-space: nowrap; }
.pg-total .num { font-family: var(--font-number); font-weight: 600; color: var(--foreground); }
.pg-right { display: inline-flex; align-items: center; gap: var(--space-3); }
.pg-size { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted-foreground); padding: 4px 10px; border: 1px solid var(--border); white-space: nowrap; }
.pg-size .num { font-family: var(--font-number); color: var(--foreground); }
.pg-pages { display: inline-flex; align-items: center; gap: 4px; }
.pg-btn { min-width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0 8px; font-family: var(--font-number); font-size: 13px; color: var(--foreground); cursor: pointer; border: 1px solid transparent; transition: background .15s, border-color .15s; }
.pg-btn:hover { background: var(--muted); }
.pg-btn.current { background: var(--primary); color: var(--primary-foreground); font-weight: 600; }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">订单明细</span></div>
<div class="row">
<div class="table-shell" data-evidence-sample="data-table">
<table class="data-table">
<thead>
<tr><th>项目</th><th>名称</th><th>金额</th><th>状态</th><th>时间</th><th>操作</th></tr>
</thead>
<tbody>
<tr>
<td><div class="thumb"><i data-lucide="package" class="thumb-icon"></i></div></td>
<td><div class="cell-title">沉香礼盒</div><div class="cell-sub">编号 SH-0148</div></td>
<td><span class="amount">¥12,480</span></td>
<td><span class="status status-info">进行中</span></td>
<td><span class="time-cell">08-12 14:30</span></td>
<td><div class="actions"><span class="act">编辑</span><span class="act">发布</span><span class="act act-danger">删除</span></div></td>
</tr>
<tr>
<td><div class="thumb"><i data-lucide="package" class="thumb-icon"></i></div></td>
<td><div class="cell-title">白茶臻选</div><div class="cell-sub">编号 BC-0231</div></td>
<td><span class="amount">¥8,320</span></td>
<td><span class="status status-success">已完成</span></td>
<td><span class="time-cell">08-11 09:15</span></td>
<td><div class="actions"><span class="act">编辑</span><span class="act">发布</span><span class="act act-danger">删除</span></div></td>
</tr>
<tr>
<td><div class="thumb"><i data-lucide="package" class="thumb-icon"></i></div></td>
<td><div class="cell-title">青瓷茶具</div><div class="cell-sub">编号 QC-0097</div></td>
<td><span class="amount">¥24,560</span></td>
<td><span class="status status-warning">待处理</span></td>
<td><span class="time-cell">08-10 18:42</span></td>
<td><div class="actions"><span class="act">编辑</span><span class="act">发布</span><span class="act act-danger">删除</span></div></td>
</tr>
<tr class="row-disabled">
<td><div class="thumb"><i data-lucide="package" class="thumb-icon"></i></div></td>
<td><div class="cell-title">紫砂收藏</div><div class="cell-sub">编号 ZS-0452</div></td>
<td><span class="amount">¥36,800</span></td>
<td><span class="status status-neutral">已停用</span></td>
<td><span class="time-cell">08-09 11:20</span></td>
<td><div class="actions"><span class="act">编辑</span><span class="act">发布</span><span class="act act-danger">删除</span></div></td>
</tr>
</tbody>
</table>
<nav class="pagination" aria-label="分页">
<span class="pg-total">共 <span class="num">128</span> 条</span>
<span class="pg-right">
<span class="pg-size"><span class="num">10</span> 条/页</span>
<span class="pg-pages">
<span class="pg-btn current">1</span>
<span class="pg-btn">2</span>
<span class="pg-btn">3</span>
</span>
</span>
</nav>
</div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
