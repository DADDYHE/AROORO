<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button — AROORO Admin</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<style>
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-sans); color: var(--color-foreground); }
.row { display: flex; gap: var(--space-3); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { display: inline-block; width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.04em; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-4) 0; }

/* @component-css-start */
/* Component definitions — Button */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); border: none; cursor: pointer; font-family: var(--font-sans); white-space: nowrap; transition: background .15s, border-color .15s, filter .15s; flex-shrink: 0; }
.btn-primary { height: 36px; min-width: 36px; padding: 0 var(--space-5); background: var(--color-primary); color: var(--primary-foreground); border-radius: var(--radius-pill); box-shadow: var(--shadow-2); font-size: var(--font-size-caption); font-weight: var(--font-weight-h3); letter-spacing: 0.04em; }
.btn-primary.sm { height: var(--size-button-sm); min-width: var(--size-button-sm); padding: 0 var(--space-4); }
.btn-primary:hover { filter: brightness(0.92); }
.btn-primary:active { filter: brightness(0.85); }
.btn-primary[disabled] { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
.btn-primary svg { width: var(--size-icon-sm); height: var(--size-icon-sm); }

.btn-toggle { height: 28px; min-width: 28px; padding: 0 var(--space-3); background: transparent; color: var(--muted-foreground); border-radius: var(--radius-pill); font-family: var(--font-eyebrow); font-size: 11px; font-weight: var(--font-weight-h4); }
.btn-toggle:hover { background: var(--color-muted); color: var(--color-foreground); }
.btn-toggle.active { background: var(--color-card); color: var(--color-foreground); box-shadow: var(--shadow-2); }

.btn-row { min-width: auto; padding: 2px var(--space-1); background: transparent; border: none; border-radius: var(--radius-xs); font-family: var(--font-eyebrow); font-size: 11px; font-weight: var(--font-weight-h4); }
.btn-row.edit { color: var(--color-info); }
.btn-row.publish { color: var(--color-success); }
.btn-row.delete { color: var(--color-error); }
.btn-row:hover { background: var(--color-muted); }

.btn-page { height: var(--size-button-sm); min-width: var(--size-button-sm); padding: 0 var(--space-2); background: var(--color-card); color: var(--color-foreground); border: 1px solid var(--color-border); border-radius: var(--radius-xs); font-family: var(--font-number); font-size: 13px; font-weight: var(--font-weight-h1); }
.btn-page:hover { border-color: var(--color-primary); }
.btn-page.active { background: var(--color-primary); color: var(--primary-foreground); border-color: var(--color-primary); }
.btn-page[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn-page svg { width: var(--size-icon-sm); height: var(--size-icon-sm); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row" data-evidence-sample="primary-action"><span class="label">主要操作</span><button class="btn btn-primary"><i data-lucide="download"></i>导出</button><button class="btn btn-primary sm">保存</button><button class="btn btn-primary" disabled>提交</button></div>
<div class="row" data-evidence-sample="chart-range-toggle"><span class="label">范围切换</span><button class="btn btn-toggle">日</button><button class="btn btn-toggle">周</button><button class="btn btn-toggle active">月</button></div>
<hr class="divider">
<div class="row" data-evidence-sample="row-action"><span class="label">行内操作</span><button class="btn btn-row edit">编辑</button><button class="btn btn-row publish">发布</button><button class="btn btn-row delete">删除</button></div>
<div class="row" data-evidence-sample="pagination"><span class="label">分页</span><button class="btn btn-page"><i data-lucide="chevron-left"></i></button><button class="btn btn-page">1</button><button class="btn btn-page active">2</button><button class="btn btn-page">3</button><button class="btn btn-page"><i data-lucide="chevron-right"></i></button></div>
<script>lucide.createIcons();</script>
</body>
</html>
