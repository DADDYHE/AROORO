<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Navigation · AROORO Admin</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-sans); color: var(--color-foreground); font-size: var(--font-size-body); }
  .specimen { display: flex; flex-direction: column; gap: var(--space-2); }
  .story { display: flex; flex-direction: column; gap: var(--space-2); }
  .row { display: flex; gap: var(--space-2); align-items: center; margin: 0; flex-wrap: wrap; }
  .label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted-foreground); white-space: nowrap; }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-2) 0; width: 100%; }
  .specimen svg { stroke-width: 1.5; }
  /* @component-css-start */
  .nav-header { flex: 1; display: flex; align-items: center; gap: var(--space-4); height: 56px; min-width: 0; padding: 0 var(--space-6); background: var(--color-card); border: none; border-bottom: 1px solid var(--color-border); box-sizing: border-box; }
  .nav-collapse { display: inline-flex; align-items: center; justify-content: center; width: var(--size-button-md); height: var(--size-button-md); min-width: var(--size-button-md); flex-shrink: 0; border: none; background: transparent; border-radius: var(--radius-sm); color: var(--color-foreground); cursor: pointer; transition: background .15s; }
  .nav-collapse:hover { background: var(--color-muted); }
  .nav-collapse:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .nav-collapse svg { width: var(--size-icon-md); height: var(--size-icon-md); }
  .nav-breadcrumb { display: flex; align-items: center; gap: var(--space-1); flex: 0 1 auto; min-width: 0; font-size: var(--font-size-body); color: var(--muted-foreground); overflow: hidden; }
  .nav-breadcrumb span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-breadcrumb .current { color: var(--color-foreground); font-weight: 500; }
  .nav-breadcrumb svg { width: var(--size-icon-sm); height: var(--size-icon-sm); color: var(--muted-foreground); flex-shrink: 0; }
  .nav-search { display: inline-flex; align-items: center; gap: var(--space-2); width: 320px; max-width: 320px; height: 36px; padding: 0 14px; flex-shrink: 0; background: var(--color-background); border: 1px solid var(--color-border); border-radius: var(--radius-pill); box-sizing: border-box; transition: background .15s, border-color .15s; }
  .nav-search:hover { background: var(--color-muted); }
  .nav-search:focus-within { border-color: var(--ring); }
  .nav-search svg { width: var(--size-icon-sm); height: var(--size-icon-sm); color: var(--muted-foreground); flex-shrink: 0; }
  .nav-search input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: var(--font-eyebrow); font-size: var(--font-size-caption); letter-spacing: 0.03em; color: var(--color-foreground); }
  .nav-search input::placeholder { color: var(--muted-foreground); }
  .nav-right { display: flex; align-items: center; gap: var(--space-3); margin-left: auto; flex-shrink: 0; }
  .nav-icon-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; width: var(--size-button-md); height: var(--size-button-md); min-width: var(--size-button-md); flex-shrink: 0; border: none; background: transparent; border-radius: var(--radius-sm); color: var(--color-foreground); cursor: pointer; transition: background .15s; }
  .nav-icon-btn:hover { background: var(--color-muted); }
  .nav-icon-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .nav-icon-btn svg { width: var(--size-icon-md); height: var(--size-icon-md); }
  .nav-icon-btn .dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; min-width: 8px; background: var(--accent); border: 2px solid var(--color-card); border-radius: var(--radius-pill); flex-shrink: 0; box-sizing: border-box; }
  .nav-user-chip { display: inline-flex; align-items: center; gap: 10px; padding: 4px 6px 4px 4px; flex-shrink: 0; background: transparent; border: none; border-radius: var(--radius-pill); cursor: pointer; transition: background .15s; }
  .nav-user-chip:hover { background: var(--primary-50); }
  .nav-user-chip:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .nav-avatar { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; min-width: 40px; flex-shrink: 0; border-radius: var(--radius-pill); background: linear-gradient(135deg, var(--primary-500), var(--primary-700)); color: var(--primary-foreground); font-family: var(--font-serif); font-size: var(--font-size-lead); font-weight: 500; }
  .nav-user-meta { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; line-height: 1.2; }
  .nav-user-name { font-size: var(--font-size-body); color: var(--color-foreground); white-space: nowrap; }
  .nav-user-role { font-size: var(--font-size-caption); color: var(--muted-foreground); white-space: nowrap; }
  .nav-user-chip svg { width: var(--size-icon-sm); height: var(--size-icon-sm); color: var(--muted-foreground); flex-shrink: 0; }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="specimen">
    <div class="story">
      <div class="row">
        <span class="label">顶部导航栏</span>
        <header class="nav-header" data-evidence-sample="top-header-bar">
          <button class="nav-collapse" aria-label="折叠侧边栏"><i data-lucide="menu"></i></button>
          <nav class="nav-breadcrumb" aria-label="面包屑">
            <span>首页</span>
            <i data-lucide="chevron-right"></i>
            <span>客户管理</span>
            <i data-lucide="chevron-right"></i>
            <span class="current">客户列表</span>
          </nav>
          <div class="nav-search">
            <i data-lucide="search"></i>
            <input type="search" placeholder="搜索客户、订单…" aria-label="搜索">
          </div>
          <div class="nav-right">
            <button class="nav-icon-btn" aria-label="通知"><i data-lucide="bell"></i><span class="dot"></span></button>
            <button class="nav-user-chip" aria-label="用户菜单">
              <span class="nav-avatar">陈</span>
              <span class="nav-user-meta"><span class="nav-user-name">陈墨白</span><span class="nav-user-role">管理员</span></span>
              <i data-lucide="chevron-down"></i>
            </button>
          </div>
        </header>
      </div>
    </div>
    <hr class="divider">
    <div class="story">
      <div class="row">
        <span class="label">导航组件</span>
        <div class="nav-search" data-evidence-sample="search-pill"><i data-lucide="search"></i><input type="search" placeholder="搜索…" aria-label="搜索"></div>
        <button class="nav-icon-btn" data-evidence-sample="notification-icon-button" aria-label="通知"><i data-lucide="bell"></i><span class="dot"></span></button>
        <button class="nav-user-chip" data-evidence-sample="user-chip" aria-label="用户菜单">
          <span class="nav-avatar">陈</span>
          <span class="nav-user-meta"><span class="nav-user-name">陈墨白</span><span class="nav-user-role">管理员</span></span>
          <i data-lucide="chevron-down"></i>
        </button>
      </div>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
