<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card — AROORO Admin</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-sans); color: var(--color-foreground); font-size: var(--font-size-body); }
.row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
.label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--muted-foreground); padding-top: 6px; white-space: nowrap; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: 8px 0; }

/* @component-css-start */
.card { background: var(--color-card); border: 1px solid var(--color-border); border-radius: var(--radius-md); transition: transform .2s, border-color .2s, box-shadow .2s, background .2s; }
.stat-card { padding: var(--space-6); box-shadow: var(--shadow-2); display: flex; flex-direction: column; gap: var(--space-3); flex: 1; }
.stat-card:hover { transform: translateY(-2px); border-color: var(--color-accent); }
.stat-head { display: flex; align-items: center; justify-content: space-between; }
.stat-icon { width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--accent-50); color: var(--color-accent); display: flex; align-items: center; justify-content: center; }
.stat-icon svg { width: var(--size-icon-lg); height: var(--size-icon-lg); }
.stat-trend { font-family: var(--font-number); font-size: var(--font-size-caption); color: var(--color-success); font-weight: 600; white-space: nowrap; }
.stat-value { font-family: var(--font-number); font-variant-numeric: tabular-nums; font-size: var(--font-size-h2); font-weight: var(--font-weight-h1); line-height: var(--line-height-h2); }
.stat-label { font-size: var(--font-size-body); color: var(--muted-foreground); }
.chart-card { flex: 1; overflow: hidden; }
.chart-head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-5); border-bottom: 1px solid var(--color-border); }
.chart-title { font-family: var(--font-serif); font-size: var(--font-size-h4); font-weight: var(--font-weight-h4); }
.chart-tag { font-size: var(--font-size-caption); color: var(--muted-foreground); padding: var(--space-1) var(--space-3); background: var(--muted); border-radius: var(--radius-pill); white-space: nowrap; }
.chart-body { padding: var(--space-5); display: flex; align-items: flex-end; gap: var(--space-2); height: 120px; }
.chart-bar { flex: 1; background: var(--primary-200); border-radius: var(--radius-xs) var(--radius-xs) 0 0; }
.chart-bar.peak { background: var(--color-primary); }
.qa-tile { width: 200px; flex-shrink: 0; padding: var(--space-4); background: var(--color-background); border: 1px solid var(--color-border); border-radius: var(--radius-sm); transition: transform .2s, background .2s; display: flex; align-items: center; gap: var(--space-3); cursor: pointer; }
.qa-tile:hover { transform: translateY(-2px); background: var(--color-card); }
.qa-icon { width: 48px; height: 48px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.qa-icon svg { width: var(--size-icon-lg); height: var(--size-icon-lg); }
.qa-icon.green { background: var(--primary-50); color: var(--color-primary); }
.qa-icon.gold { background: var(--accent-50); color: var(--color-accent); }
.qa-icon.blue { background: var(--info-50); color: var(--color-info); }
.qa-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.qa-label { font-size: var(--font-size-body); color: var(--color-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qa-count { font-family: var(--font-number); font-variant-numeric: tabular-nums; font-size: var(--font-size-caption); color: var(--muted-foreground); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row">
  <span class="label">统计卡片</span>
  <div class="card stat-card" data-evidence-sample="stat">
    <div class="stat-head">
      <div class="stat-icon"><i data-lucide="wallet"></i></div>
      <span class="stat-trend">↑ 12.4%</span>
    </div>
    <div class="stat-value">¥1,284,560</div>
    <div class="stat-label">本月营收</div>
  </div>
</div>
<div class="row">
  <span class="label">图表卡片</span>
  <div class="card chart-card" data-evidence-sample="chart">
    <div class="chart-head">
      <span class="chart-title">销售趋势</span>
      <span class="chart-tag">近7天</span>
    </div>
    <div class="chart-body">
      <div class="chart-bar" style="height:45%"></div>
      <div class="chart-bar" style="height:62%"></div>
      <div class="chart-bar" style="height:38%"></div>
      <div class="chart-bar peak" style="height:85%"></div>
      <div class="chart-bar" style="height:55%"></div>
      <div class="chart-bar" style="height:70%"></div>
      <div class="chart-bar" style="height:48%"></div>
    </div>
  </div>
</div>
<hr class="divider">
<div class="row">
  <span class="label">快捷操作</span>
  <div class="qa-tile" data-evidence-sample="quick-action">
    <div class="qa-icon green"><i data-lucide="users"></i></div>
    <div class="qa-info"><span class="qa-label">客户管理</span><span class="qa-count">1,284</span></div>
  </div>
  <div class="qa-tile" data-evidence-sample="quick-action">
    <div class="qa-icon gold"><i data-lucide="package"></i></div>
    <div class="qa-info"><span class="qa-label">订单管理</span><span class="qa-count">3,672</span></div>
  </div>
  <div class="qa-tile" data-evidence-sample="quick-action">
    <div class="qa-icon blue"><i data-lucide="shopping-bag"></i></div>
    <div class="qa-info"><span class="qa-label">商品管理</span><span class="qa-count">486</span></div>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
