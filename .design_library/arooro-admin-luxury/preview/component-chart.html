<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chart · AROORO Admin</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-sans); color: var(--color-foreground); }
  .row { display: flex; gap: var(--space-3); align-items: flex-start; margin-bottom: var(--space-3); }
  .label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--muted-foreground); text-transform: uppercase; letter-spacing: .04em; padding-top: var(--space-1); white-space: nowrap; }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-2) 0; }

  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .chart-card { flex: 1; min-width: 0; background: var(--color-card); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-4); }
  .chart-toolbar { display: inline-flex; gap: var(--space-1); background: var(--color-muted); border-radius: var(--radius-sm); padding: var(--space-1); margin-bottom: var(--space-4); }
  .chart-toggle { border: none; background: transparent; color: var(--muted-foreground); font-family: var(--font-sans); font-size: var(--font-size-caption); padding: var(--space-1) var(--space-3); border-radius: var(--radius-xs); cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
  .chart-toggle:hover { background: var(--color-card); color: var(--color-foreground); }
  .chart-toggle.is-active { background: var(--color-card); color: var(--color-foreground); }
  .chart-bars { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-2); height: 200px; padding: var(--space-2) 0; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--space-1); min-width: 0; height: 100%; justify-content: flex-end; }
  .bar-value { font-family: var(--font-number); font-size: 11px; color: var(--muted-foreground); white-space: nowrap; }
  .bar { width: 100%; max-width: 44px; border-radius: 4px 4px 0 0; background: linear-gradient(to top, #0F2410, #3D6B3D); }
  .bar.is-accent { background: linear-gradient(to top, #A8894A, #C9A24B); }
  .chart-xlabels { display: flex; justify-content: space-between; gap: var(--space-2); margin-top: var(--space-2); }
  .chart-xlabels span { flex: 1; text-align: center; font-family: var(--font-eyebrow); font-size: 11px; color: var(--muted-foreground); white-space: nowrap; }
  .donut-wrap { display: flex; align-items: center; gap: var(--space-5); }
  .donut { position: relative; width: 168px; height: 168px; flex-shrink: 0; border-radius: var(--radius-pill); background: conic-gradient(var(--primary-600) 0deg 151.2deg, var(--accent-400) 151.2deg 252deg, var(--success-400) 252deg 324deg, var(--warning-300) 324deg 360deg); }
  .donut-hole { position: absolute; inset: 26px; background: var(--color-card); border-radius: var(--radius-pill); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1); }
  .donut-total-label { font-family: var(--font-eyebrow); font-size: var(--font-size-caption); color: var(--muted-foreground); white-space: nowrap; }
  .donut-total-value { font-family: var(--font-number); font-size: 20px; font-weight: 600; color: var(--color-foreground); white-space: nowrap; }
  .donut-legend { display: flex; flex-direction: column; gap: var(--space-2); flex: 1; min-width: 0; }
  .legend-item { display: flex; align-items: center; gap: var(--space-2); }
  .legend-dot { width: 10px; height: 10px; border-radius: var(--radius-pill); flex-shrink: 0; }
  .legend-dot.c-primary { background: var(--primary-600); }
  .legend-dot.c-accent { background: var(--accent-400); }
  .legend-dot.c-success { background: var(--success-400); }
  .legend-dot.c-warning { background: var(--warning-300); }
  .legend-name { font-size: var(--font-size-caption); color: var(--color-foreground); flex: 1; min-width: 0; white-space: nowrap; }
  .legend-val { font-family: var(--font-number); font-size: var(--font-size-caption); color: var(--muted-foreground); white-space: nowrap; }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">柱状趋势</span>
    <div class="chart-card">
      <div class="chart-toolbar" role="tablist" aria-label="指标切换">
        <button class="chart-toggle is-active" role="tab" aria-selected="true">营收</button>
        <button class="chart-toggle" role="tab" aria-selected="false">访问</button>
      </div>
      <div class="chart-bars" role="img" aria-label="月度营收柱状图">
        <div class="bar-col"><span class="bar-value">84</span><div class="bar" style="height:42%"></div></div>
        <div class="bar-col"><span class="bar-value">126</span><div class="bar" style="height:63%"></div></div>
        <div class="bar-col"><span class="bar-value">98</span><div class="bar" style="height:49%"></div></div>
        <div class="bar-col"><span class="bar-value">152</span><div class="bar is-accent" style="height:76%"></div></div>
        <div class="bar-col"><span class="bar-value">134</span><div class="bar" style="height:67%"></div></div>
        <div class="bar-col"><span class="bar-value">178</span><div class="bar" style="height:89%"></div></div>
        <div class="bar-col"><span class="bar-value">156</span><div class="bar" style="height:78%"></div></div>
      </div>
      <div class="chart-xlabels">
        <span>1月</span><span>2月</span><span>3月</span><span>4月</span><span>5月</span><span>6月</span><span>7月</span>
      </div>
    </div>
  </div>
  <hr class="divider">
  <div class="row">
    <span class="label">环形分布</span>
    <div class="chart-card">
      <div class="donut-wrap">
        <div class="donut" role="img" aria-label="销售渠道分布">
          <div class="donut-hole">
            <span class="donut-total-label">总营收</span>
            <span class="donut-total-value">928万</span>
          </div>
        </div>
        <div class="donut-legend">
          <div class="legend-item"><span class="legend-dot c-primary"></span><span class="legend-name">高端定制</span><span class="legend-val">390万 · 42%</span></div>
          <div class="legend-item"><span class="legend-dot c-accent"></span><span class="legend-name">精品零售</span><span class="legend-val">260万 · 28%</span></div>
          <div class="legend-item"><span class="legend-dot c-success"></span><span class="legend-name">会员服务</span><span class="legend-val">186万 · 20%</span></div>
          <div class="legend-item"><span class="legend-dot c-warning"></span><span class="legend-name">数字内容</span><span class="legend-val">93万 · 10%</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
