<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MochiPet · 宠物综合服务设计系统 UIKit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--font-body);background:var(--color-background);color:var(--color-foreground);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;line-height:var(--line-height-body)}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  svg{display:block}

  /* ===== layout guard (app-kit) ===== */
  .uikit-shell{width:100%;max-width:1184px;margin:0 auto;overflow:hidden;padding:0 var(--space-8)}
  .uikit-truncate{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .uikit-nowrap{white-space:nowrap;flex-shrink:0}
  [data-component]{min-width:0;max-width:100%}
  @media (max-width:640px){.uikit-shell{padding:0 var(--space-4)}.flow-row{flex-direction:column;align-items:center}.demo-row{flex-direction:column}}

  /* ===== top nav ===== */
  .topnav{position:sticky;top:0;z-index:50;background:var(--color-card);border-bottom:1px solid var(--color-border)}
  .topnav-inner{max-width:1184px;margin:0 auto;display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--space-8);overflow-x:auto}
  .topnav-brand{font-family:var(--font-display);font-weight:var(--font-weight-display);font-size:var(--font-size-h4);color:var(--color-primary);white-space:nowrap;display:flex;align-items:center;gap:var(--space-2)}
  .topnav-links{display:flex;gap:var(--space-1);margin-left:auto}
  .topnav-links a{font-size:var(--font-size-caption);font-weight:var(--font-weight-h4);color:var(--color-muted-foreground);padding:var(--space-2) var(--space-3);border-radius:var(--radius-pill);white-space:nowrap;transition:background .2s,color .2s}
  .topnav-links a:hover{background:var(--color-muted);color:var(--color-foreground)}

  /* ===== brand header ===== */
  .brand{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--primary-50),var(--primary-100));border-radius:0 0 var(--radius-2xl) var(--radius-2xl);padding:var(--space-16) var(--space-6) var(--space-12);text-align:center}
  .brand-paw{position:absolute;color:var(--primary-200);opacity:.7}
  .brand-name{font-family:var(--font-display);font-weight:var(--font-weight-display);font-size:var(--font-size-display);line-height:var(--line-height-display);color:var(--color-primary);letter-spacing:-.02em}
  .brand-tag{font-family:var(--font-body);font-size:var(--font-size-lead);font-weight:var(--font-weight-lead);color:var(--neutral-700);margin-top:var(--space-3)}
  .brand-chips{display:flex;gap:var(--space-2);justify-content:center;margin-top:var(--space-6);flex-wrap:wrap}
  .brand-chip{font-size:var(--font-size-caption);font-weight:var(--font-weight-h4);color:var(--color-primary);background:var(--color-card);padding:var(--space-2) var(--space-4);border-radius:var(--radius-pill);box-shadow:var(--shadow-1)}

  /* ===== sections ===== */
  .sec{padding:var(--space-12) 0}
  .sec-head{display:flex;gap:var(--space-4);align-items:flex-start;margin-bottom:var(--space-8)}
  .sec-kicker{font-family:var(--font-display);font-weight:var(--font-weight-display);font-size:var(--font-size-caption);color:var(--color-primary);background:var(--primary-50);padding:var(--space-1) var(--space-3);border-radius:var(--radius-pill);flex-shrink:0;letter-spacing:.06em}
  .sec-title{font-family:var(--font-display);font-weight:var(--font-weight-h2);font-size:var(--font-size-h2);line-height:var(--line-height-h2);color:var(--color-foreground)}
  .sec-sub{font-size:var(--font-size-body);color:var(--color-muted-foreground);margin-top:var(--space-2);max-width:62ch}

  /* ===== color foundations ===== */
  .scale{margin-bottom:var(--space-6)}
  .scale-label{font-family:var(--font-display);font-weight:var(--font-weight-h4);font-size:var(--font-size-body);color:var(--color-foreground);margin-bottom:var(--space-3);display:flex;align-items:baseline;gap:var(--space-2)}
  .scale-label small{font-size:var(--font-size-caption);color:var(--color-muted-foreground);font-weight:var(--font-weight-body)}
  .scale-row{display:flex;gap:var(--space-2);flex-wrap:wrap}
  .sw{flex:1;min-width:64px;display:flex;flex-direction:column;gap:var(--space-2)}
  .sw-chip{height:56px;border-radius:var(--radius-md);box-shadow:var(--shadow-1)}
  .sw-meta{display:flex;flex-direction:column;gap:var(--space-1)}
  .sw-step{font-size:var(--font-size-caption);font-weight:var(--font-weight-h4);color:var(--color-foreground)}
  .sw-hex{font-size:var(--font-size-caption);color:var(--color-muted-foreground);font-family:var(--font-body)}

  .keyvals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:var(--space-4);margin-top:var(--space-8)}
  .kv{display:flex;align-items:center;gap:var(--space-4);background:var(--color-card);padding:var(--space-4);border-radius:var(--radius-lg);box-shadow:var(--shadow-2)}
  .kv-dot{width:48px;height:48px;border-radius:var(--radius-md);flex-shrink:0;box-shadow:var(--shadow-1)}
  .kv-name{font-size:var(--font-size-body);font-weight:var(--font-weight-h4);color:var(--color-foreground)}
  .kv-hex{font-size:var(--font-size-caption);color:var(--color-muted-foreground);font-family:var(--font-body)}

  /* ===== typography ===== */
  .type-stack{display:flex;flex-direction:column;gap:var(--space-5);background:var(--color-card);padding:var(--space-8);border-radius:var(--radius-xl);box-shadow:var(--shadow-2)}
  .type-row{display:grid;grid-template-columns:160px minmax(0,1fr);gap:var(--space-6);align-items:baseline;padding-bottom:var(--space-5);border-bottom:1px solid var(--color-border)}
  .type-row:last-child{border-bottom:none;padding-bottom:0}
  .type-meta{font-size:var(--font-size-caption);color:var(--color-muted-foreground);line-height:var(--line-height-caption)}
  .type-meta b{display:block;font-size:var(--font-size-body);font-weight:var(--font-weight-h4);color:var(--color-foreground);margin-bottom:var(--space-1)}
  .t-display{font-family:var(--font-display);font-weight:var(--font-weight-display);font-size:var(--font-size-display);line-height:var(--line-height-display);color:var(--color-foreground)}
  .t-h1{font-family:var(--font-display);font-weight:var(--font-weight-h1);font-size:var(--font-size-h1);line-height:var(--line-height-h1);color:var(--color-foreground)}
  .t-h2{font-family:var(--font-display);font-weight:var(--font-weight-h2);font-size:var(--font-size-h2);line-height:var(--line-height-h2);color:var(--color-foreground)}
  .t-h3{font-family:var(--font-display);font-weight:var(--font-weight-h3);font-size:var(--font-size-h3);line-height:var(--line-height-h3);color:var(--color-foreground)}
  .t-body{font-family:var(--font-body);font-weight:var(--font-weight-body);font-size:var(--font-size-body);line-height:var(--line-height-body);color:var(--color-foreground)}
  .t-caption{font-family:var(--font-body);font-weight:var(--font-weight-caption);font-size:var(--font-size-caption);line-height:var(--line-height-caption);color:var(--color-muted-foreground)}
  .t-price{font-family:var(--font-price);font-weight:var(--font-weight-price);font-size:var(--font-size-price-lg);line-height:var(--line-height-price);color:var(--color-primary)}

  /* ===== token chips ===== */
  .token-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:var(--space-6)}
  .token-card{background:var(--color-card);padding:var(--space-6);border-radius:var(--radius-xl);box-shadow:var(--shadow-2)}
  .token-card h3{font-family:var(--font-display);font-weight:var(--font-weight-h4);font-size:var(--font-size-body);color:var(--color-foreground);margin-bottom:var(--space-4)}
  .sp-row{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)}
  .sp-bar{height:var(--size-icon-sm);background:var(--color-primary);border-radius:var(--radius-pill)}
  .sp-label{font-size:var(--font-size-caption);color:var(--color-muted-foreground);font-family:var(--font-body);min-width:70px}
  .sp-val{font-size:var(--font-size-caption);color:var(--color-foreground);font-weight:var(--font-weight-h4);margin-left:auto}
  .rad-row{display:flex;align-items:flex-end;gap:var(--space-4);flex-wrap:wrap}
  .rad-item{display:flex;flex-direction:column;align-items:center;gap:var(--space-2)}
  .rad-box{width:56px;height:56px;background:var(--primary-100);border:1.5px solid var(--primary-300)}
  .rad-label{font-size:var(--font-size-caption);color:var(--color-muted-foreground)}
  .sh-row{display:flex;flex-direction:column;gap:var(--space-4)}
  .sh-item{display:flex;align-items:center;gap:var(--space-4);background:var(--color-background);padding:var(--space-4);border-radius:var(--radius-md)}
  .sh-card{width:64px;height:40px;background:var(--color-card);border-radius:var(--radius-md)}
  .sh-label{font-size:var(--font-size-caption);color:var(--color-foreground);font-weight:var(--font-weight-h4)}

  /* ===== demo canvases ===== */
  .demo-row{display:flex;flex-wrap:wrap;gap:var(--space-6)}
  .demo{width:340px;max-width:100%;background:var(--color-background);border-radius:var(--radius-2xl);padding:var(--space-5);box-shadow:var(--shadow-2)}
  .demo-sm{width:300px}
  .demo-label{font-size:var(--font-size-caption);font-weight:var(--font-weight-h4);color:var(--color-muted-foreground);margin-bottom:var(--space-4);letter-spacing:.04em}
  .demo-note{font-size:var(--font-size-caption);color:var(--color-muted-foreground);margin-top:var(--space-4);line-height:var(--line-height-caption)}

  /* ===== search bar ===== */
  .sb-bar{display:flex;align-items:center;gap:var(--space-3)}
  .sb-input{flex:1;min-width:0;height:var(--size-input);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-4);border-radius:var(--radius-pill);background:var(--color-card);box-shadow:var(--shadow-2);color:var(--color-muted-foreground);transition:box-shadow .2s,background .2s}
  .sb-input.focused{background:var(--color-surface);box-shadow:0 0 0 2px var(--color-primary),var(--shadow-1);color:var(--color-primary)}
  .sb-input input{flex:1;min-width:0;border:none;background:none;outline:none;font-family:var(--font-body);font-size:var(--font-size-body);color:var(--color-foreground)}
  .sb-input input::placeholder{color:var(--color-muted-foreground)}
  .sb-avatar{width:var(--size-avatar-md);height:var(--size-avatar-md);border-radius:var(--radius-pill);background:linear-gradient(135deg,var(--primary-300),var(--primary-500));flex-shrink:0;position:relative;box-shadow:var(--shadow-2);display:flex;align-items:center;justify-content:center;color:#FFFFFF}
  .sb-badge{position:absolute;top:-6px;right:-6px;background:var(--color-primary);color:#FFFFFF;font-size:var(--font-size-caption);font-weight:var(--font-weight-h3);padding:var(--space-1) var(--space-2);border-radius:var(--radius-pill);box-shadow:var(--shadow-1);white-space:nowrap;line-height:var(--line-height-price)}

  /* ===== category tab ===== */
  .ct-row{display:flex;gap:var(--space-2);overflow-x:auto;padding-bottom:var(--space-2);-webkit-overflow-scrolling:touch}
  .ct-row::-webkit-scrollbar{display:none}
  .ct-pill{flex-shrink:0;height:36px;padding:0 var(--space-4);border-radius:var(--radius-pill);display:flex;align-items:center;font-size:var(--font-size-body);font-weight:var(--font-weight-h4);font-family:var(--font-body);white-space:nowrap;transition:all .2s}
  .ct-pill.sel{background:var(--color-primary);color:#FFFFFF;box-shadow:var(--shadow-1)}
  .ct-pill.unsel{background:var(--color-card);color:var(--color-foreground);border:1px solid var(--color-border)}
  .ct-pill:active{transform:scale(.96)}

  /* ===== product card ===== */
  .pc-card{background:var(--color-card);border-radius:var(--radius-xl);padding:var(--space-3);box-shadow:var(--shadow-2);display:flex;flex-direction:column;gap:var(--space-2)}
  .pc-img{position:relative;border-radius:var(--radius-lg);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pc-img--primary{background:linear-gradient(135deg,var(--primary-50),var(--primary-100))}
  .pc-img--honey{background:linear-gradient(135deg,var(--warning-50),var(--warning-100))}
  .pc-img--sage{background:linear-gradient(135deg,var(--success-50),var(--success-100))}
  .pc-img svg{opacity:.55}
  .pc-img--primary svg{color:var(--primary-300)}
  .pc-img--honey svg{color:var(--warning-300)}
  .pc-img--sage svg{color:var(--success-300)}
  .pc-badge{position:absolute;top:var(--space-3);left:var(--space-3);background:var(--color-primary);color:#FFFFFF;font-size:var(--font-size-caption);font-weight:700;padding:var(--space-1) var(--space-3);border-radius:var(--radius-pill);box-shadow:var(--shadow-1)}
  .pc-tag{position:absolute;top:var(--space-3);left:var(--space-3);background:var(--success-50);color:var(--color-success);font-size:var(--font-size-caption);font-weight:var(--font-weight-h4);padding:var(--space-1) var(--space-3);border-radius:var(--radius-pill)}
  .pc-name{font-size:var(--font-size-body);font-weight:var(--font-weight-h4);color:var(--color-foreground);line-height:var(--line-height-h4)}
  .pc-foot{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-2)}
  .pc-meta{font-size:var(--font-size-caption);color:var(--color-muted-foreground)}

  /* ===== price ===== */
  .price-lg{font-family:var(--font-price);color:var(--color-primary);line-height:var(--line-height-price);display:inline-flex;align-items:baseline;gap:var(--space-1)}
  .price-lg .sym{font-size:var(--font-size-price-md);font-weight:var(--font-weight-h4)}
  .price-lg .int{font-size:var(--font-size-price-lg);font-weight:var(--font-weight-price)}
  .price-lg .dec{font-size:var(--font-size-price-md);font-weight:var(--font-weight-price)}
  .price-orig-row{display:inline-flex;align-items:baseline;gap:var(--space-2);font-family:var(--font-price)}
  .price-orig-row .cur{font-size:var(--font-size-price-md);font-weight:var(--font-weight-h3);color:var(--color-primary)}
  .price-orig-row .line{font-size:var(--font-size-caption);font-weight:var(--font-weight-body);color:var(--color-muted-foreground);text-decoration:line-through}
  .price-unit-row{display:inline-flex;align-items:baseline;gap:var(--space-1);font-family:var(--font-price)}
  .price-unit-row .main{font-size:var(--font-size-h4);font-weight:var(--font-weight-h3);color:var(--color-primary)}
  .price-unit-row .unit{font-size:var(--font-size-caption);font-weight:var(--font-weight-lead);color:var(--color-muted-foreground)}
  .price-sm{display:inline-flex;align-items:baseline;gap:var(--space-1);font-family:var(--font-price);color:var(--color-primary)}
  .price-sm .sym{font-size:var(--font-size-caption);font-weight:var(--font-weight-h4)}
  .price-sm .int{font-size:var(--font-size-price-md);font-weight:var(--font-weight-h3)}

  /* ===== option selector ===== */
  .opt-block{display:flex;flex-direction:column;gap:var(--space-2)}
  .opt-label{font-size:var(--font-size-caption);font-weight:var(--font-weight-h4);color:var(--color-muted-foreground)}
  .dot-row{display:flex;gap:var(--space-3);align-items:center}
  .dot{width:28px;height:28px;border-radius:var(--radius-pill);flex-shrink:0;cursor:pointer;transition:box-shadow .2s,transform .15s}
  .dot:active{transform:scale(.92)}
  .dot.sel{box-shadow:0 0 0 2px var(--color-background),0 0 0 5px var(--color-primary)}
  .chip-row{display:flex;gap:var(--space-2);flex-wrap:wrap}
  .chip{padding:var(--space-2) var(--space-4);border-radius:var(--radius-md);font-size:var(--font-size-body);font-weight:var(--font-weight-body);font-family:var(--font-body);cursor:pointer;transition:all .2s}
  .chip:active{transform:scale(.96)}
  .chip.sel{background:var(--primary-50);border:1px solid var(--color-primary);color:var(--color-primary)}
  .chip.unsel{background:var(--color-card);border:1px solid var(--color-border);color:var(--color-foreground)}
  .opt-combined{display:flex;flex-direction:column;gap:var(--space-6)}

  /* ===== cart button ===== */
  .cb-primary{width:100%;height:var(--size-button-lg);border-radius:var(--radius-pill);background:var(--color-primary);color:#FFFFFF;font-family:var(--font-body);font-weight:var(--font-weight-h3);font-size:var(--font-size-h4);display:flex;align-items:center;justify-content:center;gap:var(--space-2);box-shadow:var(--shadow-3);transition:transform .15s,box-shadow .2s}
  .cb-primary:hover{box-shadow:var(--shadow-4)}
  .cb-primary:active{transform:scale(.97);box-shadow:var(--shadow-1)}
  .cb-primary.disabled{opacity:.4;cursor:not-allowed}
  .cb-float{height:var(--size-button-md);padding:0 var(--space-5);border-radius:var(--radius-pill);background:var(--color-primary);color:#FFFFFF;font-family:var(--font-price);font-weight:var(--font-weight-h3);font-size:var(--font-size-body);display:inline-flex;align-items:center;gap:var(--space-2);box-shadow:var(--shadow-4)}
  .cb-float .count{background:#FFFFFF;color:var(--color-primary);font-size:var(--font-size-caption);font-weight:var(--font-weight-h3);width:20px;height:20px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center}
  .cb-icon{width:var(--size-button-md);height:var(--size-button-md);border-radius:var(--radius-pill);background:var(--color-card);color:var(--color-primary);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-2);position:relative;transition:transform .15s}
  .cb-icon:active{transform:scale(.92)}
  .cb-icon .count{position:absolute;top:-4px;right:-4px;background:var(--color-primary);color:#FFFFFF;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-1)}
  .cb-outline{height:var(--size-button-lg);padding:0 var(--space-8);border-radius:var(--radius-pill);background:transparent;color:var(--color-primary);border:1.5px solid var(--color-primary);font-family:var(--font-body);font-weight:var(--font-weight-h4);font-size:var(--font-size-h4);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);transition:background .2s}
  .cb-outline:hover{background:var(--primary-50)}
  .cb-outline:active{transform:scale(.97)}

  /* ===== page structure / phone flow ===== */
  .flow-row{display:flex;align-items:flex-start;gap:var(--space-4);justify-content:center;flex-wrap:wrap}
  .flow-col{display:flex;flex-direction:column;align-items:center;gap:var(--space-3)}
  .flow-arrow{align-self:center;color:var(--primary-300);margin-top:var(--space-12)}
  .flow-label{font-size:var(--font-size-caption);font-weight:var(--font-weight-h4);color:var(--color-muted-foreground)}
  .phone{width:300px;border-radius:36px;border:6px solid var(--neutral-800);overflow:hidden;position:relative;box-shadow:var(--shadow-5);background:var(--color-background)}
  .phone-screen{border-radius:inherit;background:var(--color-background);display:flex;flex-direction:column;height:600px}
  .statusbar{display:flex;align-items:center;justify-content:space-between;padding:var(--space-2) var(--space-4);font-size:11px;font-weight:700;color:var(--color-foreground);flex-shrink:0}
  .statusbar-icons{display:flex;align-items:center;gap:var(--space-1);color:var(--color-foreground)}
  .phone-body{flex:1;overflow-y:auto;padding:var(--space-2) var(--space-4) var(--space-4)}
  .phone-home{height:5px;width:120px;background:var(--neutral-400);border-radius:var(--radius-pill);margin:var(--space-2) auto}
  .ph-header{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) 0 var(--space-3);color:var(--color-foreground)}
  .ph-header h4{font-family:var(--font-display);font-weight:var(--font-weight-h3);font-size:var(--font-size-h4)}
  .ph-back{width:32px;height:32px;border-radius:var(--radius-pill);background:var(--color-card);display:flex;align-items:center;justify-content:center;color:var(--color-foreground);box-shadow:var(--shadow-1)}
  .ph-banner{border-radius:var(--radius-xl);padding:var(--space-5);background:linear-gradient(135deg,var(--primary-500),var(--primary-700));color:#FFFFFF;display:flex;flex-direction:column;gap:var(--space-1);position:relative;overflow:hidden}
  .ph-banner .lbl{font-size:var(--font-size-caption);font-weight:var(--font-weight-h4);opacity:.85}
  .ph-banner .big{font-family:var(--font-display);font-weight:var(--font-weight-h3);font-size:var(--font-size-h3);line-height:var(--line-height-h3)}
  .ph-banner .paw{position:absolute;right:var(--space-3);bottom:-8px;color:#FFFFFF;opacity:.18}
  .ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-top:var(--space-3)}

<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

/* ───────── inline SVG icons ───────── */
const Icon = (name, size = 20) => {
  const base = { width: size, height: size, viewBox: "0 0 24 24", "aria-hidden": true };
  const S = { fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" };
  switch (name) {
    case 'search': return <svg {...base} {...S}><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>;
    case 'bell': return <svg {...base} {...S}><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>;
    case 'bag': return <svg {...base} {...S}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>;
    case 'cart': return <svg {...base} {...S}><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>;
    case 'heart': return <svg {...base} {...S}><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21.2l7.8-7.8 1.1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>;
    case 'paw': return <svg {...base} fill="currentColor"><circle cx="5.5" cy="11" r="2.2"/><circle cx="9.3" cy="6.5" r="2.2"/><circle cx="14.7" cy="6.5" r="2.2"/><circle cx="18.5" cy="11" r="2.2"/><path d="M12 12.2c-2.9 0-5.3 2.3-5.3 4.9 0 1.6 1.4 2.4 2.9 2.4.9 0 1.6-.5 2.4-.5s1.5.5 2.4.5c1.5 0 2.9-.8 2.9-2.4 0-2.6-2.4-4.9-5.3-4.9z"/></svg>;
    case 'bone': return <svg {...base} {...S}><path d="M19 7a2.5 2.5 0 0 0-2.5-2.5 2.5 2.5 0 0 0-2 1 2.5 2.5 0 0 0-3 0 2.5 2.5 0 0 0-2-1A2.5 2.5 0 0 0 5 7a2.5 2.5 0 0 0 1 2 2.5 2.5 0 0 0 0 3l3.5 3.5a2.5 2.5 0 0 0 3 0 2.5 2.5 0 0 0 3 0L19 12a2.5 2.5 0 0 0 0-3 2.5 2.5 0 0 0 1-2z" transform="rotate(45 12 12)"/></svg>;
    case 'signal': return <svg {...base} fill="currentColor"><rect x="1" y="14" width="3" height="6" rx="1"/><rect x="6" y="10" width="3" height="10" rx="1"/><rect x="11" y="6" width="3" height="14" rx="1"/><rect x="16" y="2" width="3" height="18" rx="1"/></svg>;
    case 'wifi': return <svg {...base} {...S}><path d="M5 12.5a11 11 0 0 1 14 0"/><path d="M8.5 16a6 6 0 0 1 7 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></svg>;
    case 'battery': return <svg {...base} {...S}><rect x="1" y="7" width="18" height="10" rx="2"/><line x1="23" y1="10" x2="23" y2="14"/></svg>;
    case 'chevron-right': return <svg {...base} {...S}><polyline points="9 18 15 12 9 6"/></svg>;
    case 'arrow-left': return <svg {...base} {...S}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>;
    case 'check': return <svg {...base} {...S}><polyline points="20 6 9 17 4 12"/></svg>;
    default: return null;
  }
};

/* ───────── price sub-components ───────── */
const PriceLg = () => (
  <div className="price-lg"><span className="sym">¥</span><span className="int">499</span><span className="dec">.00</span></div>
);
const PriceOrig = ({cur="199",orig="259"}) => (

const PriceUnit = ({v="88",unit="/袋"}) => (

    <div className="pc-card" data-component="product-card">
      <div className={"pc-img pc-img--"+d.img}>

};

/* ───────── category tab ───────── */
const CategoryTab = ({variant}) => {
  const cats = ["全部","主粮","零食","玩具","洗护美容","健康医疗"];
  const [active, setActive] = useState(0);
  if (variant === "unselected-set") {

        <div className="ct-pill sel">洗护美容</div>

  return (
    <div className="ct-row" data-component="category-tab">

        <div key={c} className={"ct-pill "+(i===active?"sel":"unsel")} onClick={()=>setActive(i)}>{c}</div>
      ))}
    </div>
  );
};

/* ───────── option selector ───────── */
const OptionSelector = ({variant}) => {
  const dots = [
    {c: "var(--success-500)", name:"sage"},
    {c: "var(--warning-400)", name:"honey"},
    {c: "var(--primary-300)", name:"rose"},
    {c: "var(--primary-600)", name:"coral"},
  ];
  const chips = ["鸡肉味","鱼肉味","1.5kg","3kg"];
  const [di, setDi] = useState(3);
  const [ci, setCi] = useState(0);
  const DotRow = () => (
    <div className="opt-block">
      <span className="opt-label">颜色</span>
      <div className="dot-row">
        {dots.map((d,i)=>(
          <div key={d.name} className={"dot"+(i===di?" sel":"")} style={{background:d.c}} onClick={()=>setDi(i)} title={d.name}/>
        ))}
      </div>
    </div>
  );
  const ChipRow = () => (
    <div className="opt-block">
      <span className="opt-label">口味 / 规格</span>
      <div className="chip-row">
        {chips.map((c,i)=>(
          <div key={c} className={"chip "+(i===ci?"sel":"unsel")} onClick={()=>setCi(i)}>{c}</div>
        ))}
      </div>
    </div>
  );
  if (variant === "color-dots") return <div data-component="option-selector"><DotRow/></div>;
  if (variant === "spec-chips") return <div data-component="option-selector"><ChipRow/></div>;
  return <div className="opt-combined" data-component="option-selector"><DotRow/><ChipRow/></div>;
};

/* ───────── cart button ───────── */
const CartButton = ({variant}) => {
  const [count, setCount] = useState(2);
  const [pressed, setPressed] = useState(false);
  if (variant === "primary-cta") {
    return (
      <div data-component="cart-button">
        <button className={"cb-primary"+(pressed?" pressed":"")} onClick={()=>{setCount(count+1); setPressed(true); setTimeout(()=>setPressed(false),300);}}>
          {Icon("bag",20)} 加入购物车
        </button>
        <div className="demo-note">已加入购物车 {count} 件</div>
      </div>
    );
  }
  if (variant === "floating-pill") {
    return (
      <div className="float-cart-wrap" data-component="cart-button">
        <button className="cb-float" onClick={()=>setCount(count+1)}>
          ¥{1080} {Icon("bag",18)} <span className="count">{count}</span>
        </button>
      </div>
    );
  }
  if (variant === "icon-button") {
    return (
      <div data-component="cart-button">
        <button className="cb-icon" onClick={()=>setCount(count+1)}>
          {Icon("bag",20)}
          <span className="count">{count}</span>
        </button>
      </div>
    );
  }
  return (
    <div data-component="cart-button">
      <button className="cb-outline">{Icon("heart",18)} 立即预约</button>
    </div>
  );
};

const StatusBar = () => (
  <div className="statusbar">

    <span className="statusbar-icons">

    </span>

);

const ColorFoundations = () => {
  const primary = [["50","#FCEEE7"],["100","#F8D6C8"],["200","#F2BBA6"],["300","#EB9E83"],["400","#E5896A"],["500","#DE7552"],["600","#D26243"],["700","#B55038"],["800","#934030"],["900","#763328"]];
  const neutral = [["50","#FBF7F4"],["100","#F4ECE6"],["200","#E8DBD1"],["300","#D6C3B6"],["400","#B8A294"],["500","#9A8475"],["600","#7D6A5D"],["700","#5E4F45"],["800","#3F352E"],["900","#2B2522"]];
