<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart Button · MochiPet</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--color-muted-foreground); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: 8px 0; }
/* @component-css-start */
.cart-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); border: none; cursor: pointer; font-family: var(--font-body); white-space: nowrap; flex-shrink: 0; text-decoration: none; box-sizing: border-box; transition: filter .15s, background .15s, transform .1s; }
.cart-btn svg { flex-shrink: 0; }
.cart-primary { background: var(--color-primary); color: var(--color-primary-foreground); border-radius: var(--radius-pill); height: var(--size-button-lg); min-width: var(--size-button-lg); padding: 0 var(--space-8); font-size: 16px; font-weight: 700; box-shadow: var(--shadow-3); width: 100%; }
.cart-primary:hover { filter: brightness(.92); }
.cart-primary:active { box-shadow: var(--shadow-1); transform: scale(.97); }
.cart-outline { background: transparent; color: var(--color-primary); border: 1.5px solid var(--color-primary); border-radius: var(--radius-pill); height: var(--size-button-lg); min-width: var(--size-button-lg); padding: 0 var(--space-6); font-size: 16px; font-weight: 600; width: 100%; }
.cart-outline:hover { background: var(--color-muted); }
.cart-float { background: var(--color-primary); color: var(--color-primary-foreground); border-radius: var(--radius-pill); height: var(--size-button-md); min-width: var(--size-button-md); padding: 0 var(--space-5); font-size: var(--font-size-body); font-weight: 700; box-shadow: var(--shadow-4); }
.cart-float:hover { filter: brightness(.92); }
.cart-float:active { box-shadow: var(--shadow-1); transform: scale(.97); }
.cart-float .dot { width: 6px; height: 6px; border-radius: var(--radius-pill); background: var(--color-primary-foreground); opacity: .9; }
.cart-icon { position: relative; width: var(--size-button-md); height: var(--size-button-md); min-width: var(--size-button-md); border-radius: var(--radius-pill); background: var(--color-card); color: var(--color-primary); box-shadow: var(--shadow-2); }
.cart-icon:hover { filter: brightness(.92); }
.cart-icon:active { box-shadow: var(--shadow-1); transform: scale(.97); }
.badge { position: absolute; top: -2px; right: -2px; min-width: 16px; height: 16px; padding: 0 var(--space-1); border-radius: var(--radius-pill); background: var(--color-primary); color: var(--color-primary-foreground); font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--color-surface); }
/* @component-css-end */
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<symbol id="icon-bag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>
</svg>
<div class="row"><span class="label">主行动</span><a class="cart-btn cart-primary" href="#" data-evidence-sample="primary-cta"><svg width="20" height="20"><use href="#icon-bag"/></svg>加入购物车</a></div>
<div class="row"><span class="label">次操作</span><a class="cart-btn cart-outline" href="#" data-evidence-sample="outline">立即预约</a></div>
<hr class="divider">
<div class="row"><span class="label">购物车入口</span><a class="cart-btn cart-float" href="#" data-evidence-sample="floating-pill"><svg width="20" height="20"><use href="#icon-bag"/></svg>¥1080<span class="dot"></span></a><a class="cart-btn cart-icon" href="#" data-evidence-sample="icon-button" aria-label="购物车"><svg width="20" height="20"><use href="#icon-bag"/></svg><span class="badge">2</span></a></div>
</body>
</html>
