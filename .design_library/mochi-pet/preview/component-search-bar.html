<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search Bar</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin:0; padding:var(--space-3); background:var(--color-background); font-family:var(--font-body); color:var(--color-foreground); }
.row { display:flex; align-items:center; gap:var(--space-3); margin-bottom:var(--space-3); }
.label { width:92px; flex-shrink:0; font-size:var(--font-size-caption); color:var(--color-muted-foreground); }
.divider { border:none; border-top:1px solid var(--color-border); margin:var(--space-1) 0 var(--space-3); }
/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.bar { display:flex; align-items:center; gap:var(--space-3); flex:1; min-width:0; }
.search { display:flex; align-items:center; gap:var(--space-2); flex:1; min-width:0; box-sizing:border-box; height:var(--size-input); padding:var(--space-2) var(--space-4); background:var(--color-card); border:none; border-radius:var(--radius-pill); box-shadow:var(--shadow-2); transition:box-shadow .15s,background .15s,filter .15s; }
.search:hover { filter:brightness(.97); }
.search-icon { width:var(--size-icon-md); height:var(--size-icon-md); flex-shrink:0; color:var(--color-muted-foreground); }
.search-input { flex:1; min-width:0; padding:0; border:none; background:transparent; outline:none; font-family:var(--font-body); font-size:var(--font-size-body); color:var(--color-foreground); }
.search-input::placeholder { color:var(--color-muted-foreground); }
.search:focus-within { background:var(--color-surface); box-shadow:var(--shadow-1),0 0 0 2px var(--ring); }
.search:focus-within .search-icon { color:var(--color-primary); }
.avatar-wrap { position:relative; width:var(--size-avatar-md); height:var(--size-avatar-md); flex-shrink:0; }
.avatar { width:var(--size-avatar-md); height:var(--size-avatar-md); border-radius:var(--radius-pill); background:linear-gradient(135deg,var(--primary-300),var(--primary-500)); box-shadow:var(--shadow-2); }
.badge { position:absolute; top:-7px; right:-4px; z-index:2; background:var(--color-primary); color:var(--color-primary-foreground); font-size:var(--font-size-caption); font-weight:var(--font-weight-h4); padding:var(--space-1) var(--space-3); border-radius:var(--radius-pill); white-space:nowrap; box-shadow:var(--shadow-1); }
/* @component-css-end */
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="icon-search" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
</svg>
<div class="row">
  <span class="label">默认</span>
  <div class="bar" data-evidence-sample="default">
    <div class="search">
      <svg class="search-icon" aria-hidden="true" focusable="false"><use href="#icon-search"/></svg>
      <input class="search-input" type="text" placeholder="搜索 主粮、玩具、洗护…" aria-label="搜索">
    </div>
    <div class="avatar-wrap"><div class="avatar"></div></div>
  </div>
</div>
<div class="row">
  <span class="label">通知</span>
  <div class="bar" data-evidence-sample="with-notification">
    <div class="search">
      <svg class="search-icon" aria-hidden="true" focusable="false"><use href="#icon-search"/></svg>
      <input class="search-input" type="text" placeholder="搜索 主粮、玩具、洗护…" aria-label="搜索">
    </div>
    <div class="avatar-wrap"><div class="avatar"></div><span class="badge">20款新品</span></div>
  </div>
</div>
<hr class="divider">
<div class="row">
  <span class="label">聚焦</span>
  <div class="bar" data-evidence-sample="focused">
    <div class="search">
      <svg class="search-icon" aria-hidden="true" focusable="false"><use href="#icon-search"/></svg>
      <input class="search-input" type="text" placeholder="搜索 主粮、玩具、洗护…" aria-label="搜索" autofocus>
    </div>
  </div>
</div>
</body>
</html>
