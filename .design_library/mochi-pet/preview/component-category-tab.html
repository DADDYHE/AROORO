<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MochiPet · Category Tab</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
.row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--color-muted-foreground); text-transform: uppercase; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }
.scroll-row { display: flex; gap: var(--space-2); flex: 1; min-width: 0; overflow-x: auto; padding-bottom: var(--space-1); scrollbar-width: none; }
.scroll-row::-webkit-scrollbar { display: none; }

/* @component-css-start */
.cat-tab { display: inline-flex; align-items: center; justify-content: center; height: 36px; min-width: 36px; padding: var(--space-2) var(--space-4); border-radius: var(--radius-pill); font-size: 14px; font-weight: 600; line-height: 1; white-space: nowrap; text-decoration: none; flex-shrink: 0; transition: filter .15s, border-color .15s; }
.cat-tab--selected { background: var(--color-primary); color: var(--color-primary-foreground); box-shadow: var(--shadow-1); }
.cat-tab--selected:hover { filter: brightness(.92); }
.cat-tab--unselected { background: var(--color-card); color: var(--color-foreground); border: 1px solid var(--color-border); }
.cat-tab--unselected:hover { filter: brightness(.92); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row">
  <span class="label">混合行</span>
  <div class="scroll-row">
    <a class="cat-tab cat-tab--selected" href="#" data-evidence-sample="row-mixed">全部</a>
    <a class="cat-tab cat-tab--unselected" href="#" data-evidence-sample="row-mixed">主粮</a>
    <a class="cat-tab cat-tab--unselected" href="#" data-evidence-sample="row-mixed">零食</a>
    <a class="cat-tab cat-tab--unselected" href="#" data-evidence-sample="row-mixed">玩具</a>
    <a class="cat-tab cat-tab--unselected" href="#" data-evidence-sample="row-mixed">洗护美容</a>
    <a class="cat-tab cat-tab--unselected" href="#" data-evidence-sample="row-mixed">健康医疗</a>
  </div>
</div>
<hr class="divider">
<div class="row">
  <span class="label">未选中</span>
  <a class="cat-tab cat-tab--unselected" href="#" data-evidence-sample="unselected-set">主粮</a>
  <a class="cat-tab cat-tab--unselected" href="#" data-evidence-sample="unselected-set">零食</a>
  <a class="cat-tab cat-tab--unselected" href="#" data-evidence-sample="unselected-set">玩具</a>
</div>
<div class="row">
  <span class="label">选中态</span>
  <a class="cat-tab cat-tab--selected" href="#" data-evidence-sample="selected-single">洗护美容</a>
</div>
</body>
</html>
