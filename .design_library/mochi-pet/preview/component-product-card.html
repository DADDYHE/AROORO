<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:12px;background:var(--color-background);font-family:var(--font-body);color:var(--color-foreground);}
.label{display:block;font-size:var(--font-size-caption);color:var(--color-muted-foreground);margin:0 0 8px;letter-spacing:.04em;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.divider{border:0;border-top:1px solid var(--color-border);margin:14px 0;}
/* @component-css-start */
.pcard{display:flex;flex-direction:column;gap:var(--space-2);background:var(--color-card);border-radius:var(--radius-xl);box-shadow:var(--shadow-2);padding:var(--space-3);text-decoration:none;transition:filter .15s;}
.pcard:hover{filter:brightness(.97);}
.pcard:focus-visible{outline:2px solid var(--ring);outline-offset:2px;}
.pcard-media{position:relative;aspect-ratio:1/1;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.pcard-media.a{background:linear-gradient(135deg,var(--primary-50),var(--primary-100));color:var(--primary-400);}
.pcard-media.b{background:linear-gradient(135deg,var(--warning-50),var(--warning-100));color:var(--warning-400);}
.pcard-media.c{background:linear-gradient(135deg,var(--success-50),var(--success-100));color:var(--success-400);}
.pcard-media svg{width:46%;height:46%;fill:currentColor;opacity:.5;}
.pcard-badge{position:absolute;top:8px;left:8px;background:var(--color-primary);color:var(--color-primary-foreground);font-size:var(--font-size-caption);font-weight:700;border-radius:var(--radius-pill);padding:var(--space-1) var(--space-3);box-shadow:var(--shadow-2);}
.pcard-name{font-size:var(--font-size-body);font-weight:600;color:var(--color-foreground);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pcard-tag{align-self:flex-start;background:var(--success-100);color:var(--color-success);font-size:var(--font-size-caption);font-weight:600;border-radius:var(--radius-pill);padding:var(--space-1) var(--space-3);}
.pcard-price{display:flex;align-items:baseline;gap:6px;}
.pcard-now{font-family:var(--font-price);font-size:var(--font-size-price);font-weight:800;color:var(--color-primary);line-height:1.2;}
.pcard-unit{font-size:var(--font-size-caption);color:var(--color-muted-foreground);}
.pcard-orig{font-size:var(--font-size-caption);color:var(--color-muted-foreground);text-decoration:line-through;}
/* @component-css-end */
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg"><symbol id="paw" viewBox="0 0 24 24"><ellipse cx="12" cy="15" rx="5" ry="4"/><circle cx="6" cy="9" r="2.2"/><circle cx="18" cy="9" r="2.2"/><circle cx="9" cy="5.5" r="2"/><circle cx="15" cy="5.5" r="2"/></symbol></svg>
<span class="label">标准 · 划线价</span>
<div class="grid">
<a class="pcard" href="#" data-evidence-sample="standard"><span class="pcard-media a"><svg><use href="#paw"/></svg></span><span class="pcard-name">冻干主粮 鸡肉味</span><span class="pcard-price"><span class="pcard-now">¥128</span><span class="pcard-unit">/袋</span></span></a>
<a class="pcard" href="#" data-evidence-sample="with-discount"><span class="pcard-media b"><svg><use href="#paw"/></svg></span><span class="pcard-name">逗猫棒羽毛款</span><span class="pcard-price"><span class="pcard-now">¥89</span><span class="pcard-orig">¥108</span></span></a>
</div>
<hr class="divider">
<span class="label">新品标签 · 服务类</span>
<div class="grid">
<a class="pcard" href="#" data-evidence-sample="with-badge"><span class="pcard-media a"><span class="pcard-badge">新品</span><svg><use href="#paw"/></svg></span><span class="pcard-name">冻干主粮 鸡肉味</span><span class="pcard-price"><span class="pcard-now">¥128</span><span class="pcard-unit">/袋</span></span></a>
<a class="pcard" href="#" data-evidence-sample="service-type"><span class="pcard-media c"><svg><use href="#paw"/></svg></span><span class="pcard-name">到店洗护美容</span><span class="pcard-tag">到店洗护</span><span class="pcard-price"><span class="pcard-now">¥168</span><span class="pcard-unit">/次</span></span></a>
</div>
</body>
</html>
