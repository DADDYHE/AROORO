<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建活动</title>
    <style id="theme-vars">
:root {
  --petlux-brand: #4F5E35;
  --petlux-brand-deep: #3A4626;
  --petlux-brand-soft: #EAEDDF;
  --petlux-brand-ink: #FAFAF6;
  --petlux-bg: #EDF0E2;
  --petlux-surface: #FFFFFF;
  --petlux-surface-2: #E2E6D3;
  --petlux-surface-3: #D6DBC5;
  --petlux-ink: #2A2823;
  --petlux-ink-2: #635E54;
  --petlux-ink-3: #9A9489;
  --petlux-line: #D8DCCE;
  --petlux-line-strong: #C9CFBA;
  --petlux-state-success: #5B7C4A;
  --petlux-state-warning: #B8893A;
  --petlux-state-error: #A85B4A;
  --petlux-state-info: #6B7D8C;
  --petlux-radius-xs: 4px; --petlux-radius-sm: 8px; --petlux-radius-md: 12px; --petlux-radius-lg: 16px; --petlux-radius-pill: 999px;
  --petlux-shadow-1: 0 1px 3px rgba(42,40,35,0.04), 0 1px 2px rgba(42,40,35,0.03);
  --petlux-shadow-2: 0 8px 24px -8px rgba(42,40,35,0.12);
  --petlux-shadow-3: 0 16px 48px -16px rgba(42,40,35,0.20);
  --petlux-s-1: 4px; --petlux-s-2: 8px; --petlux-s-3: 12px; --petlux-s-4: 16px; --petlux-s-5: 24px; --petlux-s-6: 32px; --petlux-s-7: 48px;
  --petlux-font-sans: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --petlux-text-display: 32px; --petlux-text-h1: 24px; --petlux-text-h2: 20px; --petlux-text-h3: 17px; --petlux-text-body: 15px; --petlux-text-body-sm: 13px; --petlux-text-caption: 12px;
  --petlux-weight-regular: 400; --petlux-weight-medium: 500; --petlux-weight-semibold: 600;
  --petlux-background: var(--petlux-bg);
  --petlux-foreground: var(--petlux-ink);
  --petlux-card: var(--petlux-surface);
  --petlux-card-foreground: var(--petlux-ink);
  --petlux-popover: var(--petlux-surface);
  --petlux-popover-foreground: var(--petlux-ink);
  --petlux-primary: var(--petlux-brand);
  --petlux-primary-foreground: var(--petlux-brand-ink);
  --petlux-secondary: var(--petlux-surface-2);
  --petlux-secondary-foreground: var(--petlux-ink-2);
  --petlux-muted: var(--petlux-surface-2);
  --petlux-muted-foreground: var(--petlux-ink-2);
  --petlux-accent: var(--petlux-brand-soft);
  --petlux-accent-foreground: var(--petlux-brand);
  --petlux-destructive: var(--petlux-state-error);
  --petlux-destructive-foreground: #FAFAF6;
  --petlux-border: var(--petlux-line);
  --petlux-input: var(--petlux-line-strong);
  --petlux-ring: var(--petlux-brand);
  --petlux-radius-small: var(--petlux-radius-sm);
  --petlux-radius-medium: var(--petlux-radius-md);
  --petlux-radius-large: var(--petlux-radius-lg);
}
.dark {
  --petlux-background: #161612; --petlux-foreground: #EDE9E0;
  --petlux-card: #1F1E1A; --petlux-card-foreground: #EDE9E0;
  --petlux-popover: #1F1E1A; --petlux-popover-foreground: #EDE9E0;
  --petlux-primary: #7A8C5A; --petlux-primary-foreground: #161612;
  --petlux-muted: #2A2924; --petlux-muted-foreground: #9A9489;
  --petlux-border: #34322C; --petlux-input: #34322C; --petlux-ring: #7A8C5A;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--petlux-background); --color-foreground: var(--petlux-foreground);
        --color-card: var(--petlux-card); --color-card-foreground: var(--petlux-card-foreground);
        --color-popover: var(--petlux-popover); --color-popover-foreground: var(--petlux-popover-foreground);
        --color-primary: var(--petlux-primary); --color-primary-foreground: var(--petlux-primary-foreground);
        --color-secondary: var(--petlux-secondary); --color-secondary-foreground: var(--petlux-secondary-foreground);
        --color-muted: var(--petlux-muted); --color-muted-foreground: var(--petlux-muted-foreground);
        --color-accent: var(--petlux-accent); --color-accent-foreground: var(--petlux-accent-foreground);
        --color-destructive: var(--petlux-destructive); --color-destructive-foreground: var(--petlux-destructive-foreground);
        --color-border: var(--petlux-border); --color-input: var(--petlux-input); --color-ring: var(--petlux-ring);
        --radius-sm: var(--petlux-radius-sm); --radius-md: var(--petlux-radius-md); --radius-lg: var(--petlux-radius-lg);
      }
      @layer base { body { background: var(--petlux-background); color: var(--petlux-foreground); } }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--petlux-background); } .text-foreground { color: var(--petlux-foreground); }
      .bg-card { background-color: var(--petlux-card); } .text-card-foreground { color: var(--petlux-card-foreground); }
      .bg-popover { background-color: var(--petlux-popover); } .text-popover-foreground { color: var(--petlux-popover-foreground); }
      .bg-primary { background-color: var(--petlux-primary); } .text-primary { color: var(--petlux-primary); }
      .bg-primary-foreground { background-color: var(--petlux-primary-foreground); } .text-primary-foreground { color: var(--petlux-primary-foreground); }
      .bg-secondary { background-color: var(--petlux-secondary); } .text-secondary-foreground { color: var(--petlux-secondary-foreground); }
      .bg-muted { background-color: var(--petlux-muted); } .text-muted-foreground { color: var(--petlux-muted-foreground); }
      .bg-accent { background-color: var(--petlux-accent); } .text-accent-foreground { color: var(--petlux-accent-foreground); }
      .bg-destructive { background-color: var(--petlux-destructive); } .text-destructive { color: var(--petlux-destructive); }
      .text-destructive-foreground { color: var(--petlux-destructive-foreground); }
      .border-border { border-color: var(--petlux-border); } .border-input { border-color: var(--petlux-input); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .text-ink { color: var(--petlux-ink); } .text-ink-2 { color: var(--petlux-ink-2); } .text-ink-3 { color: var(--petlux-ink-3); }
      .card-accent-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 0 3px 3px 0; }
      .form-input, .form-picker, .form-textarea, .location-picker {
        background-color: var(--petlux-surface);
        border: 1px solid var(--petlux-input);
        border-radius: var(--petlux-radius-sm);
        padding: 10px 12px;
        font-size: 14px;
        color: var(--petlux-ink);
        width: 100%;
        outline: none;
        transition: border-color .2s ease;
      }
      .form-input:focus, .form-picker:focus, .form-textarea:focus, .location-picker:focus {
        border-color: var(--petlux-brand);
      }
      .form-input::placeholder, .form-textarea::placeholder { color: var(--petlux-ink-3); }
      .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
      .modal-sheet { background: var(--petlux-card); border-radius: var(--petlux-radius-lg) var(--petlux-radius-lg) 0 0; width: 100%; max-width: 28rem; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
<style id="critical-layout">
html, body { max-width: 100%; overflow-x: hidden; }
body { margin: 0; background-color: var(--petlux-background); -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
main > .petlux-shell { width: 100%; max-width: 28rem; margin-left: auto; margin-right: auto; }
header[data-topbar] { min-height: 56px; }
</style>
<style id="petlux-utilities">
  .petlux-card { box-shadow: var(--petlux-shadow-1); transition: transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s ease; }
  .petlux-card:hover { transform: translateY(-2px); box-shadow: var(--petlux-shadow-2); }
  .petlux-tap { transition: background-color .2s ease, opacity .2s ease; }
  .petlux-tap:hover { background-color: var(--petlux-muted); }
  .petlux-tap:active { opacity: .65; }
  .petlux-btn-press { transition: transform .15s ease, box-shadow .25s ease, background-color .2s ease; }
  .petlux-btn-press:hover { box-shadow: var(--petlux-shadow-2); }
  .petlux-btn-press:active { transform: scale(.98); }
</style>
<main>
  <div class="fixed top-0 right-3 z-50 flex items-center w-[88px] h-8 rounded-full border border-black/10 shrink-0" style="top: calc(env(safe-area-inset-top, 0px) + 12px);">
      <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="更多">
        <i data-lucide="more-horizontal" class="w-4 h-4 text-foreground"></i>
      </button>
      <span class="w-px h-3 bg-black/10 block"></span>
      <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
        <i data-lucide="x" class="w-4 h-4 text-foreground"></i>
      </button>
    </div>

<div class="petlux-shell max-w-md mx-auto bg-background min-h-screen pb-24 relative">

  <!-- Sticky Topbar -->
  <header data-topbar class="sticky top-0 z-30 h-14 px-4 flex items-center justify-between bg-background/95 backdrop-blur-sm border-b border-border">
<button class="flex items-center justify-center w-8 h-8 -ml-1 petlux-tap rounded-full" aria-label="返回">
      <i data-lucide="arrow-left" class="w-5 h-5 text-foreground"></i>
    </button>
    <span class="text-base font-medium text-foreground">创建活动</span>
    <div class="w-8 h-8 gap-2">
      </div>
  </header>

  <!-- Gallery Container -->
  <div class="gallery-container">

    <!-- Form Scroll -->
    <div class="form-scroll">

      <!-- Gallery Header -->
      <div class="gallery-header pt-6 pb-2">
        <div class="brand-block relative px-4">
          <div class="brand-accent-bar absolute top-0 left-4 w-3 h-1.5 bg-primary rounded-b-[3px]"></div>
          <div class="brand-main relative mb-3">
            <span class="brand-text block text-3xl font-light tracking-[0.2em] text-ink leading-none">创建活动</span>
          </div>
          <div class="brand-meta flex items-center gap-2">
            <div class="brand-meta-line relative w-6 h-px bg-border"></div>
            <span class="brand-subtitle text-xs text-ink-2 tracking-[0.15em]">发布线下宠物活动</span>
          </div>
        </div>
      </div>

      <!-- Gallery Hall -->
      <div class="gallery-hall p-4 pt-3">

        <!-- Card 1: Basic Info -->
        <div class="gallery-card bg-card rounded-lg overflow-hidden mb-3 petlux-card relative">
          <div class="card-accent-bar" style="background: var(--petlux-brand);"></div>
          <div class="card-body p-4 pl-5">
            <div class="form-section-title text-sm font-semibold text-ink mb-4">基本信息</div>

            <div class="form-field mb-4">
              <label class="form-label block text-xs text-ink-2 mb-1.5">活动标题 <span class="text-destructive">*</span></label>
              <input type="text" class="form-input" placeholder="请输入活动标题" maxlength="50" />
            </div>

            <div class="form-field mb-4">
              <label class="form-label block text-xs text-ink-2 mb-1.5">活动分类</label>
              <div class="form-picker flex items-center justify-between petlux-tap cursor-pointer">
                <span class="form-picker-text text-sm text-ink">户外聚会</span>
                <span class="form-picker-arrow text-lg text-ink-3">›</span>
              </div>
            </div>

            <div class="form-field mb-4">
              <label class="form-label block text-xs text-ink-2 mb-1.5">活动描述</label>
              <textarea class="form-textarea" rows="3" placeholder="请描述活动详情" maxlength="1000"></textarea>
            </div>

            <div class="form-field mb-4">
              <label class="form-label block text-xs text-ink-2 mb-1.5">封面图片</label>
              <div class="image-upload-area h-32 rounded-md border-2 border-dashed border-border flex items-center justify-center petlux-tap cursor-pointer bg-muted/30">
                <div class="upload-placeholder flex flex-col items-center gap-2">
                  <div class="w-10 h-10 rounded-full bg-accent flex items-center justify-center">
                    <i data-lucide="plus" class="w-5 h-5 text-accent-foreground"></i>
                  </div>
                  <span class="upload-text text-xs text-ink-3">上传封面</span>
                </div>
              </div>
            </div>

            <div class="form-field">
              <label class="form-label block text-xs text-ink-2 mb-1.5">活动图片 (最多9张)</label>
              <div class="image-grid grid grid-cols-3 gap-2">
                <div class="image-grid-item aspect-square rounded-md overflow-hidden relative bg-muted">
                  <img src="../assets/pet-dog.jpg" alt="活动图片" class="w-full h-full object-cover" />
                  <button class="image-remove absolute top-1 right-1 w-5 h-5 rounded-full bg-black/50 text-white flex items-center justify-center text-xs leading-none">×</button>
                </div>
                <div class="image-grid-item aspect-square rounded-md overflow-hidden relative bg-muted">
                  <img src="../assets/pet-cat.jpg" alt="活动图片" class="w-full h-full object-cover" />
                  <button class="image-remove absolute top-1 right-1 w-5 h-5 rounded-full bg-black/50 text-white flex items-center justify-center text-xs leading-none">×</button>
                </div>
                <div class="image-grid-item image-add aspect-square rounded-md border-2 border-dashed border-border flex items-center justify-center petlux-tap cursor-pointer bg-muted/30">
                  <i data-lucide="plus" class="w-6 h-6 text-ink-3"></i>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Card 2: Time & Location -->
        <div class="gallery-card bg-card rounded-lg overflow-hidden mb-3 petlux-card relative">
          <div class="card-accent-bar" style="background: var(--petlux-brand);"></div>
          <div class="card-body p-4 pl-5">
            <div class="form-section-title text-sm font-semibold text-ink mb-4">时间地点</div>

            <div class="form-row flex gap-3 mb-4">
              <div class="form-field form-field-half flex-1">
                <label class="form-label block text-xs text-ink-2 mb-1.5">开始日期 <span class="text-destructive">*</span></label>
                <div class="form-picker flex items-center justify-between petlux-tap cursor-pointer">
                  <span class="form-picker-text text-sm text-ink">2024-07-27</span>
                  <span class="form-picker-arrow text-lg text-ink-3">›</span>
                </div>
              </div>
              <div class="form-field form-field-half flex-1">
                <label class="form-label block text-xs text-ink-2 mb-1.5">开始时间 <span class="text-destructive">*</span></label>
                <div class="form-picker flex items-center justify-between petlux-tap cursor-pointer">
                  <span class="form-picker-text text-sm text-ink">14:00</span>
                  <span class="form-picker-arrow text-lg text-ink-3">›</span>
                </div>
              </div>
            </div>

            <div class="form-row flex gap-3 mb-4">
              <div class="form-field form-field-half flex-1">
                <label class="form-label block text-xs text-ink-2 mb-1.5">结束日期</label>
                <div class="form-picker flex items-center justify-between petlux-tap cursor-pointer">
                  <span class="form-picker-text text-sm text-ink-3">选择日期</span>
                  <span class="form-picker-arrow text-lg text-ink-3">›</span>
                </div>
              </div>
              <div class="form-field form-field-half flex-1">
                <label class="form-label block text-xs text-ink-2 mb-1.5">结束时间</label>
                <div class="form-picker flex items-center justify-between petlux-tap cursor-pointer">
                  <span class="form-picker-text text-sm text-ink-3">选择时间</span>
                  <span class="form-picker-arrow text-lg text-ink-3">›</span>
                </div>
              </div>
            </div>

            <div class="form-field">
              <label class="form-label block text-xs text-ink-2 mb-1.5">活动地点 <span class="text-destructive">*</span></label>
              <div class="location-picker flex items-center justify-between petlux-tap cursor-pointer">
                <span class="location-picker-text text-sm text-ink flex items-center gap-1.5">
                  <i data-lucide="map-pin" class="w-4 h-4 text-primary"></i>
                  徐汇滨江绿地·宠物乐园
                </span>
                <div class="location-picker-right flex items-center gap-2">
                  <button class="location-clear w-5 h-5 rounded-full bg-muted flex items-center justify-center" aria-label="清除">
                    <span class="clear-icon text-xs text-ink-2">×</span>
                  </button>
                  <span class="form-picker-arrow text-lg text-ink-3">›</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Card 3: Fee & Capacity -->
        <div class="gallery-card bg-card rounded-lg overflow-hidden mb-3 petlux-card relative">
          <div class="card-accent-bar" style="background: var(--petlux-brand);"></div>
          <div class="card-body p-4 pl-5">
            <div class="form-section-title text-sm font-semibold text-ink mb-4">费用与名额</div>

            <div class="form-row flex gap-3 mb-4">
              <div class="form-field form-field-half flex-1">
                <label class="form-label block text-xs text-ink-2 mb-1.5">每人价格</label>
                <input type="text" class="form-input" placeholder="0" inputmode="decimal" />
              </div>
              <div class="form-field form-field-half flex-1">
                <label class="form-label block text-xs text-ink-2 mb-1.5">每宠价格</label>
                <input type="text" class="form-input" placeholder="0" inputmode="decimal" />
              </div>
            </div>

            <div class="form-field">
              <label class="form-label block text-xs text-ink-2 mb-1.5">最大人数</label>
              <input type="number" class="form-input" placeholder="0 表示不限" />
            </div>
          </div>
        </div>

        <!-- Card 4: Creator Info -->
        <div class="gallery-card bg-card rounded-lg overflow-hidden mb-3 petlux-card relative">
          <div class="card-accent-bar" style="background: var(--petlux-brand);"></div>
          <div class="card-body p-4 pl-5">
            <div class="form-section-title text-sm font-semibold text-ink mb-4">创建者信息</div>

            <div class="form-field mb-4">
              <label class="form-label block text-xs text-ink-2 mb-1.5">联系人</label>
              <input type="text" class="form-input" placeholder="请输入联系人姓名" />
            </div>

            <div class="form-field mb-4">
              <label class="form-label block text-xs text-ink-2 mb-1.5">联系电话 <span class="text-destructive">*</span></label>
              <input type="tel" class="form-input" placeholder="请输入联系电话" maxlength="11" />
            </div>

            <div class="form-field">
              <label class="form-label block text-xs text-ink-2 mb-1.5">微信号</label>
              <input type="text" class="form-input" placeholder="请输入微信号" />
            </div>
          </div>
        </div>

      </div>

      <!-- Action Bar (Fixed) -->
      <div class="action-bar fixed bottom-0 left-0 right-0 z-30 bg-background/95 backdrop-blur-sm border-t border-border">
        <div class="max-w-md mx-auto flex items-center gap-3 px-4 py-3">
          <button class="action-btn action-btn-draft flex-1 h-11 rounded-lg border border-border bg-card text-sm font-medium text-ink petlux-btn-press">
            <span class="action-btn-text">保存草稿</span>
          </button>
          <button class="action-btn action-btn-publish flex-1 h-11 rounded-lg bg-primary text-sm font-medium text-primary-foreground petlux-btn-press" style="box-shadow: 0 4px 12px -4px rgba(79,94,53,0.3);">
            <span class="action-btn-text">立即发布</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Picker Modal (Category Selection) -->
  <div class="picker-mask modal-mask">
    <div class="picker-sheet modal-sheet">
      <div class="picker-sheet-header flex items-center justify-center px-4 py-3 border-b border-border relative">
        <span class="picker-sheet-title text-base font-semibold text-ink">选择分类</span>
      </div>
      <div class="picker-sheet-body py-2 max-h-[50vh] overflow-y-auto no-scrollbar">
        <div class="picker-sheet-item flex items-center justify-between px-4 py-3 petlux-tap cursor-pointer">
          <span class="picker-sheet-item-text text-sm text-ink">户外聚会</span>
          <i data-lucide="check" class="w-4 h-4 text-primary picker-check"></i>
        </div>
        <div class="picker-sheet-item flex items-center justify-between px-4 py-3 petlux-tap cursor-pointer">
          <span class="picker-sheet-item-text text-sm text-ink">室内沙龙</span>
        </div>
        <div class="picker-sheet-item flex items-center justify-between px-4 py-3 petlux-tap cursor-pointer">
          <span class="picker-sheet-item-text text-sm text-ink">宠物培训</span>
        </div>
        <div class="picker-sheet-item flex items-center justify-between px-4 py-3 petlux-tap cursor-pointer">
          <span class="picker-sheet-item-text text-sm text-ink">亲子互动</span>
        </div>
        <div class="picker-sheet-item flex items-center justify-between px-4 py-3 petlux-tap cursor-pointer">
          <span class="picker-sheet-item-text text-sm text-ink">赛事竞技</span>
        </div>
        <div class="picker-sheet-item flex items-center justify-between px-4 py-3 petlux-tap cursor-pointer">
          <span class="picker-sheet-item-text text-sm text-ink">公益领养</span>
        </div>
      </div>
    </div>
  </div>

</div>
</main>
<script>lucide.createIcons();</script>
</body>
</html>
