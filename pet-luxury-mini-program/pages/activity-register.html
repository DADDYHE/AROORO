    <style id="theme-vars">
/* ============================================================
   Pet Luxury Mini-Program — Design Token System
   Migrated from olive-green fresh-food app to healing light-luxury pet brand
   Brand prefix: petlux
   ============================================================ */

:root {
  /* ---------- Brand Primary (single hue: warm olive green) ---------- */
  --petlux-brand: #4F5E35;           /* primary olive — CTAs, active states */
  --petlux-brand-deep: #3A4626;      /* hover / pressed step */
  --petlux-brand-soft: #EAEDDF;      /* 8% brand tint for tags, soft fills */
  --petlux-brand-ink: #FAFAF6;       /* text on brand fills */

  /* ---------- Surfaces (olive-tinted — brand primary light variant) ---------- */
  --petlux-bg: #EDF0E2;              /* olive-tinted page base — brand light variant */
  --petlux-surface: #FFFFFF;         /* white card */
  --petlux-surface-2: #E2E6D3;       /* olive hover / selected */
  --petlux-surface-3: #D6DBC5;       /* deeper olive fill */

  /* ---------- Ink (text) ---------- */
  --petlux-ink: #2A2823;             /* primary text — warm near-black */
  --petlux-ink-2: #635E54;           /* secondary text */
  --petlux-ink-3: #9A9489;           /* tertiary / placeholder */

  /* ---------- Lines & Dividers ---------- */
  --petlux-line: #D8DCCE;            /* hairline divider — olive tint */
  --petlux-line-strong: #C9CFBA;     /* emphasized border */

  /* ---------- State Colors (semantic only, never brand) ---------- */
  --petlux-state-success: #5B7C4A;
  --petlux-state-warning: #B8893A;
  --petlux-state-error: #A85B4A;
  --petlux-state-info: #6B7D8C;

  /* ---------- Radius Scale (2 / 8 / 12 / 16) ---------- */
  --petlux-radius-xs: 4px;
  --petlux-radius-sm: 8px;
  --petlux-radius-md: 12px;
  --petlux-radius-lg: 16px;
  --petlux-radius-pill: 999px;

  /* ---------- Shadow (subtle, alpha <= 0.05 for static) ---------- */
  --petlux-shadow-1: 0 1px 3px rgba(42,40,35,0.04), 0 1px 2px rgba(42,40,35,0.03);
  --petlux-shadow-2: 0 8px 24px -8px rgba(42,40,35,0.12);
  --petlux-shadow-3: 0 16px 48px -16px rgba(42,40,35,0.20);

  /* ---------- Spacing (8pt grid) ---------- */
  --petlux-s-1: 4px;
  --petlux-s-2: 8px;
  --petlux-s-3: 12px;
  --petlux-s-4: 16px;
  --petlux-s-5: 24px;
  --petlux-s-6: 32px;
  --petlux-s-7: 48px;

  /* ---------- Typography ---------- */
  --petlux-font-sans: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --petlux-font-latin: "Inter", system-ui, sans-serif;
  --petlux-font-mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;

  --petlux-text-display: 32px;
  --petlux-text-h1: 24px;
  --petlux-text-h2: 20px;
  --petlux-text-h3: 17px;
  --petlux-text-body: 15px;
  --petlux-text-body-sm: 13px;
  --petlux-text-caption: 12px;

  --petlux-leading-tight: 1.2;
  --petlux-leading-normal: 1.55;
  --petlux-leading-relaxed: 1.7;

  --petlux-weight-regular: 400;
  --petlux-weight-medium: 500;
  --petlux-weight-semibold: 600;

  --petlux-tracking-tight: -0.02em;
  --petlux-tracking-normal: 0;
  --petlux-tracking-wide: 0.01em;

  /* ============================================================
     Semantic Aliases — required by apply-html-head-contract.mjs
     ============================================================ */

  --petlux-background: var(--petlux-bg);
  --petlux-foreground: var(--petlux-ink);

  --petlux-card: var(--petlux-surface);
  --petlux-card-foreground: var(--petlux-ink);

  --petlux-popover: var(--petlux-surface);
  --petlux-popover-foreground: var(--petlux-ink);

  --petlux-primary: var(--petlux-brand);
  --petlux-primary-foreground: var(--petlux-brand-ink);

  --petlux-secondary: var(--petlux-surface-2);
  --petlux-secondary-foreground: var(--petlux-ink-2);

  --petlux-muted: var(--petlux-surface-2);
  --petlux-muted-foreground: var(--petlux-ink-2);

  --petlux-accent: var(--petlux-brand-soft);
  --petlux-accent-foreground: var(--petlux-brand);

  --petlux-destructive: var(--petlux-state-error);
  --petlux-destructive-foreground: #FAFAF6;

  --petlux-border: var(--petlux-line);
  --petlux-input: var(--petlux-line-strong);
  --petlux-ring: var(--petlux-brand);

  --petlux-radius-small: var(--petlux-radius-sm);
  --petlux-radius-medium: var(--petlux-radius-md);
  --petlux-radius-large: var(--petlux-radius-lg);
}

/* ---------- Dark mode stub (project is light-only; reserved) ---------- */
.dark {
  --petlux-background: #161612;
  --petlux-foreground: #EDE9E0;
  --petlux-card: #1F1E1A;
  --petlux-card-foreground: #EDE9E0;
  --petlux-popover: #1F1E1A;
  --petlux-popover-foreground: #EDE9E0;
  --petlux-primary: #7A8C5A;
  --petlux-primary-foreground: #161612;
  --petlux-muted: #2A2924;
  --petlux-muted-foreground: #9A9489;
  --petlux-border: #34322C;
  --petlux-input: #34322C;
  --petlux-ring: #7A8C5A;
}

    </style>

<body class="min-h-screen font-sans antialiased">
<main>
  <div class="fixed top-0 right-3 z-50 flex items-center w-[88px] h-8 rounded-full border border-black/10 shrink-0" style="top: calc(env(safe-area-inset-top, 0px) + 12px);">
      <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="更多">
        <i data-lucide="more-horizontal" class="w-4 h-4 text-foreground"></i>
      </button>
      <span class="w-px h-3 bg-black/10 block"></span>
      <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
        <i data-lucide="x" class="w-4 h-4 text-foreground"></i>
      </button>
    </div>

<div class="petlux-shell max-w-md mx-auto bg-background min-h-screen pb-28">

  <!-- 顶部栏 -->
  <header data-topbar class="sticky top-0 z-20 h-14 px-4 flex items-center justify-between bg-background/95 backdrop-blur-sm border-b border-border">
<div class="flex items-center gap-1.5 min-w-0 gap-2">
      <button type="button" aria-label="返回" class="flex items-center justify-center w-8 h-8 -ml-1 text-foreground"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
      <h1 class="text-base font-semibold text-foreground">活动报名</h1>
      </div>
    <button type="button" aria-label="更多" class="flex items-center justify-center w-8 h-8 text-foreground"><i data-lucide="more-horizontal" class="w-5 h-5"></i></button>
  </header>

  <!-- 活动信息头部 -->
  <section class="activity-header px-5 pt-5 mb-6">
    <div class="relative rounded-lg overflow-hidden shadow-[var(--petlux-shadow-2)]">
      <img src="../assets/pet-activity.jpg" alt="秋日毛孩子野餐派对" class="w-full h-44 object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent"></div>
      <div class="absolute inset-0 p-5 flex flex-col justify-end gap-2.5 text-white">
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-white/20 backdrop-blur-sm text-[11px] tracking-wide"><i data-lucide="sparkles" class="w-3 h-3"></i>限时报名中</span>
        </div>
        <h2 class="text-xl font-semibold leading-snug">秋日毛孩子野餐派对</h2>
        <div class="flex flex-col gap-1.5 text-[13px] text-white/90">
          <div class="flex items-center gap-1.5">
            <i data-lucide="clock" class="w-3.5 h-3.5 shrink-0"></i>
            <span>10月18日 周六 14:00 - 17:00</span>
          </div>
          <div class="flex items-center gap-1.5">
            <i data-lucide="map-pin" class="w-3.5 h-3.5 shrink-0"></i>
            <span>徐汇滨江绿地 · A区草坪</span>
          </div>
        </div>
        <div class="flex items-end gap-0.5 mt-1">
          <span class="text-sm font-medium leading-none">¥</span>
          <span class="text-2xl font-semibold leading-none font-mono">332</span>
          <span class="text-xs ml-1 mb-0.5 text-white/80">元 / 2人2宠</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Section 01: 报名信息 -->
  <section class="form-section px-5 mb-8">
    <div class="flex items-center gap-2 mb-1">
      <span class="text-xs text-muted-foreground font-mono">01</span>
      <h2 class="text-base font-semibold text-foreground">报名信息</h2>
    </div>
    <span class="block w-8 h-px bg-primary/60 mb-4"></span>

    <div class="flex flex-col gap-3">

      <!-- 宠物 1 -->
      <div class="pet-section bg-card rounded-md shadow-[var(--petlux-shadow-1)] p-4">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <span class="text-[10px] text-muted-foreground font-mono">PET 01</span>
            <h3 class="text-sm font-semibold text-foreground">第1只宠物</h3>
          </div>
        </div>

        <div class="flex flex-col gap-3">
          <div class="flex flex-col gap-1.5">
            <label class="text-[13px] font-medium text-foreground">宠物姓名 <span class="text-destructive">*</span></label>
            <input type="text" class="petlux-input" placeholder="请输入宠物姓名" value="布丁">
          </div>

          <div class="flex flex-col gap-1.5">
            <label class="text-[13px] font-medium text-foreground">宠物性别 <span class="text-destructive">*</span></label>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" class="flex items-center justify-center gap-1.5 py-2.5 rounded-md text-sm font-medium bg-primary text-primary-foreground border border-primary">
                <i data-lucide="mars" class="w-4 h-4"></i>弟弟
              </button>
              <button type="button" class="flex items-center justify-center gap-1.5 py-2.5 rounded-md text-sm font-medium bg-card text-muted-foreground border border-input">
                <i data-lucide="venus" class="w-4 h-4"></i>妹妹
              </button>
            </div>
          </div>

          <div class="flex flex-col gap-1.5">
            <label class="text-[13px] font-medium text-foreground">宠物品种 <span class="text-destructive">*</span></label>
            <input type="text" class="petlux-input" placeholder="请输入宠物品种" value="柯基">
          </div>
        </div>
      </div>

      <!-- 宠物 2 -->
      <div class="pet-section bg-card rounded-md shadow-[var(--petlux-shadow-1)] p-4">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <span class="text-[10px] text-muted-foreground font-mono">PET 02</span>
            <h3 class="text-sm font-semibold text-foreground">第2只宠物</h3>
          </div>
          <button type="button" class="flex items-center gap-1 text-[12px] text-destructive px-2 py-1 rounded-md petlux-tap">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>移除
          </button>
        </div>

        <div class="flex flex-col gap-3">
          <div class="flex flex-col gap-1.5">
            <label class="text-[13px] font-medium text-foreground">宠物姓名 <span class="text-destructive">*</span></label>
            <input type="text" class="petlux-input" placeholder="请输入宠物姓名" value="柚子">
          </div>

          <div class="flex flex-col gap-1.5">
            <label class="text-[13px] font-medium text-foreground">宠物性别 <span class="text-destructive">*</span></label>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" class="flex items-center justify-center gap-1.5 py-2.5 rounded-md text-sm font-medium bg-card text-muted-foreground border border-input">
                <i data-lucide="mars" class="w-4 h-4"></i>弟弟
              </button>
              <button type="button" class="flex items-center justify-center gap-1.5 py-2.5 rounded-md text-sm font-medium bg-primary text-primary-foreground border border-primary">
                <i data-lucide="venus" class="w-4 h-4"></i>妹妹
              </button>
            </div>
          </div>

          <div class="flex flex-col gap-1.5">
            <label class="text-[13px] font-medium text-foreground">宠物品种 <span class="text-destructive">*</span></label>
            <input type="text" class="petlux-input" placeholder="请输入宠物品种" value="英国短毛猫">
          </div>
        </div>
      </div>

      <!-- 我的宠物档案 快捷选择 -->
      <button type="button" class="petlux-card flex items-center justify-center gap-2 py-2.5 rounded-md border border-primary/40 bg-accent text-accent-foreground text-sm font-medium">
        <i data-lucide="folder-open" class="w-4 h-4"></i>
        我的宠物档案
      </button>

      <!-- 添加更多宠物 -->
      <button type="button" class="flex items-center justify-center gap-1.5 py-2.5 rounded-md border border-dashed border-input text-sm text-muted-foreground petlux-tap">
        <i data-lucide="plus" class="w-4 h-4"></i>
        添加更多宠物
      </button>

      <!-- 参加人数 -->
      <div class="bg-card rounded-md shadow-[var(--petlux-shadow-1)] p-4 flex flex-col gap-3 mt-1">
        <div class="flex flex-col gap-1.5">
          <label class="text-[13px] font-medium text-foreground">参加人数 <span class="text-destructive">*</span></label>
          <input type="number" class="petlux-input" placeholder="请输入参加人数" value="2">
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-[13px] font-medium text-foreground">联系电话 <span class="text-destructive">*</span></label>
          <input type="tel" class="petlux-input" placeholder="请输入联系电话" value="138 8888 6666">
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-[13px] font-medium text-foreground">备注信息（选填）</label>
          <textarea rows="3" class="petlux-input resize-none" placeholder="请输入备注信息">两只宠物都很友好，已绝育且疫苗齐全，请安排靠近草坪的位置。</textarea>
        </div>
      </div>

    </div>
  </section>

  <!-- 宠物档案选择弹窗（结构复刻，默认隐藏） -->
  <div class="pet-picker-mask fixed inset-0 z-40 hidden" aria-hidden="true">
    <div class="absolute inset-0 bg-black/40"></div>
    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-card rounded-t-lg shadow-[var(--petlux-shadow-3)] flex flex-col max-h-[80vh]">
