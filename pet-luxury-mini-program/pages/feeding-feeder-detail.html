<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">

    <title>喂养师详情</title>
    <style id="theme-vars">
/* ============================================================
   Pet Luxury Mini-Program — Design Token System
   Migrated from olive-green fresh-food app to healing light-luxury pet brand
   Brand prefix: petlux
   ============================================================ */

:root {
  /* ---------- Brand Primary (single hue: warm olive green) ---------- */
  --petlux-brand: #4F5E35;           /* primary olive — CTAs, active states */
  --petlux-brand-deep: #3A4626;      /* hover / pressed step */
  --petlux-brand-soft: #EAEDDF;      /* 8% brand tint for tags, soft fills */
  --petlux-brand-ink: #FAFAF6;       /* text on brand fills */

  /* ---------- Surfaces (olive-tinted — brand primary light variant) ---------- */
  --petlux-bg: #EDF0E2;              /* olive-tinted page base — brand light variant */
  --petlux-surface: #FFFFFF;         /* white card */
  --petlux-surface-2: #E2E6D3;       /* olive hover / selected */
  --petlux-surface-3: #D6DBC5;       /* deeper olive fill */

  /* ---------- Ink (text) ---------- */
  --petlux-ink: #2A2823;             /* primary text — warm near-black */
  --petlux-ink-2: #635E54;           /* secondary text */
  --petlux-ink-3: #9A9489;           /* tertiary / placeholder */

  /* ---------- Lines & Dividers ---------- */
  --petlux-line: #D8DCCE;            /* hairline divider — olive tint */
  --petlux-line-strong: #C9CFBA;     /* emphasized border */

  /* ---------- State Colors (semantic only, never brand) ---------- */
  --petlux-state-success: #5B7C4A;
  --petlux-state-warning: #B8893A;
  --petlux-state-error: #A85B4A;
  --petlux-state-info: #6B7D8C;

  /* ---------- Radius Scale (2 / 8 / 12 / 16) ---------- */
  --petlux-radius-xs: 4px;
  --petlux-radius-sm: 8px;
  --petlux-radius-md: 12px;
  --petlux-radius-lg: 16px;
  --petlux-radius-pill: 999px;

  /* ---------- Shadow (subtle, alpha <= 0.05 for static) ---------- */
  --petlux-shadow-1: 0 1px 3px rgba(42,40,35,0.04), 0 1px 2px rgba(42,40,35,0.03);
  --petlux-shadow-2: 0 8px 24px -8px rgba(42,40,35,0.12);
  --petlux-shadow-3: 0 16px 48px -16px rgba(42,40,35,0.20);

  /* ---------- Spacing (8pt grid) ---------- */
  --petlux-s-1: 4px;
  --petlux-s-2: 8px;
  --petlux-s-3: 12px;
  --petlux-s-4: 16px;
  --petlux-s-5: 24px;
  --petlux-s-6: 32px;
  --petlux-s-7: 48px;

  /* ---------- Typography ---------- */
  --petlux-font-sans: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --petlux-font-latin: "Inter", system-ui, sans-serif;
  --petlux-font-mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;

  --petlux-text-display: 32px;
  --petlux-text-h1: 24px;
  --petlux-text-h2: 20px;
  --petlux-text-h3: 17px;
  --petlux-text-body: 15px;
  --petlux-text-body-sm: 13px;
  --petlux-text-caption: 12px;

  --petlux-leading-tight: 1.2;
  --petlux-leading-normal: 1.55;
  --petlux-leading-relaxed: 1.7;

  --petlux-weight-regular: 400;
  --petlux-weight-medium: 500;
  --petlux-weight-semibold: 600;

  --petlux-tracking-tight: -0.02em;
  --petlux-tracking-normal: 0;
  --petlux-tracking-wide: 0.01em;

  /* ============================================================
     Semantic Aliases — required by apply-html-head-contract.mjs
     ============================================================ */

  --petlux-background: var(--petlux-bg);
  --petlux-foreground: var(--petlux-ink);

  --petlux-card: var(--petlux-surface);
  --petlux-card-foreground: var(--petlux-ink);

  --petlux-popover: var(--petlux-surface);
  --petlux-popover-foreground: var(--petlux-ink);

  --petlux-primary: var(--petlux-brand);
  --petlux-primary-foreground: var(--petlux-brand-ink);

  --petlux-secondary: var(--petlux-surface-2);
  --petlux-secondary-foreground: var(--petlux-ink-2);

  --petlux-muted: var(--petlux-surface-2);
  --petlux-muted-foreground: var(--petlux-ink-2);

  --petlux-accent: var(--petlux-brand-soft);
  --petlux-accent-foreground: var(--petlux-brand);

  --petlux-destructive: var(--petlux-state-error);
  --petlux-destructive-foreground: #FAFAF6;

  --petlux-border: var(--petlux-line);
  --petlux-input: var(--petlux-line-strong);
  --petlux-ring: var(--petlux-brand);

  --petlux-radius-small: var(--petlux-radius-sm);
  --petlux-radius-medium: var(--petlux-radius-md);
  --petlux-radius-large: var(--petlux-radius-lg);
}

/* ---------- Dark mode stub (project is light-only; reserved) ---------- */
.dark {
  --petlux-background: #161612;
  --petlux-foreground: #EDE9E0;
  --petlux-card: #1F1E1A;
  --petlux-card-foreground: #EDE9E0;
  --petlux-popover: #1F1E1A;
  --petlux-popover-foreground: #EDE9E0;
  --petlux-primary: #7A8C5A;
  --petlux-primary-foreground: #161612;
  --petlux-muted: #2A2924;
  --petlux-muted-foreground: #9A9489;
  --petlux-border: #34322C;
  --petlux-input: #34322C;
  --petlux-ring: #7A8C5A;
}

    </style>

<body class="min-h-screen font-sans antialiased">
<style id="critical-layout">
html, body { max-width: 100%; overflow-x: hidden; }
body { margin: 0; background-color: var(--petlux-background); -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
main > .petlux-shell { width: 100%; max-width: 28rem; margin-left: auto; margin-right: auto; }
header[data-topbar] { min-height: 56px; }
nav[data-mobile-nav="global"] { position: sticky; bottom: 0; z-index: 30; min-height: 64px; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }
</style>
<main>
  <div class="fixed top-0 right-3 z-50 flex items-center w-[88px] h-8 rounded-full border border-black/10 shrink-0" style="top: calc(env(safe-area-inset-top, 0px) + 12px);">
      <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="更多">
        <i data-lucide="more-horizontal" class="w-4 h-4 text-foreground"></i>
      </button>
      <span class="w-px h-3 bg-black/10 block"></span>
      <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
        <i data-lucide="x" class="w-4 h-4 text-foreground"></i>
      </button>
    </div>

<div class="page-container petlux-shell max-w-md mx-auto bg-background min-h-screen relative">

  <!-- 顶部图片区 -->
  <div class="hero-section relative w-full h-[300px] overflow-hidden" style="background: linear-gradient(155deg, #3A4626 0%, #4F5E35 42%, #6B7D4A 78%, #8A9B6A 100%);">
    <!-- 装饰光晕 -->
    <div class="absolute -top-16 -right-12 w-56 h-56 rounded-full" style="background: radial-gradient(circle, rgba(250,250,246,0.18) 0%, rgba(250,250,246,0) 70%);"></div>
    <div class="absolute bottom-10 -left-10 w-44 h-44 rounded-full" style="background: radial-gradient(circle, rgba(250,250,246,0.10) 0%, rgba(250,250,246,0) 70%);"></div>
    <!-- 喂养师图片（加载失败时露出底层橄榄绿渐变） -->
    <img class="hero-image absolute inset-0 w-full h-full object-cover" src="../assets/host-avatar.jpg" alt="喂养师王晓雯" onerror="this.style.display='none'" />
    <!-- 底部渐变遮罩：过渡到页面背景色 -->
    <div class="hero-gradient absolute inset-x-0 bottom-0 h-32" style="background: linear-gradient(to top, var(--petlux-bg) 0%, rgba(237,240,226,0.6) 45%, transparent 100%);"></div>

    <!-- 顶部导航叠加层 -->
    <div class="absolute top-0 left-0 right-0 h-14 flex items-center justify-between px-3 z-10">
      <button type="button" class="w-9 h-9 rounded-full flex items-center justify-center petlux-tap" style="background: rgba(42,40,35,0.28); backdrop-filter: blur(8px);" aria-label="返回">
        <i data-lucide="chevron-left" class="w-5 h-5 text-white"></i>
      </button>
      <span class="text-base font-medium text-white tracking-wide drop-shadow-sm">喂养师详情</span>
      <button type="button" class="w-9 h-9 rounded-full flex items-center justify-center petlux-tap" style="background: rgba(42,40,35,0.28); backdrop-filter: blur(8px);" aria-label="分享">
        <i data-lucide="share-2" class="w-4 h-4 text-white"></i>
      </button>
    </div>
  </div>

  <!-- 内容区 -->
  <div class="content-section relative -mt-5 px-4 z-10">

    <!-- 基本信息 -->
    <div class="info-card bg-card rounded-t-2xl rounded-b-lg p-5 shadow-[var(--petlux-shadow-2)]">
      <div class="info-header flex items-start justify-between gap-3">
        <div class="name-section min-w-0 flex-1">
          <text class="feeder-name text-xl font-semibold text-ink tracking-tight" style="color: var(--petlux-ink);">王晓雯</text>
          <div class="meta-row flex items-center gap-2 mt-1.5">
            <span class="meta-item inline-flex items-center gap-1 text-sm" style="color: var(--petlux-ink-2);">
              <i data-lucide="user" class="w-3.5 h-3.5"></i>女
            </span>
            <span class="w-1 h-1 rounded-full" style="background: var(--petlux-ink-3);"></span>
            <span class="meta-item inline-flex items-center gap-1 text-sm" style="color: var(--petlux-ink-2);">
              <i data-lucide="award" class="w-3.5 h-3.5"></i>3年经验
            </span>
          </div>
        </div>
        <div class="price-section flex items-baseline gap-0.5 shrink-0">
          <text class="price-number font-mono-num text-2xl font-semibold text-primary leading-none">¥80</text>
          <text class="price-unit-large text-sm" style="color: var(--petlux-ink-3);">/次</text>
        </div>
      </div>

      <div class="address-section mt-4 pt-4" style="border-top: 1px solid var(--petlux-line);">
        <div class="section-label">服务区域</div>
        <div class="flex items-center gap-1.5 mt-1.5">
          <i data-lucide="map-pin" class="w-3.5 h-3.5 shrink-0" style="color: var(--petlux-brand);"></i>
          <text class="address-text text-sm" style="color: var(--petlux-ink);">上海市徐汇区·徐家汇至田林商圈</text>
        </div>
      </div>
    </div>

    <!-- 服务标签 -->
    <div class="info-card bg-card rounded-lg p-5 mt-3 shadow-[var(--petlux-shadow-1)]">
      <div class="section-label">服务项目</div>
      <div class="tag-list flex flex-wrap gap-2 mt-3">
        <text class="tag-item rounded-full bg-accent text-accent-foreground text-xs font-medium px-3 py-1.5">宠物喂养</text>
        <text class="tag-item rounded-full bg-accent text-accent-foreground text-xs font-medium px-3 py-1.5">上门遛狗</text>
        <text class="tag-item rounded-full bg-accent text-accent-foreground text-xs font-medium px-3 py-1.5">清洁砂盆</text>
        <text class="tag-item rounded-full bg-accent text-accent-foreground text-xs font-medium px-3 py-1.5">喂药护理</text>
        <text class="tag-item rounded-full bg-accent text-accent-foreground text-xs font-medium px-3 py-1.5">多宠服务</text>
      </div>
    </div>

    <!-- 服务介绍 -->
    <div class="info-card bg-card rounded-lg p-5 mt-3 shadow-[var(--petlux-shadow-1)]">
      <div class="section-label">服务介绍</div>
      <text class="desc-text block mt-2.5 text-sm leading-relaxed" style="color: var(--petlux-ink-2);">拥有3年专业宠物上门服务经验，已累计服务超过500+宠主家庭。熟悉猫咪和狗狗的喂养习惯与性格特点，持有宠物护理资格证。服务过程中全程录像，注重消毒防护，让每一位毛孩子都能得到温柔专业的照料。</text>
    </div>

    <!-- 联系电话 -->
    <div class="info-card bg-card rounded-lg p-5 mt-3 shadow-[var(--petlux-shadow-1)]">
      <div class="section-label">联系电话</div>
      <div class="phone-row flex items-center justify-between mt-2.5">
        <div class="flex items-center gap-2.5 min-w-0">
          <span class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background: var(--petlux-brand-soft);">
            <i data-lucide="phone" class="w-4 h-4" style="color: var(--petlux-brand);"></i>
          </span>
          <text class="phone-text font-mono-num text-base" style="color: var(--petlux-ink);">138****6688</text>
        </div>
        <button class="phone-btn inline-flex items-center gap-1 rounded-full bg-primary text-primary-foreground text-sm font-medium px-4 py-2 petlux-tap" open-type="makePhoneCall">
          <i data-lucide="phone-call" class="w-3.5 h-3.5"></i>
          拨打
        </button>
      </div>
    </div>

    <div class="bottom-placeholder h-24"></div>
  </div>

  <!-- 底部按钮 -->
  <div class="footer-bar fixed bottom-0 left-0 right-0 mx-auto max-w-md z-30 bg-card/95 backdrop-blur-sm" style="border-top: 1px solid var(--petlux-line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom));">
    <button class="btn-book w-full h-12 rounded-full bg-primary text-primary-foreground text-base font-semibold flex items-center justify-center gap-2 petlux-tap shadow-[var(--petlux-shadow-2)]">
      <i data-lucide="calendar-check" class="w-5 h-5"></i>
      立即预约
    </button>
  </div>

</div>
</main>
<script>lucide.createIcons();</script>
</body>
</html>
