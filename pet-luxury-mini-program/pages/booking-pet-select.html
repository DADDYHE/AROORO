/* ============================================================
   Pet Luxury Mini-Program — Design Token System
   Migrated from olive-green fresh-food app to healing light-luxury pet brand
   Brand prefix: petlux
   ============================================================ */

:root {
  /* ---------- Brand Primary (single hue: warm olive green) ---------- */
  --petlux-brand: #4F5E35;           /* primary olive — CTAs, active states */
  --petlux-brand-deep: #3A4626;      /* hover / pressed step */
  --petlux-brand-soft: #EAEDDF;      /* 8% brand tint for tags, soft fills */
  --petlux-brand-ink: #FAFAF6;       /* text on brand fills */

  /* ---------- Surfaces (olive-tinted — brand primary light variant) ---------- */
  --petlux-bg: #EDF0E2;              /* olive-tinted page base — brand light variant */
  --petlux-surface: #FFFFFF;         /* white card */
  --petlux-surface-2: #E2E6D3;       /* olive hover / selected */
  --petlux-surface-3: #D6DBC5;       /* deeper olive fill */

  /* ---------- Ink (text) ---------- */
  --petlux-ink: #2A2823;             /* primary text — warm near-black */
  --petlux-ink-2: #635E54;           /* secondary text */
  --petlux-ink-3: #9A9489;           /* tertiary / placeholder */

  /* ---------- Lines & Dividers ---------- */
  --petlux-line: #D8DCCE;            /* hairline divider — olive tint */
  --petlux-line-strong: #C9CFBA;     /* emphasized border */

  /* ---------- State Colors (semantic only, never brand) ---------- */
  --petlux-state-success: #5B7C4A;
  --petlux-state-warning: #B8893A;
  --petlux-state-error: #A85B4A;
  --petlux-state-info: #6B7D8C;

  /* ---------- Radius Scale (2 / 8 / 12 / 16) ---------- */
  --petlux-radius-xs: 4px;
  --petlux-radius-sm: 8px;
  --petlux-radius-md: 12px;
  --petlux-radius-lg: 16px;
  --petlux-radius-pill: 999px;

  /* ---------- Shadow (subtle, alpha <= 0.05 for static) ---------- */
  --petlux-shadow-1: 0 1px 3px rgba(42,40,35,0.04), 0 1px 2px rgba(42,40,35,0.03);
  --petlux-shadow-2: 0 8px 24px -8px rgba(42,40,35,0.12);
  --petlux-shadow-3: 0 16px 48px -16px rgba(42,40,35,0.20);

  /* ---------- Spacing (8pt grid) ---------- */
  --petlux-s-1: 4px;
  --petlux-s-2: 8px;
  --petlux-s-3: 12px;
  --petlux-s-4: 16px;
  --petlux-s-5: 24px;
  --petlux-s-6: 32px;
  --petlux-s-7: 48px;

  /* ---------- Typography ---------- */
  --petlux-font-sans: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --petlux-font-latin: "Inter", system-ui, sans-serif;
  --petlux-font-mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;

  --petlux-text-display: 32px;
  --petlux-text-h1: 24px;
  --petlux-text-h2: 20px;
  --petlux-text-h3: 17px;
  --petlux-text-body: 15px;
  --petlux-text-body-sm: 13px;
  --petlux-text-caption: 12px;

  --petlux-leading-tight: 1.2;
  --petlux-leading-normal: 1.55;
  --petlux-leading-relaxed: 1.7;

  --petlux-weight-regular: 400;
  --petlux-weight-medium: 500;
  --petlux-weight-semibold: 600;

  --petlux-tracking-tight: -0.02em;
  --petlux-tracking-normal: 0;
  --petlux-tracking-wide: 0.01em;

  /* ============================================================
     Semantic Aliases — required by apply-html-head-contract.mjs
     ============================================================ */

  --petlux-background: var(--petlux-bg);
  --petlux-foreground: var(--petlux-ink);

  --petlux-card: var(--petlux-surface);
  --petlux-card-foreground: var(--petlux-ink);

  --petlux-popover: var(--petlux-surface);
  --petlux-popover-foreground: var(--petlux-ink);

  --petlux-primary: var(--petlux-brand);
  --petlux-primary-foreground: var(--petlux-brand-ink);

  --petlux-secondary: var(--petlux-surface-2);
  --petlux-secondary-foreground: var(--petlux-ink-2);

  --petlux-muted: var(--petlux-surface-2);
  --petlux-muted-foreground: var(--petlux-ink-2);

  --petlux-accent: var(--petlux-brand-soft);
  --petlux-accent-foreground: var(--petlux-brand);

  --petlux-destructive: var(--petlux-state-error);
  --petlux-destructive-foreground: #FAFAF6;

  --petlux-border: var(--petlux-line);
  --petlux-input: var(--petlux-line-strong);
  --petlux-ring: var(--petlux-brand);

  --petlux-radius-small: var(--petlux-radius-sm);
  --petlux-radius-medium: var(--petlux-radius-md);
  --petlux-radius-large: var(--petlux-radius-lg);
}

/* ---------- Dark mode stub (project is light-only; reserved) ---------- */
.dark {
  --petlux-background: #161612;
  --petlux-foreground: #EDE9E0;
  --petlux-card: #1F1E1A;
  --petlux-card-foreground: #EDE9E0;
  --petlux-popover: #1F1E1A;
  --petlux-popover-foreground: #EDE9E0;
  --petlux-primary: #7A8C5A;
  --petlux-primary-foreground: #161612;
  --petlux-muted: #2A2924;
  --petlux-muted-foreground: #9A9489;
  --petlux-border: #34322C;
  --petlux-input: #34322C;
  --petlux-ring: #7A8C5A;
}

<body class="min-h-screen font-sans antialiased">
<style id="critical-layout">
html, body { max-width: 100%; overflow-x: hidden; }
body { margin: 0; background-color: var(--petlux-background); }
img { display: block; max-width: 100%; }
main > .petlux-shell { width: 100%; max-width: 28rem; margin-left: auto; margin-right: auto; }
header[data-topbar] { min-height: 56px; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }
</style>
<style id="petlux-utilities">
  .petlux-card { box-shadow: var(--petlux-shadow-1); transition: transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s ease; }
  .petlux-card:hover { transform: translateY(-2px); box-shadow: var(--petlux-shadow-2); }
  .petlux-tap { transition: background-color .2s ease, opacity .2s ease; }
  .petlux-tap:hover { background-color: var(--petlux-muted); }
  .petlux-tap:active { opacity: .65; }
  .gallery-card { transition: background-color .25s ease, box-shadow .25s ease; }
  .gallery-card.card-selected { background-color: var(--petlux-brand-soft); box-shadow: var(--petlux-shadow-2); }
  .portrait-selected-ring { box-shadow: 0 0 0 2px var(--petlux-brand); }
  .indicator-active { background-color: var(--petlux-brand); border-color: var(--petlux-brand); }
  .indicator-checkmark::before {
    content: ""; display: block; width: 10px; height: 6px;
    border-left: 2px solid var(--petlux-brand-ink); border-bottom: 2px solid var(--petlux-brand-ink);
    transform: rotate(-45deg) translate(1px,-1px);
  }
  .indicator-idle { background-color: transparent; border-color: var(--petlux-line-strong); }
  .badge-dot { background-color: var(--petlux-brand); }
  .dot-active { background-color: var(--petlux-brand); }
  .dot-idle { background-color: var(--petlux-ink-3); }
  .service-check.check-on { background-color: var(--petlux-brand); border-color: var(--petlux-brand); }
  .check-icon::before {
    content: ""; display: block; width: 10px; height: 6px;
    border-left: 2px solid var(--petlux-brand-ink); border-bottom: 2px solid var(--petlux-brand-ink);
    transform: rotate(-45deg) translate(1px,-1px);
  }
  .calendar-day.is-selected { background-color: var(--petlux-brand); color: var(--petlux-brand-ink); }
  .calendar-day.is-range { background-color: var(--petlux-brand-soft); color: var(--petlux-brand); }
  .calendar-day.is-disabled { color: var(--petlux-ink-3); opacity: .5; }
  .frame-corner { position: absolute; width: 14px; height: 14px; border-color: var(--petlux-brand); }
  .frame-tl { top: 0; left: 0; border-top: 1.5px solid; border-left: 1.5px solid; }
  .frame-tr { top: 0; right: 0; border-top: 1.5px solid; border-right: 1.5px solid; }
  .frame-bl { bottom: 0; left: 0; border-bottom: 1.5px solid; border-left: 1.5px solid; }
  .frame-br { bottom: 0; right: 0; border-bottom: 1.5px solid; border-right: 1.5px solid; }
  @media (prefers-reduced-motion: reduce) {
    .petlux-card, .petlux-tap, .gallery-card { transition: none; }
    .petlux-card:hover { transform: none; }
  }
</style>

            <span class="select-indicator indicator-idle w-6 h-6 rounded-full border block"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- 创建新档案 add -->
    <div class="gallery-add flex items-center gap-2 mt-4 px-1">
      <span class="add-line w-6 h-px bg-muted-foreground/40 block"></span>
      <span class="add-label text-[12px] text-muted-foreground tracking-wide">创建新的宠物档案</span>
      <i data-lucide="plus" class="w-3.5 h-3.5 text-muted-foreground"></i>
    </div>
  </section>

  <!-- 空状态 empty-exhibition（结构保留，隐藏） -->
  <section class="empty-exhibition px-5 mb-8" style="display:none;">
    <div class="empty-frame relative bg-card rounded-md shadow-[var(--petlux-shadow-1)] p-10 m-2">
      <span class="frame-corner frame-tl"></span>
      <span class="frame-corner frame-tr"></span>
      <span class="frame-corner frame-bl"></span>
      <span class="frame-corner frame-br"></span>
      <div class="empty-frame-inner flex flex-col items-center gap-2">
        <span class="empty-title text-base font-medium text-foreground tracking-wide">即将布展</span>
        <span class="empty-subtitle text-[12px] text-muted-foreground">添加您的第一只宠物</span>
      </div>
    </div>
    <div class="gallery-add flex items-center gap-2 mt-4 px-1">
      <span class="add-line w-6 h-px bg-muted-foreground/40 block"></span>
      <span class="add-label text-[12px] text-muted-foreground tracking-wide">创建新的宠物档案</span>
      <i data-lucide="plus" class="w-3.5 h-3.5 text-muted-foreground"></i>
    </div>
  </section>

  <!-- 画廊底部 gallery-footer -->
  <footer class="gallery-footer fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-card border-t border-border z-30">
    <div class="footer-status flex items-center gap-2 px-5 py-2.5">
      <span class="status-dot dot-active w-2 h-2 rounded-full block"></span>
      <span class="status-text text-[12px] text-muted-foreground">已选 <span class="text-foreground font-semibold font-mono">1</span> 只宠物</span>
    </div>
    <div class="footer-bottom flex items-center gap-2 px-5 pb-4">
      <button type="button" class="bar-action-item contact-btn flex flex-col items-center justify-center gap-0.5 w-12 h-12 rounded-md bg-accent text-accent-foreground">
        <i data-lucide="headphones" class="w-4 h-4"></i>
        <span class="bar-action-text text-[10px]">客服</span>
      </button>
      <button type="button" class="footer-action action-active flex-1 h-12 rounded-md bg-primary text-primary-foreground text-sm font-medium tracking-wide">
        确定选择
      </button>
    </div>
  </footer>

  <!-- 底部弹层 bottom-popup（隐藏覆盖层） -->
  <div class="popup-overlay fixed inset-0 z-[2000] bg-black/40" style="display:none;">
    <div class="bottom-popup absolute bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white rounded-t-2xl">
      <!-- 手柄 handle-bar -->
      <div class="popup-handle-bar w-10 h-1 rounded-full bg-border mx-auto mt-3"></div>

      <!-- 弹层头部 header -->
      <div class="popup-header px-5 pt-4 pb-3">
        <div class="popup-header-accent w-8 h-px bg-primary mb-2"></div>
        <div class="popup-header-content flex items-center justify-between">
          <span class="popup-title text-base font-semibold text-foreground">选择服务</span>
          <button type="button" class="popup-cancel-btn px-2 py-1">
            <span class="popup-cancel-text text-[12px] text-muted-foreground">取消</span>
          </button>
        </div>
      </div>

      <!-- 服务列表 services -->
      <div class="popup-services px-5 pb-3 flex flex-col gap-2">
        <!-- 宠物喂养（已选） -->
        <div class="service-row service-row-checked flex items-center gap-3 p-3 rounded-md bg-accent">
          <span class="service-check check-on flex items-center justify-center w-5 h-5 rounded border">
            <span class="check-icon"></span>
          </span>
          <div class="service-info flex-1 flex flex-col gap-0.5">
            <span class="service-name text-sm font-medium text-foreground">宠物喂养</span>
            <span class="service-desc text-[11px] text-muted-foreground">基础服务</span>
          </div>
        </div>

        <!-- 上门遛狗（步进器） -->
        <div class="service-row flex items-center gap-3 p-3 rounded-md border border-border">
          <span class="service-check check-off w-5 h-5 rounded border border-line-strong block"></span>
          <div class="service-info flex-1 flex flex-col gap-0.5">
            <span class="service-name text-sm font-medium text-foreground">上门遛狗</span>
          </div>
          <div class="service-stepper flex items-center gap-2">
            <button type="button" class="stepper-btn stepper-disabled flex items-center justify-center w-7 h-7 rounded-full border border-border text-muted-foreground text-base leading-none">−</button>
            <span class="stepper-value text-[12px] text-foreground font-medium w-12 text-center">0分钟</span>
            <button type="button" class="stepper-btn flex items-center justify-center w-7 h-7 rounded-full bg-primary text-primary-foreground text-base leading-none">+</button>
          </div>
        </div>
      </div>

      <!-- 服务日期 section -->
      <div class="popup-section px-5 py-2">
        <div class="popup-section-label flex items-center gap-2">
          <span class="section-label-line w-3 h-px bg-muted-foreground/50 block"></span>
          <span class="section-label-text text-[12px] text-muted-foreground tracking-[0.15em]">服务日期</span>
          <span class="section-label-hint text-[11px] text-primary font-medium">已选3天</span>
          <span class="flex-1 h-px bg-border block"></span>
        </div>
      </div>

      <!-- 日历区域 calendar-area -->
      <div class="popup-calendar-area px-5 pb-4">
        <div class="bg-accent/40 rounded-md p-3">
          <!-- 月份头 -->
          <div class="flex items-center justify-between mb-2">
            <button type="button" class="w-6 h-6 flex items-center justify-center text-muted-foreground"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
            <span class="text-[12px] font-medium text-foreground">2026年7月</span>
            <button type="button" class="w-6 h-6 flex items-center justify-center text-muted-foreground"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
          </div>
          <!-- 星期头 -->
          <div class="grid grid-cols-7 gap-0.5 mb-1">
            <span class="text-[10px] text-muted-foreground text-center py-1">日</span>
            <span class="text-[10px] text-muted-foreground text-center py-1">一</span>
            <span class="text-[10px] text-muted-foreground text-center py-1">二</span>
            <span class="text-[10px] text-muted-foreground text-center py-1">三</span>
            <span class="text-[10px] text-muted-foreground text-center py-1">四</span>
            <span class="text-[10px] text-muted-foreground text-center py-1">五</span>
            <span class="text-[10px] text-muted-foreground text-center py-1">六</span>
          </div>
          <!-- 日期网格 -->
          <div class="grid grid-cols-7 gap-0.5">
            <span class="calendar-day is-disabled text-[11px] text-center py-1.5 rounded">28</span>
            <span class="calendar-day is-disabled text-[11px] text-center py-1.5 rounded">29</span>
            <span class="calendar-day is-disabled text-[11px] text-center py-1.5 rounded">30</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">1</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">2</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">3</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">4</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">5</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">6</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">7</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">8</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">9</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">10</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">11</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">12</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">13</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">14</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">15</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">16</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">17</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">18</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">19</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">20</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">21</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">22</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">23</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">24</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">25</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">26</span>
            <span class="calendar-day is-selected text-[11px] text-center py-1.5 rounded font-semibold">27</span>
            <span class="calendar-day is-selected text-[11px] text-center py-1.5 rounded font-semibold">28</span>
            <span class="calendar-day is-selected text-[11px] text-center py-1.5 rounded font-semibold">29</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">30</span>
            <span class="calendar-day text-[11px] text-foreground text-center py-1.5 rounded">31</span>
          </div>
        </div>
      </div>

      <!-- 确认按钮 confirm-area -->
      <div class="popup-confirm-area px-5 pb-6 pt-1">
        <button type="button" class="popup-confirm-btn btn-enabled w-full h-12 rounded-md bg-primary text-primary-foreground text-sm font-medium tracking-wide">
          <span class="confirm-btn-text">确定选择</span>
        </button>
      </div>
    </div>
  </div>

</div>
</main>
<script>lucide.createIcons();</script>
</body>
</html>
