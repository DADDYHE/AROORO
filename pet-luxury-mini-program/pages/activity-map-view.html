<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>

    <title>活动地图</title>
    <style id="theme-vars">
/* ============================================================
   Pet Luxury Mini-Program — Design Token System
   Migrated from olive-green fresh-food app to healing light-luxury pet brand
   Brand prefix: petlux
   ============================================================ */

:root {
  /* ---------- Brand Primary (single hue: warm olive green) ---------- */
  --petlux-brand: #4F5E35;           /* primary olive — CTAs, active states */
  --petlux-brand-deep: #3A4626;      /* hover / pressed step */
  --petlux-brand-soft: #EAEDDF;      /* 8% brand tint for tags, soft fills */
  --petlux-brand-ink: #FAFAF6;       /* text on brand fills */

  /* ---------- Surfaces (olive-tinted — brand primary light variant) ---------- */
  --petlux-bg: #EDF0E2;              /* olive-tinted page base — brand light variant */
  --petlux-surface: #FFFFFF;         /* white card */
  --petlux-surface-2: #E2E6D3;       /* olive hover / selected */
  --petlux-surface-3: #D6DBC5;       /* deeper olive fill */

  /* ---------- Ink (text) ---------- */
  --petlux-ink: #2A2823;             /* primary text — warm near-black */
  --petlux-ink-2: #635E54;           /* secondary text */
  --petlux-ink-3: #9A9489;           /* tertiary / placeholder */

  /* ---------- Lines & Dividers ---------- */
  --petlux-line: #D8DCCE;            /* hairline divider — olive tint */
  --petlux-line-strong: #C9CFBA;     /* emphasized border */

  /* ---------- State Colors (semantic only, never brand) ---------- */
  --petlux-state-success: #5B7C4A;
  --petlux-state-warning: #B8893A;
  --petlux-state-error: #A85B4A;
  --petlux-state-info: #6B7D8C;

  /* ---------- Radius Scale (2 / 8 / 12 / 16) ---------- */
  --petlux-radius-xs: 4px;
  --petlux-radius-sm: 8px;
  --petlux-radius-md: 12px;
  --petlux-radius-lg: 16px;
  --petlux-radius-pill: 999px;

  /* ---------- Shadow (subtle, alpha <= 0.05 for static) ---------- */
  --petlux-shadow-1: 0 1px 3px rgba(42,40,35,0.04), 0 1px 2px rgba(42,40,35,0.03);
  --petlux-shadow-2: 0 8px 24px -8px rgba(42,40,35,0.12);
  --petlux-shadow-3: 0 16px 48px -16px rgba(42,40,35,0.20);

  /* ---------- Spacing (8pt grid) ---------- */
  --petlux-s-1: 4px;
  --petlux-s-2: 8px;
  --petlux-s-3: 12px;
  --petlux-s-4: 16px;
  --petlux-s-5: 24px;
  --petlux-s-6: 32px;
  --petlux-s-7: 48px;

  /* ---------- Typography ---------- */
  --petlux-font-sans: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --petlux-font-latin: "Inter", system-ui, sans-serif;
  --petlux-font-mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;

  --petlux-text-display: 32px;
  --petlux-text-h1: 24px;
  --petlux-text-h2: 20px;
  --petlux-text-h3: 17px;
  --petlux-text-body: 15px;
  --petlux-text-body-sm: 13px;
  --petlux-text-caption: 12px;

  --petlux-leading-tight: 1.2;
  --petlux-leading-normal: 1.55;
  --petlux-leading-relaxed: 1.7;

  --petlux-weight-regular: 400;
  --petlux-weight-medium: 500;
  --petlux-weight-semibold: 600;

  --petlux-tracking-tight: -0.02em;
  --petlux-tracking-normal: 0;
  --petlux-tracking-wide: 0.01em;

  /* ============================================================
     Semantic Aliases — required by apply-html-head-contract.mjs
     ============================================================ */

  --petlux-background: var(--petlux-bg);
  --petlux-foreground: var(--petlux-ink);

  --petlux-card: var(--petlux-surface);
  --petlux-card-foreground: var(--petlux-ink);

  --petlux-popover: var(--petlux-surface);
  --petlux-popover-foreground: var(--petlux-ink);

  --petlux-primary: var(--petlux-brand);
  --petlux-primary-foreground: var(--petlux-brand-ink);

  --petlux-secondary: var(--petlux-surface-2);
  --petlux-secondary-foreground: var(--petlux-ink-2);

  --petlux-muted: var(--petlux-surface-2);
  --petlux-muted-foreground: var(--petlux-ink-2);

  --petlux-accent: var(--petlux-brand-soft);
  --petlux-accent-foreground: var(--petlux-brand);

  --petlux-destructive: var(--petlux-state-error);
  --petlux-destructive-foreground: #FAFAF6;

  --petlux-border: var(--petlux-line);
  --petlux-input: var(--petlux-line-strong);
  --petlux-ring: var(--petlux-brand);

  --petlux-radius-small: var(--petlux-radius-sm);
  --petlux-radius-medium: var(--petlux-radius-md);
  --petlux-radius-large: var(--petlux-radius-lg);
}

/* ---------- Dark mode stub (project is light-only; reserved) ---------- */
.dark {
  --petlux-background: #161612;
  --petlux-foreground: #EDE9E0;
  --petlux-card: #1F1E1A;
  --petlux-card-foreground: #EDE9E0;
  --petlux-popover: #1F1E1A;
  --petlux-popover-foreground: #EDE9E0;
  --petlux-primary: #7A8C5A;
  --petlux-primary-foreground: #161612;
  --petlux-muted: #2A2924;
  --petlux-muted-foreground: #9A9489;
  --petlux-border: #34322C;
  --petlux-input: #34322C;
  --petlux-ring: #7A8C5A;
}

    </style>

<body class="min-h-screen font-sans antialiased">
<style id="critical-layout">
html, body { max-width: 100%; overflow-x: hidden; }
body { margin: 0; background-color: var(--petlux-background); }
img { display: block; max-width: 100%; }
main > .petlux-shell { width: 100%; max-width: 28rem; margin-left: auto; margin-right: auto; }
header[data-topbar] { min-height: 56px; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }
</style>
<main>
  <div class="fixed top-0 right-3 z-50 flex items-center w-[88px] h-8 rounded-full border border-black/10 shrink-0" style="top: calc(env(safe-area-inset-top, 0px) + 12px);">
      <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="更多">
        <i data-lucide="more-horizontal" class="w-4 h-4 text-foreground"></i>
      </button>
      <span class="w-px h-3 bg-black/10 block"></span>
      <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
        <i data-lucide="x" class="w-4 h-4 text-foreground"></i>
      </button>
    </div>

<div class="petlux-shell max-w-md mx-auto bg-background min-h-screen relative">

  <!-- 顶部栏 -->
  <header data-topbar class="sticky top-0 z-20 h-14 px-4 flex items-center justify-between bg-background/95 backdrop-blur-sm border-b border-border">
<div class="flex items-center gap-1.5 min-w-0 gap-2">
      <button type="button" aria-label="返回" class="flex items-center justify-center w-8 h-8 -ml-1 text-foreground"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
      <h1 class="text-base font-semibold text-foreground">活动地图</h1>
      </div>
  </header>

  <!-- 地图区域（占满大部分屏幕高度的占位图） -->
  <section class="relative w-full" style="height: calc(100vh - 56px);">
    <div class="map-placeholder absolute inset-0 w-full h-full">
      <!-- 模拟地图背景：橄榄色调渐变 + 网格街道纹理 -->
      <div class="absolute inset-0 w-full h-full" style="background:
          radial-gradient(circle at 30% 25%, #DDE3CC 0%, rgba(221,227,204,0) 45%),
          radial-gradient(circle at 75% 70%, #D2D8C0 0%, rgba(210,216,192,0) 50%),
          linear-gradient(135deg, #E4E9D6 0%, #D8DEC6 55%, #CDD4B8 100%);">
      </div>
      <!-- 模拟街道线条 -->
      <svg class="absolute inset-0 w-full h-full" viewBox="0 0 375 660" preserveAspectRatio="none" aria-hidden="true">
        <path d="M-10 120 C 80 140, 180 90, 260 160 S 420 220, 400 320" stroke="#FFFFFF" stroke-width="6" fill="none" opacity="0.55" stroke-linecap="round"/>
        <path d="M-10 120 C 80 140, 180 90, 260 160 S 420 220, 400 320" stroke="#F2C9A0" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
        <path d="M60 -10 C 90 120, 140 260, 110 420 S 80 620, 120 700" stroke="#FFFFFF" stroke-width="5" fill="none" opacity="0.5" stroke-linecap="round"/>
        <path d="M300 -10 C 280 100, 320 240, 280 380 S 240 560, 300 700" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.45" stroke-linecap="round"/>
        <path d="M-10 480 C 100 470, 220 510, 360 470" stroke="#FFFFFF" stroke-width="5" fill="none" opacity="0.5" stroke-linecap="round"/>
        <path d="M180 -10 C 200 150, 160 300, 210 460 S 260 620, 240 700" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>
        <!-- 绿地块 -->
        <rect x="220" y="180" width="90" height="70" rx="10" fill="#C7D2A8" opacity="0.5"/>
        <rect x="40" y="320" width="70" height="60" rx="10" fill="#C7D2A8" opacity="0.45"/>
        <rect x="260" y="420" width="80" height="55" rx="10" fill="#C7D2A8" opacity="0.4"/>
      </svg>

      <!-- 地图标记点（marker） -->
      <div class="absolute" style="top: 38%; left: 50%; transform: translate(-50%, -100%);">
        <div class="flex flex-col items-center">
          <div class="w-9 h-9 rounded-full bg-primary flex items-center justify-center shadow-[var(--petlux-shadow-2)] ring-4 ring-primary/20">
            <i data-lucide="map-pin" class="w-5 h-5 text-primary-foreground"></i>
          </div>
          <div class="w-px h-3 bg-primary"></div>
        </div>
      </div>

      <!-- 顶部右上角地图控件 -->
      <div class="absolute top-4 right-4 flex flex-col gap-2">
        <button type="button" aria-label="定位我的位置" class="w-10 h-10 rounded-full bg-card shadow-[var(--petlux-shadow-2)] flex items-center justify-center border border-border">
          <i data-lucide="locate" class="w-5 h-5 text-foreground"></i>
        </button>
        <button type="button" aria-label="放大" class="w-10 h-10 rounded-full bg-card shadow-[var(--petlux-shadow-2)] flex items-center justify-center border border-border">
          <i data-lucide="plus" class="w-5 h-5 text-foreground"></i>
        </button>
        <button type="button" aria-label="缩小" class="w-10 h-10 rounded-full bg-card shadow-[var(--petlux-shadow-2)] flex items-center justify-center border border-border">
          <i data-lucide="minus" class="w-5 h-5 text-foreground"></i>
        </button>
      </div>
    </div>

    <!-- 浮动位置卡片 -->
    <div class="location-card absolute left-4 right-4 bottom-6 z-10">
      <div class="bg-card rounded-lg shadow-[var(--petlux-shadow-2)] overflow-hidden">
        <div class="p-4">
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-full bg-accent flex items-center justify-center shrink-0">
              <i data-lucide="map-pin" class="w-5 h-5 text-accent-foreground"></i>
            </div>
            <div class="flex-1 min-w-0">
              <h2 class="location-name text-base font-semibold text-foreground truncate">西岸艺术中心</h2>
              <p class="location-address text-[13px] text-muted-foreground leading-snug mt-1 flex items-start gap-1">
                <i data-lucide="navigation" class="w-3.5 h-3.5 text-muted-foreground shrink-0 mt-0.5"></i>
                <span>上海市徐汇区龙腾大道2555号</span>
              </p>
            </div>
          </div>
        </div>
        <button type="button" class="nav-btn w-full flex items-center justify-center gap-2 py-3 bg-primary text-primary-foreground transition-colors hover:bg-primary/90 active:bg-primary/80">
          <i data-lucide="navigation-2" class="w-4 h-4"></i>
          <span class="nav-btn-text text-sm font-medium">导航到这里</span>
        </button>
      </div>
    </div>
  </section>

</div>
</main>

  if (window.lucide) { lucide.createIcons(); }
