    <style id="theme-vars">
/* ============================================================
   Pet Luxury Mini-Program — Design Token System
   Migrated from olive-green fresh-food app to healing light-luxury pet brand
   Brand prefix: petlux
   ============================================================ */

:root {
  /* ---------- Brand Primary (single hue: warm olive green) ---------- */
  --petlux-brand: #4F5E35;           /* primary olive — CTAs, active states */
  --petlux-brand-deep: #3A4626;      /* hover / pressed step */
  --petlux-brand-soft: #EAEDDF;      /* 8% brand tint for tags, soft fills */
  --petlux-brand-ink: #FAFAF6;       /* text on brand fills */

  /* ---------- Surfaces (olive-tinted — brand primary light variant) ---------- */
  --petlux-bg: #EDF0E2;              /* olive-tinted page base — brand light variant */
  --petlux-surface: #FFFFFF;         /* white card */
  --petlux-surface-2: #E2E6D3;       /* olive hover / selected */
  --petlux-surface-3: #D6DBC5;       /* deeper olive fill */

  /* ---------- Ink (text) ---------- */
  --petlux-ink: #2A2823;             /* primary text — warm near-black */
  --petlux-ink-2: #635E54;           /* secondary text */
  --petlux-ink-3: #9A9489;           /* tertiary / placeholder */

  /* ---------- Lines & Dividers ---------- */
  --petlux-line: #D8DCCE;            /* hairline divider — olive tint */
  --petlux-line-strong: #C9CFBA;     /* emphasized border */

  /* ---------- State Colors (semantic only, never brand) ---------- */
  --petlux-state-success: #5B7C4A;
  --petlux-state-warning: #B8893A;
  --petlux-state-error: #A85B4A;
  --petlux-state-info: #6B7D8C;

  /* ---------- Radius Scale (2 / 8 / 12 / 16) ---------- */
  --petlux-radius-xs: 4px;
  --petlux-radius-sm: 8px;
  --petlux-radius-md: 12px;
  --petlux-radius-lg: 16px;
  --petlux-radius-pill: 999px;

  /* ---------- Shadow (subtle, alpha <= 0.05 for static) ---------- */
  --petlux-shadow-1: 0 1px 3px rgba(42,40,35,0.04), 0 1px 2px rgba(42,40,35,0.03);
  --petlux-shadow-2: 0 8px 24px -8px rgba(42,40,35,0.12);
  --petlux-shadow-3: 0 16px 48px -16px rgba(42,40,35,0.20);

  /* ---------- Spacing (8pt grid) ---------- */
  --petlux-s-1: 4px;
  --petlux-s-2: 8px;
  --petlux-s-3: 12px;
  --petlux-s-4: 16px;
  --petlux-s-5: 24px;
  --petlux-s-6: 32px;
  --petlux-s-7: 48px;

  /* ---------- Typography ---------- */
  --petlux-font-sans: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --petlux-font-latin: "Inter", system-ui, sans-serif;
  --petlux-font-mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;

  --petlux-text-display: 32px;
  --petlux-text-h1: 24px;
  --petlux-text-h2: 20px;
  --petlux-text-h3: 17px;
  --petlux-text-body: 15px;
  --petlux-text-body-sm: 13px;
  --petlux-text-caption: 12px;

  --petlux-leading-tight: 1.2;
  --petlux-leading-normal: 1.55;
  --petlux-leading-relaxed: 1.7;

  --petlux-weight-regular: 400;
  --petlux-weight-medium: 500;
  --petlux-weight-semibold: 600;

  --petlux-tracking-tight: -0.02em;
  --petlux-tracking-normal: 0;
  --petlux-tracking-wide: 0.01em;

  /* ============================================================
     Semantic Aliases — required by apply-html-head-contract.mjs
     ============================================================ */

  --petlux-background: var(--petlux-bg);
  --petlux-foreground: var(--petlux-ink);

  --petlux-card: var(--petlux-surface);
  --petlux-card-foreground: var(--petlux-ink);

  --petlux-popover: var(--petlux-surface);
  --petlux-popover-foreground: var(--petlux-ink);

  --petlux-primary: var(--petlux-brand);
  --petlux-primary-foreground: var(--petlux-brand-ink);

  --petlux-secondary: var(--petlux-surface-2);
  --petlux-secondary-foreground: var(--petlux-ink-2);

  --petlux-muted: var(--petlux-surface-2);
  --petlux-muted-foreground: var(--petlux-ink-2);

  --petlux-accent: var(--petlux-brand-soft);
  --petlux-accent-foreground: var(--petlux-brand);

  --petlux-destructive: var(--petlux-state-error);
  --petlux-destructive-foreground: #FAFAF6;

  --petlux-border: var(--petlux-line);
  --petlux-input: var(--petlux-line-strong);
  --petlux-ring: var(--petlux-brand);

  --petlux-radius-small: var(--petlux-radius-sm);
  --petlux-radius-medium: var(--petlux-radius-md);
  --petlux-radius-large: var(--petlux-radius-lg);
}

/* ---------- Dark mode stub (project is light-only; reserved) ---------- */
.dark {
  --petlux-background: #161612;
  --petlux-foreground: #EDE9E0;
  --petlux-card: #1F1E1A;
  --petlux-card-foreground: #EDE9E0;
  --petlux-popover: #1F1E1A;
  --petlux-popover-foreground: #EDE9E0;
  --petlux-primary: #7A8C5A;
  --petlux-primary-foreground: #161612;
  --petlux-muted: #2A2924;
  --petlux-muted-foreground: #9A9489;
  --petlux-border: #34322C;
  --petlux-input: #34322C;
  --petlux-ring: #7A8C5A;
}

    <style id="gallery-login">
/* ============================================================
   Gallery Exhibition Login — AROORO
   画廊展览风格：静谧、居中、展品般的卡片
   ============================================================ */

/* WXML 标签基础渲染：view 作为块级容器，text 作为行内文本
   （浏览器将未知标签默认视为 inline，需显式纠正） */
.gallery-page view { display: block; }
.gallery-page text { display: inline; }

/* 页面容器：全屏沉浸 */
.gallery-page {
  width: 100%;
  min-height: 100vh;
}

/* 展览空间：垂直居中、充足留白 */
.gallery-space {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 56px 28px;
  gap: 36px;
}

/* ---------- 品牌展区 ---------- */
.brand-exhibit {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.brand-cn {
  font-size: 36px;            /* text-4xl */
  font-weight: 300;           /* font-light */
  letter-spacing: 0.4em;
  color: var(--petlux-foreground);
  line-height: 1.2;
  padding-left: 0.4em;        /* 视觉补偿字距右偏 */
}
.brand-en {
  font-size: 11px;
  font-family: var(--petlux-font-mono);
  letter-spacing: 0.3em;
  color: var(--petlux-muted-foreground);
  padding-left: 0.3em;        /* 视觉补偿字距右偏 */
}
.brand-line {
  width: 48px;                /* w-12 */
  height: 1px;                /* h-px */
  background-color: rgba(99, 94, 84, 0.3); /* muted-foreground/30 */
  margin-top: 6px;
}

/* ---------- 展品卡片 ---------- */
.exhibit-card {
  width: 100%;
  background-color: var(--petlux-card);
  border-radius: var(--petlux-radius-lg); /* 16px */
  padding: 32px;             /* p-8 */
  box-shadow: var(--petlux-shadow-2);
  border: 1px solid rgba(216, 220, 206, 0.6);
}

/* 展品标签 */
.exhibit-label {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 28px;
}
.label-text {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--petlux-muted-foreground);
}
.label-dot {
  width: 6px;                /* w-1.5 */
  height: 6px;               /* h-1.5 */
  border-radius: 9999px;
  background-color: var(--petlux-primary);
  box-shadow: 0 0 0 3px rgba(79, 94, 53, 0.12);
}

/* ---------- 头像区 ---------- */
.form-avatar-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}
.avatar-frame {
  position: relative;
  width: 80px;
  height: 80px;
  border-radius: 9999px;
  border: 1px dashed var(--petlux-border);
  display: flex;
  align-items: center;
  justify-content: center;
}
.avatar-glow {
  position: absolute;
  inset: -8px;
  border-radius: 9999px;
  background: radial-gradient(circle, rgba(79, 94, 53, 0.10) 0%, rgba(79, 94, 53, 0.03) 50%, transparent 72%);
  pointer-events: none;
}
.avatar-picker-wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 9999px;
}
.avatar-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.avatar-placeholder-icon {
  font-size: 26px;
  font-weight: 300;
  color: var(--petlux-muted-foreground);
  line-height: 1;
}
.avatar-caption {
  font-size: 12px;
  color: var(--petlux-muted-foreground);
  letter-spacing: 0.02em;
}

/* ---------- 昵称区 ---------- */
.form-nickname-row {
  /* container */
}
.nickname-label {
  display: block;
  font-size: 14px;           /* text-sm */
  color: var(--petlux-muted-foreground);
  margin-bottom: 10px;
}
.nickname-input-wrap {
  position: relative;
}
.nickname-input {
  width: 100%;
  font-size: 16px;           /* text-base */
  color: var(--petlux-foreground);
  background: transparent;
  border: none;
  outline: none;
  padding: 4px 0;
  font-family: inherit;
}
.nickname-input::placeholder {
  color: var(--petlux-ink-3); /* placeholder text-ink-3 */
}
.nickname-line {
  height: 1px;               /* h-px */
  background-color: var(--petlux-border);
  margin-top: 6px;
  transition: background-color 0.2s ease;
}
.nickname-input:focus + .nickname-line {
  background-color: var(--petlux-primary);
}

/* ---------- 行动区 ---------- */
.action-exhibit {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}
.confirm-btn {
  background-color: var(--petlux-muted);
  color: var(--petlux-muted-foreground);
  border-radius: 9999px;     /* rounded-full */
  padding: 14px 48px;        /* py-3.5 px-12 */
  font-size: 14px;           /* text-sm */
  font-weight: 500;          /* font-medium */
  border: none;
  font-family: inherit;
  letter-spacing: 0.05em;
  cursor: not-allowed;
  transition: all 0.25s ease;
}
.cancel-link {
  margin-top: 18px;          /* mt-4 + 间距 */
}
.cancel-text {
  font-size: 13px;
  color: var(--petlux-muted-foreground);
  letter-spacing: 0.02em;
}
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
<style id="critical-layout">
html, body { max-width: 100%; overflow-x: hidden; }
body { margin: 0; background-color: var(--petlux-background); -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
main > .petlux-shell { width: 100%; max-width: 28rem; margin-left: auto; margin-right: auto; }
</style>
<main>
  <div class="fixed top-0 right-3 z-50 flex items-center w-[88px] h-8 rounded-full border border-black/10 shrink-0" style="top: calc(env(safe-area-inset-top, 0px) + 12px);">
      <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="更多">
        <i data-lucide="more-horizontal" class="w-4 h-4 text-foreground"></i>
      </button>
      <span class="w-px h-3 bg-black/10 block"></span>
      <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
        <i data-lucide="x" class="w-4 h-4 text-foreground"></i>
      </button>
    </div>

<div class="petlux-shell max-w-md mx-auto bg-background min-h-screen relative">
  <view class="gallery-page">
    <view class="gallery-space">

      <!-- 品牌展区 -->
      <view class="brand-exhibit">
        <text class="brand-cn">AROORO</text>
        <text class="brand-en">AROORO</text>
        <view class="brand-line"></view>
      </view>

      <!-- 展品卡片：身份表单 -->
      <view class="exhibit-card">
        <view class="exhibit-label">
          <text class="label-text">身份</text>
          <view class="label-dot"></view>
        </view>

        <view class="form-avatar-row">
          <view class="avatar-frame">
            <view class="avatar-glow"></view>
            <view class="avatar-picker-wrap">
              <view class="avatar-placeholder">
                <text class="avatar-placeholder-icon">+</text>
              </view>
            </view>
          </view>
          <text class="avatar-caption">选择头像</text>
        </view>

        <view class="form-nickname-row">
          <text class="nickname-label">你的名字</text>
          <view class="nickname-input-wrap">
            <input class="nickname-input" type="nickname" placeholder="点击获取微信昵称" />
            <view class="nickname-line"></view>
          </view>
        </view>
      </view>

      <!-- 行动展区 -->
      <view class="action-exhibit">
        <button class="confirm-btn disabled">开始呼噜</button>
        <view class="cancel-link">
          <text class="cancel-text">稍后再说</text>
        </view>
      </view>

    </view>
  </view>
</div>
</main>
<script>lucide.createIcons();</script>
</body>
</html>
