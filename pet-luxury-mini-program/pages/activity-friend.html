    <style id="theme-vars">
/* ============================================================
   Pet Luxury Mini-Program — Design Token System
   Migrated from olive-green fresh-food app to healing light-luxury pet brand
   Brand prefix: petlux
   ============================================================ */

:root {
  /* ---------- Brand Primary (single hue: warm olive green) ---------- */
  --petlux-brand: #4F5E35;           /* primary olive — CTAs, active states */
  --petlux-brand-deep: #3A4626;      /* hover / pressed step */
  --petlux-brand-soft: #EAEDDF;      /* 8% brand tint for tags, soft fills */
  --petlux-brand-ink: #FAFAF6;       /* text on brand fills */

  /* ---------- Surfaces (olive-tinted — brand primary light variant) ---------- */
  --petlux-bg: #EDF0E2;              /* olive-tinted page base — brand light variant */
  --petlux-surface: #FFFFFF;         /* white card */
  --petlux-surface-2: #E2E6D3;       /* olive hover / selected */
  --petlux-surface-3: #D6DBC5;       /* deeper olive fill */

  /* ---------- Ink (text) ---------- */
  --petlux-ink: #2A2823;             /* primary text — warm near-black */
  --petlux-ink-2: #635E54;           /* secondary text */
  --petlux-ink-3: #9A9489;           /* tertiary / placeholder */

  /* ---------- Lines & Dividers ---------- */
  --petlux-line: #D8DCCE;            /* hairline divider — olive tint */
  --petlux-line-strong: #C9CFBA;     /* emphasized border */

  /* ---------- State Colors (semantic only, never brand) ---------- */
  --petlux-state-success: #5B7C4A;
  --petlux-state-warning: #B8893A;
  --petlux-state-error: #A85B4A;
  --petlux-state-info: #6B7D8C;

  /* ---------- Radius Scale (2 / 8 / 12 / 16) ---------- */
  --petlux-radius-xs: 4px;
  --petlux-radius-sm: 8px;
  --petlux-radius-md: 12px;
  --petlux-radius-lg: 16px;
  --petlux-radius-pill: 999px;

  /* ---------- Shadow (subtle, alpha <= 0.05 for static) ---------- */
  --petlux-shadow-1: 0 1px 3px rgba(42,40,35,0.04), 0 1px 2px rgba(42,40,35,0.03);
  --petlux-shadow-2: 0 8px 24px -8px rgba(42,40,35,0.12);
  --petlux-shadow-3: 0 16px 48px -16px rgba(42,40,35,0.20);

  /* ---------- Spacing (8pt grid) ---------- */
  --petlux-s-1: 4px;
  --petlux-s-2: 8px;
  --petlux-s-3: 12px;
  --petlux-s-4: 16px;
  --petlux-s-5: 24px;
  --petlux-s-6: 32px;
  --petlux-s-7: 48px;

  /* ---------- Typography ---------- */
  --petlux-font-sans: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --petlux-font-latin: "Inter", system-ui, sans-serif;
  --petlux-font-mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;

  --petlux-text-display: 32px;
  --petlux-text-h1: 24px;
  --petlux-text-h2: 20px;
  --petlux-text-h3: 17px;
  --petlux-text-body: 15px;
  --petlux-text-body-sm: 13px;
  --petlux-text-caption: 12px;

  --petlux-leading-tight: 1.2;
  --petlux-leading-normal: 1.55;
  --petlux-leading-relaxed: 1.7;

  --petlux-weight-regular: 400;
  --petlux-weight-medium: 500;
  --petlux-weight-semibold: 600;

  --petlux-tracking-tight: -0.02em;
  --petlux-tracking-normal: 0;
  --petlux-tracking-wide: 0.01em;

  /* ============================================================
     Semantic Aliases — required by apply-html-head-contract.mjs
     ============================================================ */

  --petlux-background: var(--petlux-bg);
  --petlux-foreground: var(--petlux-ink);

  --petlux-card: var(--petlux-surface);
  --petlux-card-foreground: var(--petlux-ink);

  --petlux-popover: var(--petlux-surface);
  --petlux-popover-foreground: var(--petlux-ink);

  --petlux-primary: var(--petlux-brand);
  --petlux-primary-foreground: var(--petlux-brand-ink);

  --petlux-secondary: var(--petlux-surface-2);
  --petlux-secondary-foreground: var(--petlux-ink-2);

  --petlux-muted: var(--petlux-surface-2);
  --petlux-muted-foreground: var(--petlux-ink-2);

  --petlux-accent: var(--petlux-brand-soft);
  --petlux-accent-foreground: var(--petlux-brand);

  --petlux-destructive: var(--petlux-state-error);
  --petlux-destructive-foreground: #FAFAF6;

  --petlux-border: var(--petlux-line);
  --petlux-input: var(--petlux-line-strong);
  --petlux-ring: var(--petlux-brand);

  --petlux-radius-small: var(--petlux-radius-sm);
  --petlux-radius-medium: var(--petlux-radius-md);
  --petlux-radius-large: var(--petlux-radius-lg);
}

/* ---------- Dark mode stub (project is light-only; reserved) ---------- */
.dark {
  --petlux-background: #161612;
  --petlux-foreground: #EDE9E0;
  --petlux-card: #1F1E1A;
  --petlux-card-foreground: #EDE9E0;
  --petlux-popover: #1F1E1A;
  --petlux-popover-foreground: #EDE9E0;
  --petlux-primary: #7A8C5A;
  --petlux-primary-foreground: #161612;
  --petlux-muted: #2A2924;
  --petlux-muted-foreground: #9A9489;
  --petlux-border: #34322C;
  --petlux-input: #34322C;
  --petlux-ring: #7A8C5A;
}

<body class="min-h-screen font-sans antialiased">
<style id="critical-layout">
html, body { max-width: 100%; overflow-x: hidden; }
body { margin: 0; background-color: var(--petlux-background); }
img { display: block; max-width: 100%; }
main > .petlux-shell { width: 100%; max-width: 28rem; margin-left: auto; margin-right: auto; }
header[data-topbar] { min-height: 56px; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }
</style>
<style id="petlux-utilities">
  .petlux-tap { transition: background-color .2s ease, opacity .2s ease, border-color .2s ease, color .2s ease; }
  .petlux-tap:active { opacity: .65; }
  .petlux-field {
    border: 1px solid var(--petlux-input);
    border-radius: var(--petlux-radius-sm);
    background-color: var(--petlux-card);
    color: var(--petlux-foreground);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .petlux-field:focus-within {
    border-color: var(--petlux-primary);
    box-shadow: 0 0 0 3px rgba(79,94,53,0.08);
  }
  .petlux-field-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--petlux-foreground);
    font-size: var(--petlux-text-body-sm);
    line-height: var(--petlux-leading-normal);
    padding: 10px 12px;
  }
  .petlux-field-input::placeholder { color: var(--petlux-ink-3); }
  .petlux-gender {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 12px;
    border-radius: var(--petlux-radius-sm);
    border: 1px solid var(--petlux-input);
    background-color: var(--petlux-card);
    color: var(--petlux-ink-2);
    font-size: var(--petlux-text-body-sm);
    transition: all .2s ease;
    cursor: pointer;
  }
  .petlux-gender.is-active {
    border-color: var(--petlux-primary);
    background-color: var(--petlux-brand-soft);
    color: var(--petlux-primary);
  }
  .petlux-gender-dot {
    width: 6px; height: 6px; border-radius: 999px;
    background-color: var(--petlux-ink-3);
    transition: background-color .2s ease;
  }
  .petlux-gender.is-active .petlux-gender-dot { background-color: var(--petlux-primary); }
  .petlux-underline {
    display: block;
    width: 28px;
    height: 2px;
    background: linear-gradient(90deg, var(--petlux-primary) 0%, rgba(79,94,53,0) 100%);
    border-radius: 999px;
  }
  @media (prefers-reduced-motion: reduce) {
    .petlux-tap, .petlux-field, .petlux-gender { transition: none; }
  }
</style>
<main>
  <div class="fixed top-0 right-3 z-50 flex items-center w-[88px] h-8 rounded-full border border-black/10 shrink-0" style="top: calc(env(safe-area-inset-top, 0px) + 12px);">
      <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="更多">
        <i data-lucide="more-horizontal" class="w-4 h-4 text-foreground"></i>
      </button>
      <span class="w-px h-3 bg-black/10 block"></span>
      <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
        <i data-lucide="x" class="w-4 h-4 text-foreground"></i>
      </button>
    </div>

<div class="petlux-shell max-w-md mx-auto bg-background min-h-screen pb-24">

  <!-- 顶部栏 -->
  <header data-topbar class="sticky top-0 z-20 h-14 px-4 flex items-center justify-between bg-background/95 backdrop-blur-sm border-b border-border">
<div class="flex items-center gap-1.5 min-w-0 gap-2">
      <button type="button" aria-label="返回" class="flex items-center justify-center w-8 h-8 -ml-1 text-foreground">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
      <h1 class="text-base font-semibold text-foreground">代好友报名</h1>
      </div>
  </header>

  <!-- 代好友报名信息 -->
  <section class="px-5 pt-6 pb-4">
    <div class="flex items-center gap-2 mb-1">
      <span class="text-xs text-muted-foreground font-mono">01</span>
      <h2 class="text-base font-semibold text-foreground">代好友报名信息</h2>
    </div>
    <span class="petlux-underline mb-5"></span>

    <div class="flex flex-col gap-5">

      <!-- 宠物姓名 -->
      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-foreground flex items-center gap-1">
          宠物姓名
          <span class="text-primary">*</span>
        </label>
        <div class="petlux-field">
          <input
            type="text"
            class="petlux-field-input"
            placeholder="请输入宠物姓名"
            data-field="petName"
          />
        </div>
      </div>

      <!-- 宠物性别 -->
      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-foreground flex items-center gap-1">
          宠物性别
          <span class="text-primary">*</span>
        </label>
        <div class="flex items-center gap-3">
          <button
            type="button"
            class="petlux-gender petlux-tap is-active"
            data-gender="male"
          >
            <span class="petlux-gender-dot"></span>
            <span>弟弟</span>
          </button>
          <button
            type="button"
            class="petlux-gender petlux-tap"
            data-gender="female"
          >
            <span class="petlux-gender-dot"></span>
            <span>妹妹</span>
          </button>
        </div>
      </div>

      <!-- 宠物品种 -->
      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-foreground flex items-center gap-1">
          宠物品种
          <span class="text-primary">*</span>
        </label>
        <div class="petlux-field">
          <input
            type="text"
            class="petlux-field-input"
            placeholder="请输入宠物品种"
            data-field="petBreed"
          />
        </div>
      </div>

      <!-- 联系电话 -->
      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-foreground flex items-center gap-1">
          联系电话
          <span class="text-primary">*</span>
        </label>
        <div class="petlux-field">
          <input
            type="tel"
            inputmode="numeric"
            maxlength="11"
            class="petlux-field-input"
            placeholder="请输入联系电话"
            data-field="phone"
          />
        </div>
      </div>

      <!-- 备注信息（选填） -->
      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-foreground">
          备注信息（选填）
        </label>
        <div class="petlux-field">
          <textarea
            rows="4"
            class="petlux-field-input resize-none"
            placeholder="请输入备注信息"
            data-field="notes"
          ></textarea>
        </div>
      </div>

    </div>
  </section>

</div>

<!-- 底部固定操作栏 -->
<div class="fixed bottom-0 left-0 right-0 z-30">
  <div class="petlux-shell max-w-md mx-auto">
    <div class="flex items-center gap-3 px-5 py-3 bg-background/95 backdrop-blur-sm border-t border-border" style="padding-bottom: calc(12px + env(safe-area-inset-bottom));">
      <button
        type="button"
        class="petlux-tap flex-1 h-11 rounded-md border border-border bg-card text-foreground text-sm font-medium"
      >
        取消
      </button>
      <button
        type="button"
        class="petlux-tap flex-[1.4] h-11 rounded-md bg-primary text-primary-foreground text-sm font-semibold flex items-center justify-center gap-2 shadow-[var(--petlux-shadow-1)]"
      >
        <span>确定</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </div>
  </div>
</div>

</main>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
  if (window.lucide) { lucide.createIcons(); }
  // 性别选择交互
  document.querySelectorAll('.petlux-gender').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.petlux-gender').forEach(function (b) { b.classList.remove('is-active'); });
      btn.classList.add('is-active');
    });
  });
</script>
</body>
