/* ============================================================
   Pet Luxury Mini-Program — Design Token System
   Migrated from olive-green fresh-food app to healing light-luxury pet brand
   Brand prefix: petlux
   ============================================================ */

:root {
  /* ---------- Brand Primary (single hue: warm olive green) ---------- */
  --petlux-brand: #4F5E35;           /* primary olive — CTAs, active states */
  --petlux-brand-deep: #3A4626;      /* hover / pressed step */
  --petlux-brand-soft: #EAEDDF;      /* 8% brand tint for tags, soft fills */
  --petlux-brand-ink: #FAFAF6;       /* text on brand fills */

  /* ---------- Surfaces (olive-tinted — brand primary light variant) ---------- */
  --petlux-bg: #EDF0E2;              /* olive-tinted page base — brand light variant */
  --petlux-surface: #FFFFFF;         /* white card */
  --petlux-surface-2: #E2E6D3;       /* olive hover / selected */
  --petlux-surface-3: #D6DBC5;       /* deeper olive fill */

  /* ---------- Ink (text) ---------- */
  --petlux-ink: #2A2823;             /* primary text — warm near-black */
  --petlux-ink-2: #635E54;           /* secondary text */
  --petlux-ink-3: #9A9489;           /* tertiary / placeholder */

  /* ---------- Lines & Dividers ---------- */
  --petlux-line: #D8DCCE;            /* hairline divider — olive tint */
  --petlux-line-strong: #C9CFBA;     /* emphasized border */

  /* ---------- State Colors (semantic only, never brand) ---------- */
  --petlux-state-success: #5B7C4A;
  --petlux-state-warning: #B8893A;
  --petlux-state-error: #A85B4A;
  --petlux-state-info: #6B7D8C;

  /* ---------- Radius Scale (2 / 8 / 12 / 16) ---------- */
  --petlux-radius-xs: 4px;
  --petlux-radius-sm: 8px;
  --petlux-radius-md: 12px;
  --petlux-radius-lg: 16px;
  --petlux-radius-pill: 999px;

  /* ---------- Shadow (subtle, alpha <= 0.05 for static) ---------- */
  --petlux-shadow-1: 0 1px 3px rgba(42,40,35,0.04), 0 1px 2px rgba(42,40,35,0.03);
  --petlux-shadow-2: 0 8px 24px -8px rgba(42,40,35,0.12);
  --petlux-shadow-3: 0 16px 48px -16px rgba(42,40,35,0.20);

  /* ---------- Spacing (8pt grid) ---------- */
  --petlux-s-1: 4px;
  --petlux-s-2: 8px;
  --petlux-s-3: 12px;
  --petlux-s-4: 16px;
  --petlux-s-5: 24px;
  --petlux-s-6: 32px;
  --petlux-s-7: 48px;

  /* ---------- Typography ---------- */
  --petlux-font-sans: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --petlux-font-latin: "Inter", system-ui, sans-serif;
  --petlux-font-mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;

  --petlux-text-display: 32px;
  --petlux-text-h1: 24px;
  --petlux-text-h2: 20px;
  --petlux-text-h3: 17px;
  --petlux-text-body: 15px;
  --petlux-text-body-sm: 13px;
  --petlux-text-caption: 12px;

  --petlux-leading-tight: 1.2;
  --petlux-leading-normal: 1.55;
  --petlux-leading-relaxed: 1.7;

  --petlux-weight-regular: 400;
  --petlux-weight-medium: 500;
  --petlux-weight-semibold: 600;

  --petlux-tracking-tight: -0.02em;
  --petlux-tracking-normal: 0;
  --petlux-tracking-wide: 0.01em;

  /* ============================================================
     Semantic Aliases — required by apply-html-head-contract.mjs
     ============================================================ */

  --petlux-background: var(--petlux-bg);
  --petlux-foreground: var(--petlux-ink);

  --petlux-card: var(--petlux-surface);
  --petlux-card-foreground: var(--petlux-ink);

  --petlux-popover: var(--petlux-surface);
  --petlux-popover-foreground: var(--petlux-ink);

  --petlux-primary: var(--petlux-brand);
  --petlux-primary-foreground: var(--petlux-brand-ink);

  --petlux-secondary: var(--petlux-surface-2);
  --petlux-secondary-foreground: var(--petlux-ink-2);

  --petlux-muted: var(--petlux-surface-2);
  --petlux-muted-foreground: var(--petlux-ink-2);

  --petlux-accent: var(--petlux-brand-soft);
  --petlux-accent-foreground: var(--petlux-brand);

  --petlux-destructive: var(--petlux-state-error);
  --petlux-destructive-foreground: #FAFAF6;

  --petlux-border: var(--petlux-line);
  --petlux-input: var(--petlux-line-strong);
  --petlux-ring: var(--petlux-brand);

  --petlux-radius-small: var(--petlux-radius-sm);
  --petlux-radius-medium: var(--petlux-radius-md);
  --petlux-radius-large: var(--petlux-radius-lg);
}

/* ---------- Dark mode stub (project is light-only; reserved) ---------- */
.dark {
  --petlux-background: #161612;
  --petlux-foreground: #EDE9E0;
  --petlux-card: #1F1E1A;
  --petlux-card-foreground: #EDE9E0;
  --petlux-popover: #1F1E1A;
  --petlux-popover-foreground: #EDE9E0;
  --petlux-primary: #7A8C5A;
  --petlux-primary-foreground: #161612;
  --petlux-muted: #2A2924;
  --petlux-muted-foreground: #9A9489;
  --petlux-border: #34322C;
  --petlux-input: #34322C;
  --petlux-ring: #7A8C5A;
}

<style id="critical-layout">
html, body { max-width: 100%; overflow-x: hidden; }
body { margin: 0; background-color: var(--petlux-background); -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
main > .petlux-shell { width: 100%; max-width: 28rem; margin-left: auto; margin-right: auto; }
header[data-topbar] { min-height: 56px; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }
</style>
<style id="petlux-utilities">
  .petlux-tap { transition: background-color .2s ease, opacity .2s ease; }
  .petlux-tap:active { opacity: .65; }
  /* address-item 操作按钮 */
  .action-btn { transition: opacity .2s ease; }
  .action-btn:active { opacity: .55; }
  /* 表单输入框 */
  .form-input { -webkit-appearance: none; appearance: none; }
  .form-input::placeholder { color: var(--petlux-ink-3); }
  .form-input:focus { outline: none; border-color: var(--petlux-primary); }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  /* region picker */
  .picker-trigger { cursor: pointer; transition: opacity .2s ease; }
  .picker-trigger:active { opacity: .65; }
  /* 默认开关 */
  .switch { background: var(--petlux-line-strong); transition: background-color .25s ease; cursor: pointer; border: none; }
  .switch[aria-checked="true"] { background: var(--petlux-primary); }
  .switch .switch-dot { transition: transform .25s cubic-bezier(.2,.7,.3,1); }
  .switch[aria-checked="true"] .switch-dot { transform: translateX(20px); }
  /* 编辑弹窗 */
  .modal-wrap { pointer-events: none; }
  .modal-wrap[data-open="true"] { pointer-events: auto; }
  .modal-wrap .modal-mask { opacity: 0; transition: opacity .3s ease; }
  .modal-wrap[data-open="true"] .modal-mask { opacity: 1; }
  .modal-wrap .modal-sheet { transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.7,.3,1); }
  .modal-wrap[data-open="true"] .modal-sheet { transform: translateY(0); }
  /* 按钮按压反馈 */
  .save-btn, .cancel-btn, .add-btn { transition: opacity .2s ease, transform .1s ease; }
  .save-btn:active, .cancel-btn:active, .add-btn:active { opacity: .88; transform: scale(0.99); }
  @media (prefers-reduced-motion: reduce) {
    .petlux-tap, .action-btn, .picker-trigger, .switch, .switch .switch-dot,
    .modal-wrap .modal-mask, .modal-wrap .modal-sheet, .save-btn, .cancel-btn, .add-btn { transition: none; }
  }
</style>

  <div class="fixed bottom-0 left-0 right-0 z-30" style="background: linear-gradient(to top, var(--petlux-bg) 72%, rgba(237,240,226,0));">
    <div class="w-full max-w-md mx-auto px-4 pt-3" style="padding-bottom: max(1.25rem, env(safe-area-inset-bottom));">
      <button type="button" class="add-btn w-full h-12 rounded-full bg-primary text-primary-foreground text-sm font-medium tracking-wide flex items-center justify-center gap-2" style="box-shadow: var(--petlux-shadow-2);" data-open-modal>
        <i data-lucide="plus" class="w-5 h-5"></i>
        新增地址
      </button>
    </div>
  </div>

  <!-- 编辑弹窗：fixed 全屏遮罩(bg-black/40) + 底部 sheet(白卡圆角16px顶部)，默认展示新增地址状态 -->
  <div id="address-modal" class="modal-wrap fixed inset-0 z-50" data-open="true">
    <!-- 遮罩 -->
    <div class="modal-mask absolute inset-0 bg-black/40"></div>
    <!-- 底部 sheet -->
    <div class="modal-sheet absolute bottom-0 left-0 right-0 w-full max-w-md mx-auto bg-card flex flex-col" style="border-top-left-radius: var(--petlux-radius-lg); border-top-right-radius: var(--petlux-radius-lg); box-shadow: var(--petlux-shadow-3); max-height: 90vh;">

      <!-- 顶部抓手 -->
      <div class="flex justify-center pt-3 pb-1">
        <span class="block w-10 h-1 rounded-full" style="background: var(--petlux-line-strong);"></span>
      </div>

      <!-- 弹窗标题"新增地址" + 关闭× -->
      <div class="flex items-center justify-between px-5 py-3">
        <h2 class="text-lg font-medium text-foreground">新增地址</h2>
        <button type="button" aria-label="关闭" class="close-btn w-8 h-8 flex items-center justify-center text-muted-foreground petlux-tap" data-close-modal>
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- 表单：form-item(label+input) + region picker + textarea + switch -->
      <div class="form-area px-5 pb-2 overflow-y-auto no-scrollbar flex-1">
        <div class="space-y-4 py-1">

          <!-- 姓名 -->
          <div class="form-item">
            <label class="block text-[13px] text-muted-foreground mb-1.5">姓名</label>
            <input type="text" class="form-input w-full h-11 px-3 rounded-lg bg-background text-sm text-foreground border border-border" placeholder="请输入收货人姓名" maxlength="20" />
          </div>

          <!-- 手机号 -->
          <div class="form-item">
            <label class="block text-[13px] text-muted-foreground mb-1.5">手机号</label>
            <input type="tel" class="form-input w-full h-11 px-3 rounded-lg bg-background text-sm text-foreground border border-border" placeholder="请输入手机号" maxlength="11" />
          </div>

          <!-- 所在地区 picker -->
          <div class="form-item">
            <label class="block text-[13px] text-muted-foreground mb-1.5">所在地区</label>
            <div class="picker-trigger flex items-center justify-between h-11 px-3 rounded-lg bg-background border border-border">
              <span class="flex items-center gap-2 text-sm text-ink-3">
                <i data-lucide="map-pin" class="w-4 h-4"></i>
                请选择所在地区
              </span>
              <i data-lucide="chevron-right" class="w-4 h-4 text-muted-foreground"></i>
            </div>
          </div>

          <!-- 详细地址 textarea -->
          <div class="form-item">
            <label class="block text-[13px] text-muted-foreground mb-1.5">详细地址</label>
            <textarea class="form-input w-full px-3 py-2.5 rounded-lg bg-background text-sm text-foreground border border-border resize-none leading-relaxed" rows="3" placeholder="请输入详细地址（楼栋、门牌号等）"></textarea>
          </div>

          <!-- 默认开关 -->
          <div class="form-item flex items-center justify-between py-1">
            <span class="text-sm text-foreground">设为默认地址</span>
            <button type="button" class="switch relative w-11 h-6 rounded-full" role="switch" aria-checked="false" aria-label="设为默认地址">
              <span class="switch-dot absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white" style="box-shadow: 0 1px 2px rgba(0,0,0,0.15);"></span>
            </button>
          </div>

        </div>
      </div>

      <!-- 底部：取消(灰底) + 保存(primary 底) -->
      <div class="flex gap-3 px-5 py-4" style="padding-bottom: max(1.25rem, env(safe-area-inset-bottom)); border-top: 1px solid var(--petlux-border);">
        <button type="button" class="cancel-btn flex-1 h-11 rounded-full bg-muted text-foreground text-sm font-medium" style="background-color: var(--petlux-surface-2);" data-close-modal>取消</button>
        <button type="button" class="save-btn flex-1 h-11 rounded-full bg-primary text-primary-foreground text-sm font-medium" style="box-shadow: var(--petlux-shadow-1);">保存</button>
      </div>

    </div>
  </div>

</div>
</main>
<script>
  lucide.createIcons();
  (function () {
    var modal = document.getElementById('address-modal');
    function openModal() { modal.setAttribute('data-open', 'true'); }
    function closeModal() { modal.setAttribute('data-open', 'false'); }

    document.querySelectorAll('[data-open-modal]').forEach(function (el) {
      el.addEventListener('click', openModal);
    });
    document.querySelectorAll('[data-close-modal]').forEach(function (el) {
      el.addEventListener('click', closeModal);
    });
    var mask = modal.querySelector('.modal-mask');
    if (mask) { mask.addEventListener('click', closeModal); }

    document.querySelectorAll('.switch').forEach(function (sw) {
      sw.addEventListener('click', function () {
        var on = sw.getAttribute('aria-checked') === 'true';
        sw.setAttribute('aria-checked', on ? 'false' : 'true');
      });
    });
  })();
</script>
</body>
</html>
