  <circle cx="20" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <!-- 装饰性细节 -->
  <ellipse cx="24" cy="32" rx="3" ry="2" fill="currentColor" opacity="0.3"/>
