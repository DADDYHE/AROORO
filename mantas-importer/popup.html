<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>导入 mantas 商品</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 380px; margin: 0; padding: 14px; font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1f3a1f; }
    h1 { font-size: 15px; margin: 0 0 4px; color: #1f3a1f; }
    .sub { color: #8a8a8a; font-size: 11px; margin-bottom: 10px; }
    .row { margin-bottom: 10px; }
    label { display: block; font-weight: 600; margin-bottom: 3px; }
    input[type=text], input[type=number], textarea {
      width: 100%; padding: 6px 8px; border: 1px solid #cbb98f; border-radius: 6px; font: inherit; background: #fffdf8;
    }
    textarea { resize: vertical; min-height: 48px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .hint { font-size: 11px; color: #8a8a8a; margin-top: 2px; }
    .sku { border: 1px solid #e6ddc6; border-radius: 8px; padding: 8px; margin-bottom: 8px; background: #fbf8f0; }
    .sku .top { display: flex; justify-content: space-between; align-items: center; }
    .sku .del { border: none; background: #f3e3e3; color: #a33; border-radius: 5px; cursor: pointer; padding: 2px 8px; font-size: 11px; }
    .sku .del:hover { background: #eccaca; }
    .sku .g2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 6px; }
    button.primary { width: 100%; padding: 9px; border: none; border-radius: 8px; background: #c9a24b; color: #fff; font-weight: 700; cursor: pointer; font-size: 13px; }
    button.primary:hover { background: #b8913f; }
    button.primary:disabled { background: #d9cda6; cursor: not-allowed; }
    button.ghost { width: 100%; padding: 7px; border: 1px solid #cbb98f; border-radius: 8px; background: #fff; color: #1f3a1f; cursor: pointer; margin-bottom: 8px; }
    button.ghost:hover { background: #fbf8f0; }
    #status { margin-top: 10px; padding: 8px; border-radius: 6px; display: none; white-space: pre-wrap; }
    .ok { background: #e7f3e7; color: #1f6a1f; }
    .err { background: #fbeaea; color: #a33; }
    .warn { background: #fbf3df; color: #8a6d1f; }
    .muted { color: #a8894a; }
  </style>
</head>
<body>
  <h1>mantas 商品一键导入</h1>
  <div class="sub">抓取已登录详情页 → 生成 MGY 编码 → 导入 AROORO 商品库（草稿）</div>

  <div id="status"></div>

  <div class="row">
    <label>商品ID（mantasSkuId）</label>
    <input type="text" id="mantasSkuId" placeholder="从 URL /sku-detail/53775 提取" />
  </div>
  <div class="row">
    <label>商品标题</label>
    <input type="text" id="title" placeholder="商品名称" />
  </div>
  <div class="row">
    <label>分类路径（可选）</label>
    <input type="text" id="categoryPath" placeholder="如：驱虫 / 体内外同驱" />
    <div class="hint">用于匹配商品库已有分类，留空则归入 uncategorized</div>
  </div>

  <div class="row">
    <label>规格 / SKU（每规格一个 MGY 编码，序号自增）</label>
    <div id="skus"></div>
    <button type="button" class="ghost" id="addSku">+ 添加规格</button>
  </div>

  <div class="grid2">
    <div class="row">
      <label>运费（必填）</label>
      <input type="number" id="shipping" step="0.01" min="0" placeholder="如 10" />
      <div class="hint">每次导入输入一次，整商品共用</div>
    </div>
    <div class="row">
      <label>加价倍数</label>
      <input type="number" id="markup" step="0.1" min="0.1" value="1.5" />
      <div class="hint">售价 = 订货价 × 此值</div>
    </div>
  </div>

  <div class="row">
    <label>图片（主图 <span id="imgCount">0</span> · 详情 <span id="detailCount">0</span> 张）</label>
    <label style="font-weight:400"><input type="checkbox" id="useImages" checked /> 导入图片（data URL 直传最可靠）</label>
  </div>

  <div class="row">
    <label>手动粘贴 token（可选，兜底用）</label>
    <input type="text" id="manualToken" placeholder="若后台未登录则粘贴 JWT" />
    <div class="hint">插件会优先读取后台登录态；无则用此处</div>
  </div>

  <button type="button" class="ghost" id="rescrape">重新抓取当前页面</button>
  <button type="button" class="primary" id="import">导入到 AROORO 商品库</button>

  <script src="popup.js"></script>
</body>
</html>
